# CI(project/plans/engineering/website.md §8 W5): markdownlint + docs 検証 + サイトビルド(+ 条件付き GitHub Pages デプロイ)
#
# デプロイは既定で無効。有効化するにはリポジトリの Actions 変数(Settings → Secrets and variables → Actions → Variables)に
#   DEPLOY_PAGES = true
#   SITE_URL     = 公開 URL(例: https://<owner>.github.io/ai-agent-library)
#   SITE_BASE_PATH = サブパス(例: /ai-agent-library。ルート配信なら未設定)
# を設定し、Settings → Pages → Source を「GitHub Actions」にする。
#
# セキュリティ方針(監査バッチ B):
# - 既定の GITHUB_TOKEN は最小権限(contents: read)。書き込みが要るジョブでのみ昇格する
# - checkout は persist-credentials: false(以降のステップに認証情報を残さない)
# - サードパーティを含む全 Action をコミット SHA で固定(タグは可変で改竄されうる)
name: CI

on:
  push:
    branches: [main]
  pull_request:

# 既定は読み取りのみ。deploy ジョブだけが必要な権限を明示的に足す
permissions:
  contents: read

# 同一ブランチの古い実行はキャンセルする(main のデプロイ実行は中断しない)
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      # markdownlint-cli は devDependency として lockfile で固定(旧: npx --yes で毎回取得)
      - name: Audit documentation tooling before installation
        run: npm audit --package-lock-only --audit-level=high
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: markdownlint
        run: npm run lint:md

  # ワークフロー定義自体の静的検査。バイナリは版と SHA256 を固定して取得する
  actionlint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned actionlint
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          set -euo pipefail
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSL --retry 3 --retry-delay 2 --retry-max-time 60 -o "$archive" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${archive}"
          echo "${ACTIONLINT_SHA256}  ${archive}" | sha256sum -c -
          tar -xzf "$archive" actionlint
      - name: Run actionlint
        run: ./actionlint -color

  # docs の規約検証。リンクの Markdown パーサは root lockfile の固定依存を使用する。
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Audit documentation validation dependencies before installation
        run: npm audit --package-lock-only --audit-level=high
      - name: Install audited documentation validation dependencies
        run: npm ci --ignore-scripts
      - name: front matter / 固定 H2 / TODO(要確認) 書式
        run: node scripts/validate-docs.mjs --all
      - name: 相対リンク切れ / セクション README 収録表
        run: node scripts/check-links.mjs
      - name: 必須前提の難易度 graph
        run: node scripts/check-prerequisite-levels.mjs
      - name: ハーネスと文書検証の回帰検査
        run: node --test --test-concurrency=4 tests/unit/*.test.mjs

  harness:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm audit --package-lock-only --audit-level=high
      - run: npm ci --ignore-scripts
      - run: npm run check:harness

  # Windows 固有のパス・worktree・排他・hook adapter を確認する。サイト一式は build job。
  harness-windows:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm audit --package-lock-only --audit-level=high
      - run: npm ci --ignore-scripts
      - run: npm run test:harness:windows

  examples:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            examples/tests/requirements.txt
            examples/python/*/requirements.txt
            harness/requirements-audit.txt
      - name: Install pinned Python dependency auditor
        run: python -m pip install -r harness/requirements-audit.txt
      - name: Audit Python sample dependencies
        run: python -X utf8 -m pip_audit --strict -r examples/tests/requirements.txt --progress-spinner off
      - name: Install audited regression test dependencies
        run: python -m pip install -r examples/tests/requirements.txt
      - name: Python samples regression tests (no API key)
        run: python -X utf8 -B -m unittest discover -s examples/tests -v

  build:
    runs-on: ubuntu-24.04
    # 静的ビルド・検索・図と全ルートのアクセシビリティ回帰を実行する。
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Detect theme changes for before/after evidence
        id: theme-changes
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if git diff --quiet "$BASE_SHA" "$HEAD_SHA" -- website/app/docs.css website/components/home/home.css; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          else
            result=$?
            if [ "$result" -ne 1 ]; then exit "$result"; fi
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json
      - name: Audit website dependencies before installation
        run: npm audit --package-lock-only --audit-level=high
        working-directory: website
      - name: Install dependencies
        run: npm ci
        working-directory: website
      - name: MDX ガード / 静的 HTML 検査の回帰検査
        run: npm test
        working-directory: website
      # prebuild(sync)が未解決リンク・許可外 MDX・読込失敗で exit 1、
      # postbuild が generated/routes.json とのルート網羅を照合して exit 1 する
      - name: Capture bounded read-only Linux mirror diagnostics
        timeout-minutes: 1
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          from contextlib import ExitStack
          import hashlib
          import json
          import os
          import re
          import stat
          from urllib.parse import urlsplit
          
          MIRROR_PATH = '/etc/apt/apt-mirrors.txt'
          MAX_SOURCE = 4096
          MAX_REPORT = 8192
          
          
          class SnapshotRefused(Exception):
              pass
          
          
          def need(condition, reason):
              if not condition:
                  raise SnapshotRefused(reason)
          
          
          def identity(item):
              return tuple(getattr(item, key) for key in (
                  'st_dev', 'st_ino', 'st_mode', 'st_uid', 'st_gid', 'st_nlink',
                  'st_size', 'st_mtime_ns', 'st_ctime_ns'))
          
          
          def read_fixed_mirror():
              directory_flags = os.O_RDONLY | os.O_DIRECTORY | os.O_NOFOLLOW | os.O_NONBLOCK
              with ExitStack() as owned:
                  etc = os.open('/etc', directory_flags)
                  owned.callback(os.close, etc)
                  apt = os.open('apt', directory_flags, dir_fd=etc)
                  owned.callback(os.close, apt)
                  before = os.lstat('apt-mirrors.txt', dir_fd=apt)
                  need(stat.S_ISREG(before.st_mode) and before.st_nlink == 1
                       and before.st_uid == 0 and not (before.st_mode & 0o022)
                       and 0 <= before.st_size <= MAX_SOURCE, 'source-metadata-refused')
                  source = os.open('apt-mirrors.txt', os.O_RDONLY | os.O_NOFOLLOW | os.O_NONBLOCK,
                                   dir_fd=apt)
                  owned.callback(os.close, source)
                  opened = os.fstat(source)
                  need(identity(opened) == identity(before), 'source-open-identity-changed')
                  chunks = []
                  count = 0
                  while True:
                      block = os.read(source, min(1024, MAX_SOURCE + 1 - count))
                      if not block:
                          break
                      chunks.append(block)
                      count += len(block)
                      need(count <= MAX_SOURCE, 'source-read-overflow')
                  after = os.fstat(source)
                  final_path = os.lstat('apt-mirrors.txt', dir_fd=apt)
                  need(count == before.st_size and identity(before) == identity(after)
                       and identity(before) == identity(final_path), 'source-read-identity-changed')
                  data = b''.join(chunks)
                  metadata = {'source': MIRROR_PATH, 'kind': 'regular', 'uid': before.st_uid,
                              'mode': format(stat.S_IMODE(before.st_mode), '04o'),
                              'nlink': before.st_nlink, 'bytes': len(data), 'stable_snapshot': True,
                              'sha256': hashlib.sha256(data).hexdigest()}
                  return data, metadata
          
          
          def capture_eligibility(data):
              try:
                  text = data.decode('ascii')
              except UnicodeDecodeError:
                  return False, 'non-ascii', None
              rows = text.split('\n')
              if rows and rows[-1] == '':
                  rows.pop()
              if not 1 <= len(rows) <= 16:
                  return False, 'row-count', None
              for row in rows:
                  match = re.fullmatch(r'([!-~]{1,512})(?:[ \t]+priority:([0-9]{1,6}))?', row)
                  if match is None:
                      return False, 'row-shape', None
                  url = match.group(1)
                  try:
                      parsed = urlsplit(url)
                      host = parsed.hostname
                      port = parsed.port
                      if parsed.scheme not in ('http', 'https') or not host:
                          return False, 'url-shape', None
                      if parsed.username is not None or parsed.password is not None or '?' in url or '#' in url:
                          return False, 'url-shape', None
                      if parsed.path != '/ubuntu/':
                          return False, 'url-shape', None
                      standard_port = 80 if parsed.scheme == 'http' else 443
                      if port not in (None, standard_port):
                          return False, 'url-shape', None
                      if parsed.netloc not in (host, host + ':' + str(standard_port)):
                          return False, 'url-shape', None
                      if host != 'ubuntu.com' and not host.endswith('.ubuntu.com'):
                          return False, 'host-shape', None
                      if len(host) > 253 or any(re.fullmatch(r'[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?', label) is None
                                                for label in host.split('.')):
                          return False, 'host-shape', None
                  except ValueError:
                      return False, 'url-shape', None
              return True, 'diagnostic-capture-eligible', len(rows)
          
          
          def save_report(report):
              encoded = (json.dumps(report, sort_keys=True, separators=(',', ':')) + '\n').encode('ascii')
              need(len(encoded) <= MAX_REPORT, 'report-overflow')
              flags = os.O_RDONLY | os.O_DIRECTORY | os.O_NOFOLLOW | os.O_NONBLOCK
              with ExitStack() as owned:
                  parent = os.open('.', flags)
                  owned.callback(os.close, parent)
                  for part in ('.local', 'theme-evidence'):
                      try:
                          os.mkdir(part, 0o700, dir_fd=parent)
                      except FileExistsError:
                          pass
                      item = os.lstat(part, dir_fd=parent)
                      need(stat.S_ISDIR(item.st_mode), 'output-parent-refused')
                      parent = os.open(part, flags, dir_fd=parent)
                      owned.callback(os.close, parent)
                  output = os.open('linux-mirror-snapshot.json',
                                   os.O_WRONLY | os.O_CREAT | os.O_EXCL | os.O_NOFOLLOW | os.O_NONBLOCK,
                                   0o600, dir_fd=parent)
                  owned.callback(os.close, output)
                  item = os.fstat(output)
                  need(stat.S_ISREG(item.st_mode) and item.st_nlink == 1, 'output-file-refused')
                  position = 0
                  while position < len(encoded):
                      count = os.write(output, encoded[position:])
                      need(0 < count <= len(encoded) - position, 'output-write-refused')
                      position += count
          
          
          def main():
              report = {'schema': 1, 'purpose': 'diagnostic-capture-not-APT-authorization',
                        'source': MIRROR_PATH, 'eligible': False, 'reason': 'unconfirmed',
                        'base64': None, 'sha256': None, 'snapshot_not_installer_identity_proof': True}
              try:
                  data, metadata = read_fixed_mirror()
                  report.update(metadata)
                  eligible, reason, rows = capture_eligibility(data)
                  report.update(eligible=eligible, reason=reason, rows=rows)
                  if eligible:
                      report['base64'] = base64.b64encode(data).decode('ascii')
              except SnapshotRefused as error:
                  report['reason'] = error.args[0]
              except OSError as error:
                  report.update(reason='source-os-error', errno=error.errno)
              public = {key: value for key, value in report.items() if key != 'base64'}
              try:
                  save_report(report)
              except (SnapshotRefused, OSError):
                  print(json.dumps({'purpose': report['purpose'], 'reason': 'diagnostic-output-refused'}))
                  return 1
              print(json.dumps(public, sort_keys=True, separators=(',', ':')))
              return 0
          
          
          if __name__ == '__main__':
              raise SystemExit(main())
          PY
      - name: Prepare Linux browser dependencies with bounded acquisition
        run: node .github/scripts/prepare-playwright-linux-deps.mjs
        env:
          PLAYWRIGHT_DEPS_PUBLIC_REPOSITORY: ${{ github.event.repository.private == false }}
      - name: Install browsers for regression and appearance checks
        run: npx --no-install playwright install chromium firefox
        working-directory: website
      # PR base の静的出力を同じ撮影helperで比較する。候補CSSを戻した画像をbeforeにしない。
      - name: Check out theme comparison baseline
        if: steps.theme-changes.outputs.changed == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: .local/theme-baseline
          persist-credentials: false
      - name: Audit theme baseline dependencies
        if: steps.theme-changes.outputs.changed == 'true'
        run: npm audit --package-lock-only --audit-level=high
        working-directory: .local/theme-baseline/website
      - name: Install theme baseline dependencies
        if: steps.theme-changes.outputs.changed == 'true'
        run: npm ci
        working-directory: .local/theme-baseline/website
      - name: Build theme comparison baseline
        if: steps.theme-changes.outputs.changed == 'true'
        run: npm run build:clean
        working-directory: .local/theme-baseline/website
        env:
          STATIC_EXPORT: '1'
          NEXT_PUBLIC_BASE_PATH: ${{ vars.SITE_BASE_PATH || '' }}
          NEXT_PUBLIC_SITE_URL: ${{ vars.SITE_URL || '' }}
      - name: Capture theme before screenshots
        if: steps.theme-changes.outputs.changed == 'true'
        run: node scripts/capture-theme-evidence.mjs --export-root ../.local/theme-baseline/website/out --output-dir ../.local/theme-evidence/before --revision "$BASE_SHA"
        working-directory: website
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          NEXT_PUBLIC_BASE_PATH: ${{ vars.SITE_BASE_PATH || '' }}
      - name: Build (static export)
        run: npm run build:clean
        working-directory: website
        env:
          STATIC_EXPORT: '1'
          NEXT_PUBLIC_BASE_PATH: ${{ vars.SITE_BASE_PATH || '' }}
          NEXT_PUBLIC_SITE_URL: ${{ vars.SITE_URL || '' }}
      - name: Capture theme after screenshots
        if: steps.theme-changes.outputs.changed == 'true'
        run: node scripts/capture-theme-evidence.mjs --export-root out --output-dir ../.local/theme-evidence/after --revision "$GITHUB_SHA"
        working-directory: website
        env:
          EVIDENCE_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          NEXT_PUBLIC_BASE_PATH: ${{ vars.SITE_BASE_PATH || '' }}
      - name: Browser regression checks
        run: npm run test:browser
        working-directory: website
        env:
          NEXT_PUBLIC_BASE_PATH: ${{ vars.SITE_BASE_PATH || '' }}
      - name: Firefox site appearance checks
        run: npx playwright test site-appearance.spec.mjs --output ../.local/appearance-results/firefox
        working-directory: website
        env:
          PLAYWRIGHT_BROWSER: firefox
          NEXT_PUBLIC_BASE_PATH: ${{ vars.SITE_BASE_PATH || '' }}
      - name: Retain browser results and theme comparison evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-and-theme-evidence-${{ github.run_id }}
          path: |
            .local/theme-evidence
            .local/appearance-results/firefox
            website/test-results
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 90
      # 検索・キーボード・Mermaid のブラウザー検査を通った出力だけを公開する。
      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: website/out

  audio-browser:
    name: Audio playback regression
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json
      - name: Audit audio test dependencies before installation
        run: npm audit --package-lock-only --audit-level=high
        working-directory: website
      - name: Install audio test dependencies
        run: npm ci
        working-directory: website
      - name: Install audio test browser
        run: npx playwright install --with-deps chromium
        working-directory: website
      # Isolated job: this fixture output is never uploaded as a Pages artifact.
      - name: Build audio test fixture
        run: npm run build:clean
        working-directory: website
        env:
          STATIC_EXPORT: '1'
          AUDIO_TEST_CATALOG: tests/browser/fixtures/audio-catalog.json
          NEXT_PUBLIC_BASE_PATH: /__audio-test
          NEXT_PUBLIC_SITE_URL: http://127.0.0.1:4183/__audio-test
      - name: Audio playback browser checks
        run: npm run test:audio
        working-directory: website
        env:
          AUDIO_TEST_CATALOG: tests/browser/fixtures/audio-catalog.json
          NEXT_PUBLIC_BASE_PATH: /__audio-test
          NEXT_PUBLIC_SITE_URL: http://127.0.0.1:4183/__audio-test

  audio-webkit:
    name: Safari audio playback regression
    # macOS exercises WebKit's AVFoundation backend; Windows/Linux use different media backends.
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json
      - name: Audit audio test dependencies before installation
        run: npm audit --package-lock-only --audit-level=high
        working-directory: website
      - name: Install audio test dependencies
        run: npm ci
        working-directory: website
      - name: Install SVG renderer and WebKit
        run: npx playwright install chromium webkit
        working-directory: website
      - name: Build audio test fixture
        run: npm run build:clean
        working-directory: website
        env:
          STATIC_EXPORT: '1'
          AUDIO_TEST_CATALOG: tests/browser/fixtures/audio-catalog.json
          NEXT_PUBLIC_BASE_PATH: /__audio-test
          NEXT_PUBLIC_SITE_URL: http://127.0.0.1:4183/__audio-test
      - name: Safari audio playback checks
        run: npm run test:audio
        working-directory: website
        env:
          PLAYWRIGHT_BROWSER: webkit
          AUDIO_TEST_CATALOG: tests/browser/fixtures/audio-catalog.json
          NEXT_PUBLIC_BASE_PATH: /__audio-test
          NEXT_PUBLIC_SITE_URL: http://127.0.0.1:4183/__audio-test

      - name: WebKit CSP and JavaScript-disabled diagrams
        run: npm run test:publishing-safety
        working-directory: website
        env:
          PLAYWRIGHT_BROWSER: webkit
          NEXT_PUBLIC_BASE_PATH: /__audio-test
          NEXT_PUBLIC_SITE_URL: http://127.0.0.1:4183/__audio-test
      - name: WebKit site appearance checks
        run: npx playwright test site-appearance.spec.mjs --output ../.local/appearance-results/webkit
        working-directory: website
        env:
          PLAYWRIGHT_BROWSER: webkit
          NEXT_PUBLIC_BASE_PATH: /__audio-test
      - name: Retain WebKit appearance evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: webkit-appearance-evidence-${{ github.run_id }}
          path: .local/appearance-results/webkit
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 90

  deploy:
    if: github.ref == 'refs/heads/main' && vars.DEPLOY_PAGES == 'true'
    needs: [lint, actionlint, build, docs, examples, harness, harness-windows, audio-browser, audio-webkit]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
