name: iOS 26.5 representative UI smoke

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/ios-runtime26-smoke.yml'
      - 'ios/**'
      - 'docs/**'
      - 'LICENSE'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/build-ios-native-content.mjs'
      - 'scripts/lib/ios-*.mjs'
      - 'scripts/lib/md-utils.mjs'
      - 'website/audio/catalog.json'

permissions:
  contents: read

concurrency:
  group: ios-runtime26-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios-runtime26-smoke:
    name: iOS 26.5 representative UI smoke
    # Exact public-repository gate is evaluated before allocating a standard VM.
    if: github.repository == 'pero3dev/ai-agent-library' && github.event.repository.private == false
    runs-on: macos-26
    # Explicit step caps total42min, including4min cleanup and2min artifact upload.
    # UI is followed immediately by owned cleanup. Cancelled app/result audits skip.
    # Forced cancellation/runner loss can still interrupt cleanup or upload.
    timeout-minutes: 40
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      EVIDENCE_DIR: ${{ github.workspace }}/.local/ios-runtime26/evidence
      EXPECTED_SOURCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
      REPOSITORY_IS_PRIVATE: ${{ github.event.repository.private }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        timeout-minutes: 2
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            ios/tools/package-lock.json
      - name: Create fresh private evidence storage
        timeout-minutes: 1
        id: evidence
        run: |
          set -euo pipefail
          [[ ! -L .local && ! -e .local/ios-runtime26 && ! -L .local/ios-runtime26 ]]
          mkdir -p "$EVIDENCE_DIR"
          chmod 700 .local/ios-runtime26 "$EVIDENCE_DIR"
      - name: Verify toolchain and select documented runtime and device type
        timeout-minutes: 3
        id: inventory
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { spawnSync } from 'node:child_process';
          import { existsSync, writeFileSync } from 'node:fs';
          import path from 'node:path';
          const evidence = process.env.EVIDENCE_DIR;
          const put = (name, value) => writeFileSync(path.join(evidence, name), value, { flag: 'wx', mode: 0o600 });
          const json = (name, value) => put(name, JSON.stringify(value, null, 2) + '\n');
          const inventoryStartedMonotonicMs = performance.now();
          const inventoryDeadlineMonotonicMs = inventoryStartedMonotonicMs + 150000;
          const read = (name, binary, args) => {
            const readMonotonicMs = performance.now();
            const remainingBudgetMs = Math.floor(inventoryDeadlineMonotonicMs - readMonotonicMs);
            const timeoutMs = Math.min(120000, Math.max(0, remainingBudgetMs));
            json(name + '.intent.json', { schema_version: 1, binary, arguments: args,
              timeout_ms: timeoutMs, remaining_budget_ms: remainingBudgetMs,
              started_monotonic_ms: inventoryStartedMonotonicMs, deadline_monotonic_ms: inventoryDeadlineMonotonicMs,
              read_monotonic_ms: readMonotonicMs, spawn_planned: remainingBudgetMs > 0 });
            let result;
            if (remainingBudgetMs <= 0) {
              result = { status: null, signal: null, stdout: '', stderr: '',
                error: new Error('Inventory read budget exhausted before spawn') };
            } else {
              try {
                result = spawnSync(binary, args, { encoding: 'utf8', timeout: timeoutMs,
                  killSignal: 'SIGKILL', maxBuffer: 16 * 1024 * 1024 });
              } catch (error) {
                result = { status: null, signal: null, stdout: '', stderr: '',
                  error: error ?? new Error('Unknown inventory spawn exception') };
              }
            }
            put(name + '.stdout.log', result.stdout ?? ''); put(name + '.stderr.log', result.stderr ?? '');
            json(name + '.exit.json', { binary, arguments: args, exit_code: result.status, signal: result.signal,
              error: result.error?.message ?? (result.error === undefined ? null : String(result.error)) });
            assert.equal(result.error, undefined, name); assert.equal(result.status, 0, name);
            assert.ok(performance.now() < inventoryDeadlineMonotonicMs, name + ': inventory deadline exceeded');
            return result.stdout.trim();
          };
          assert.equal(process.env.GITHUB_REPOSITORY, 'pero3dev/ai-agent-library');
          assert.equal(process.env.REPOSITORY_IS_PRIVATE, 'false');
          assert.equal(process.env.DEVELOPER_DIR, '/Applications/Xcode_26.6.app/Contents/Developer');
          assert.ok(existsSync(process.env.DEVELOPER_DIR), 'Documented Xcode missing; no fallback or download');
          const macOS = read('macos', 'sw_vers', ['-productVersion']);
          const architecture = read('architecture', 'uname', ['-m']);
          const Xcode = read('xcode', 'xcodebuild', ['-version']);
          assert.equal(macOS.split('.')[0], '26'); assert.equal(architecture, 'arm64');
          assert.equal(Xcode, 'Xcode 26.6\nBuild version 17F113');
          const sdk = read('simulator-sdk-version', 'xcrun', ['--sdk', 'iphonesimulator', '--show-sdk-version']);
          assert.equal(sdk, '26.5');
          const sdkBuild = read('simulator-sdk-build', 'xcrun', ['--sdk', 'iphonesimulator', '--show-sdk-build-version']);
          const sdkPath = read('simulator-sdk-path', 'xcrun', ['--sdk', 'iphonesimulator', '--show-sdk-path']);
          assert.match(sdkBuild, /^[A-Za-z0-9]+$/); assert.ok(path.isAbsolute(sdkPath) && existsSync(sdkPath));
          const head = read('source-head', 'git', ['rev-parse', 'HEAD']);
          assert.match(head, /^[a-f0-9]{40}$/); assert.equal(head, process.env.EXPECTED_SOURCE_HEAD);
          const tree = read('source-tree', 'git', ['rev-parse', 'HEAD^{tree}']);
          assert.match(tree, /^[a-f0-9]{40}$/);
          const runtimeInventory = JSON.parse(read('simctl-runtimes', 'xcrun', ['simctl', 'list', 'runtimes', '--json']));
          const typeInventory = JSON.parse(read('simctl-device-types', 'xcrun', ['simctl', 'list', 'devicetypes', '--json']));
          assert.ok(Array.isArray(runtimeInventory.runtimes)); assert.ok(Array.isArray(typeInventory.devicetypes));
          const iosVersionRows = runtimeInventory.runtimes.filter(row => row?.version === '26.5' &&
            (row.platform === 'iOS' || row.name === 'iOS 26.5' || String(row.identifier).startsWith('com.apple.CoreSimulator.SimRuntime.iOS-')));
          for (const row of iosVersionRows) {
            assert.equal(row.name, 'iOS 26.5');
            assert.match(row.identifier, /^com\.apple\.CoreSimulator\.SimRuntime\.iOS-[A-Za-z0-9.-]+$/);
            assert.equal(typeof row.isAvailable, 'boolean', 'Unknown availability must fail closed');
            if (row.platform !== undefined) assert.equal(row.platform, 'iOS');
          }
          const available = iosVersionRows.filter(row => row.isAvailable === true);
          assert.equal(available.length, 1, 'Exactly one available iOS 26.5 runtime is required');
          const runtime = available[0];
          assert.equal(typeof runtime.buildversion, 'string'); assert.ok(runtime.buildversion.length > 0);
          const types = typeInventory.devicetypes.filter(row => row?.name === 'iPhone 17');
          assert.equal(types.length, 1, 'Exactly one iPhone 17 device type is required');
          const deviceType = types[0];
          assert.match(deviceType.identifier, /^com\.apple\.CoreSimulator\.SimDeviceType\.[A-Za-z0-9.-]+$/);
          if (deviceType.productFamily !== undefined) assert.equal(deviceType.productFamily, 'iPhone');
          json('selection.json', { schema_version: 1, status: 'selected-from-actual-inventory', source_head: head,
            source_tree: tree, repository: process.env.GITHUB_REPOSITORY, repository_private: false,
            runner_label: 'macos-26', standard_runner: true, macOS, architecture, Xcode,
            developer_directory: process.env.DEVELOPER_DIR, image_OS: process.env.ImageOS ?? null,
            image_version: process.env.ImageVersion ?? null, sdk, sdk_build: sdkBuild, sdk_path: sdkPath,
            runtime, device_type: deviceType,
            inventory_reference: 'https://github.com/actions/runner-images/blob/macos-26-arm64/20261021.0445/images/macos/macos-26-arm64-Readme.md#installed-simulators',
            scope: 'Newer-than-18.5 runtime representative smoke; not current iOS27, minimum-iOS17, device, VoiceOver or performance acceptance.' });
          NODE
      - name: Audit content tooling before installation
        timeout-minutes: 1
        id: root_audit
        run: |
          set -euo pipefail
          npm audit --package-lock-only --audit-level=high 2>&1 | tee "$EVIDENCE_DIR/root-lock-audit.log"
      - name: Install content tooling without lifecycle scripts
        timeout-minutes: 2
        id: root_install
        run: |
          set -euo pipefail
          npm ci --ignore-scripts 2>&1 | tee "$EVIDENCE_DIR/root-npm-ci.log"
      - name: Audit native asset tooling before installation
        timeout-minutes: 1
        id: tools_audit
        working-directory: ios/tools
        run: |
          set -euo pipefail
          npm audit --package-lock-only --audit-level=high 2>&1 | tee "$EVIDENCE_DIR/tools-lock-audit.log"
      - name: Install native assets without lifecycle scripts
        timeout-minutes: 2
        id: tools_install
        working-directory: ios/tools
        run: |
          set -euo pipefail
          npm ci --ignore-scripts 2>&1 | tee "$EVIDENCE_DIR/tools-npm-ci.log"
      - name: Install the lockfile-matched Chromium
        timeout-minutes: 2
        id: browser
        working-directory: ios/tools
        run: |
          set -euo pipefail
          ./node_modules/.bin/playwright install chromium 2>&1 | tee "$EVIDENCE_DIR/chromium-install.log"
      - name: Generate and audit representative three and separate fixture four
        timeout-minutes: 4
        id: content
        run: |
          set -euo pipefail
          # Direct CLI defaults retain representative compatibility before PR261.
          node scripts/build-ios-native-content.mjs 2>&1 | tee "$EVIDENCE_DIR/representative-generation.log"
          node scripts/build-ios-native-content.mjs --fixtures 2>&1 | tee "$EVIDENCE_DIR/fixture-generation.log"
          node ios/tests/native-content-audit.mjs 2>&1 | tee "$EVIDENCE_DIR/representative-source-audit.json"
          node ios/tests/native-content-audit.mjs --fixtures 2>&1 | tee "$EVIDENCE_DIR/fixture-source-audit.json"
          bash ios/tests/check-package.sh ios/AILibrary/Content 3 2>&1 | tee "$EVIDENCE_DIR/representative-consumer.json"
          bash ios/tests/check-package.sh ios/AILibrary/TestContent 4 2>&1 | tee "$EVIDENCE_DIR/fixture-consumer.json"
      - name: Create and boot this job's dedicated Simulator
        timeout-minutes: 4
        id: simulator
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { spawnSync } from 'node:child_process';
          import { randomUUID } from 'node:crypto';
          import { readFileSync, writeFileSync } from 'node:fs';
          import path from 'node:path';
          const evidence = process.env.EVIDENCE_DIR;
          const put = (name, value) => writeFileSync(path.join(evidence, name), value, { flag: 'wx', mode: 0o600 });
          const json = (name, value) => put(name, JSON.stringify(value, null, 2) + '\n');
          const run = (name, args) => {
            const result = spawnSync('xcrun', ['simctl', ...args], { encoding: 'utf8', timeout: 120000, maxBuffer: 16 * 1024 * 1024 });
            put(name + '.stdout.log', result.stdout ?? ''); put(name + '.stderr.log', result.stderr ?? '');
            json(name + '.exit.json', { binary: 'xcrun', arguments: ['simctl', ...args], exit_code: result.status, signal: result.signal, error: result.error?.message ?? null });
            assert.equal(result.error, undefined, name); assert.equal(result.status, 0, name);
            return result.stdout.trim();
          };
          const selection = JSON.parse(readFileSync(path.join(evidence, 'selection.json'), 'utf8'));
          assert.equal(selection.status, 'selected-from-actual-inventory');
          assert.equal(selection.source_head, process.env.EXPECTED_SOURCE_HEAD);
          const before = JSON.parse(run('devices-before-create', ['list', 'devices', '--json']));
          assert.ok(before.devices && typeof before.devices === 'object' && !Array.isArray(before.devices));
          const uuidPattern = /^[A-Fa-f0-9]{8}(?:-[A-Fa-f0-9]{4}){3}-[A-Fa-f0-9]{12}$/;
          const preexisting = [];
          for (const rows of Object.values(before.devices)) {
            assert.ok(Array.isArray(rows));
            for (const row of rows) { assert.match(row.udid, uuidPattern); preexisting.push(row.udid.toUpperCase()); }
          }
          assert.equal(new Set(preexisting).size, preexisting.length);
          const token = randomUUID();
          const name = `AILibrary-runtime26-${process.env.GITHUB_RUN_ID}-${process.env.GITHUB_RUN_ATTEMPT}-${token}`;
          const intent = { schema_version: 1, repository: process.env.GITHUB_REPOSITORY,
            run_id: process.env.GITHUB_RUN_ID, run_attempt: process.env.GITHUB_RUN_ATTEMPT,
            source_head: selection.source_head, token, name, runtime_identifier: selection.runtime.identifier,
            device_type_identifier: selection.device_type.identifier, preexisting_UUIDs: preexisting };
          // Durable intent precedes create. Raw create output/exit survive a later failure.
          json('owned-simulator-intent.json', intent);
          const uuid = run('create-simulator', ['create', name, intent.device_type_identifier, intent.runtime_identifier]);
          assert.match(uuid, uuidPattern); assert.ok(!preexisting.includes(uuid.toUpperCase()));
          json('owned-simulator.json', { ...intent, UUID: uuid.toUpperCase(), creation_exit_code: 0 });
          run('boot-simulator', ['boot', uuid]);
          run('bootstatus-simulator', ['bootstatus', uuid, '-b']);
          const afterBoot = JSON.parse(run('devices-after-boot', ['list', 'devices', '--json']));
          assert.ok(afterBoot.devices && typeof afterBoot.devices === 'object' && !Array.isArray(afterBoot.devices));
          const matches = Object.entries(afterBoot.devices).flatMap(([runtime, rows]) => {
            assert.ok(Array.isArray(rows));
            return rows.filter(device => String(device.udid).toUpperCase() === uuid.toUpperCase())
              .map(device => ({ runtime, device }));
          });
          assert.equal(matches.length, 1); assert.equal(matches[0].runtime, intent.runtime_identifier);
          assert.equal(matches[0].device.name, name); assert.equal(matches[0].device.state, 'Booted');
          assert.equal(matches[0].device.isAvailable, true);
          NODE
      - name: Run only the existing two native UI smoke cases
        timeout-minutes: 8
        id: ui
        run: |
          set -euo pipefail
          owned_uuid="$(node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { spawnSync } from 'node:child_process';
          import { readFileSync, writeFileSync } from 'node:fs';
          import path from 'node:path';
          const owned = JSON.parse(readFileSync(path.join(process.env.EVIDENCE_DIR, 'owned-simulator.json'), 'utf8'));
          assert.equal(owned.creation_exit_code, 0); assert.equal(owned.source_head, process.env.EXPECTED_SOURCE_HEAD);
          assert.equal(owned.run_id, process.env.GITHUB_RUN_ID); assert.equal(owned.run_attempt, process.env.GITHUB_RUN_ATTEMPT);
          assert.match(owned.UUID, /^[A-F0-9]{8}(?:-[A-F0-9]{4}){3}-[A-F0-9]{12}$/);
          const destinations = spawnSync('xcodebuild', ['-showdestinations', '-project', 'ios/AILibrary.xcodeproj', '-scheme', 'AILibrary'],
            { encoding: 'utf8', timeout: 120000, maxBuffer: 16 * 1024 * 1024 });
          const put = (name, value) => writeFileSync(path.join(process.env.EVIDENCE_DIR, name), value, { flag: 'wx', mode: 0o600 });
          put('showdestinations.stdout.log', destinations.stdout ?? ''); put('showdestinations.stderr.log', destinations.stderr ?? '');
          put('showdestinations.exit.json', JSON.stringify({ exit_code: destinations.status, signal: destinations.signal, error: destinations.error?.message ?? null }) + '\n');
          assert.equal(destinations.error, undefined); assert.equal(destinations.status, 0);
          assert.ok(destinations.stdout.toUpperCase().includes(owned.UUID), 'The owned destination must be listed by this project');
          console.log(owned.UUID);
          NODE
          )"
          set +e
          xcodebuild -project ios/AILibrary.xcodeproj -scheme AILibrary \
            -configuration Debug -destination "platform=iOS Simulator,id=$owned_uuid" \
            -destination-timeout 120 \
            -derivedDataPath .local/ios-runtime26/DebugDerivedData \
            -resultBundlePath "$EVIDENCE_DIR/ui.xcresult" \
            -parallel-testing-enabled NO -jobs 2 \
            -only-testing:AILibraryUITests/NativeReaderUITests \
            CODE_SIGNING_ALLOWED=NO test 2>&1 | tee "$EVIDENCE_DIR/xctest-ui.log"
          statuses=("${PIPESTATUS[@]}")
          set -e
          printf '{"xcodebuild_exit_code":%s,"tee_exit_code":%s}\n' "${statuses[0]}" "${statuses[1]}" > "$EVIDENCE_DIR/ui-command.exit.json"
          [[ "${statuses[0]}" -eq 0 && "${statuses[1]}" -eq 0 ]]
      - name: Always clean up only the Simulator created by this job
        timeout-minutes: 4
        id: cleanup
        if: always() && steps.evidence.outcome == 'success'
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { spawnSync } from 'node:child_process';
          import { existsSync, lstatSync, readFileSync, writeFileSync } from 'node:fs';
          import path from 'node:path';
          const evidence = process.env.EVIDENCE_DIR, report = { schema_version: 1, status: 'unresolved' };
          const file = name => path.join(evidence, name);
          const read = name => { assert.ok(lstatSync(file(name)).isFile() && !lstatSync(file(name)).isSymbolicLink()); return JSON.parse(readFileSync(file(name), 'utf8')); };
          const put = (name, value) => writeFileSync(file(name), value, { flag: 'wx', mode: 0o600 });
          const run = (name, args, required = true) => {
            const result = spawnSync('xcrun', ['simctl', ...args], { encoding: 'utf8', timeout: 45000, maxBuffer: 16 * 1024 * 1024 });
            put(name + '.stdout.log', result.stdout ?? ''); put(name + '.stderr.log', result.stderr ?? '');
            put(name + '.exit.json', JSON.stringify({ exit_code: result.status, signal: result.signal, error: result.error?.message ?? null }) + '\n');
            if (required) { assert.equal(result.error, undefined, name); assert.equal(result.status, 0, name); }
            return result;
          };
          const allDevices = value => {
            assert.ok(value.devices && typeof value.devices === 'object' && !Array.isArray(value.devices));
            const found = Object.entries(value.devices).flatMap(([runtime, rows]) => {
              assert.ok(Array.isArray(rows)); return rows.map(device => {
                assert.match(device.udid, /^[A-Fa-f0-9]{8}(?:-[A-Fa-f0-9]{4}){3}-[A-Fa-f0-9]{12}$/);
                return { runtime, device };
              });
            });
            assert.equal(new Set(found.map(({ device }) => device.udid.toUpperCase())).size, found.length);
            return found;
          };
          try {
            if (!existsSync(file('owned-simulator-intent.json'))) {
              assert.ok(!existsSync(file('create-simulator.exit.json')) && !existsSync(file('create-simulator.stdout.log')));
              report.status = 'not-created';
            } else {
              const intent = read('owned-simulator-intent.json');
              assert.equal(intent.repository, process.env.GITHUB_REPOSITORY); assert.equal(intent.source_head, process.env.EXPECTED_SOURCE_HEAD);
              assert.equal(intent.run_id, process.env.GITHUB_RUN_ID); assert.equal(intent.run_attempt, process.env.GITHUB_RUN_ATTEMPT);
              assert.match(intent.token, /^[a-f0-9-]{36}$/);
              assert.equal(intent.name, `AILibrary-runtime26-${intent.run_id}-${intent.run_attempt}-${intent.token}`);
              const creation = read('create-simulator.exit.json');
              assert.equal(creation.exit_code, 0, 'Creation not proven; do not delete any device');
              assert.equal(creation.signal, null); assert.equal(creation.error, null);
              assert.equal(creation.binary, 'xcrun');
              assert.deepEqual(creation.arguments, ['simctl', 'create', intent.name, intent.device_type_identifier, intent.runtime_identifier]);
              const uuid = readFileSync(file('create-simulator.stdout.log'), 'utf8').trim().toUpperCase();
              assert.match(uuid, /^[A-F0-9]{8}(?:-[A-F0-9]{4}){3}-[A-F0-9]{12}$/);
              assert.ok(Array.isArray(intent.preexisting_UUIDs)); assert.ok(!intent.preexisting_UUIDs.includes(uuid));
              const before = allDevices(read('devices-before-create.stdout.log'));
              assert.ok(before.every(({ device }) => String(device.udid).toUpperCase() !== uuid));
              if (existsSync(file('owned-simulator.json'))) {
                const owned = read('owned-simulator.json');
                assert.equal(owned.UUID, uuid); assert.equal(owned.token, intent.token);
                assert.equal(owned.name, intent.name); assert.equal(owned.runtime_identifier, intent.runtime_identifier);
              }
              report.UUID = uuid;
              const current = allDevices(JSON.parse(run('cleanup-devices-before', ['list', 'devices', '--json']).stdout));
              const matches = current.filter(({ device }) => String(device.udid).toUpperCase() === uuid);
              assert.ok(matches.length <= 1, 'Ambiguous UUID ownership');
              if (matches.length === 0) report.status = 'already-absent';
              else {
                const { runtime, device } = matches[0];
                assert.equal(runtime, intent.runtime_identifier); assert.equal(device.name, intent.name);
                if (device.deviceTypeIdentifier !== undefined) assert.equal(device.deviceTypeIdentifier, intent.device_type_identifier);
                let shutdown;
                if (device.state === 'Shutdown') report.shutdown = 'already-shutdown';
                else { shutdown = run('cleanup-shutdown', ['shutdown', uuid], false); report.shutdown_exit_code = shutdown.status; }
                // Even a shutdown error must not prevent a delete attempt of this proven owned UUID.
                const deletion = run('cleanup-delete', ['delete', uuid], false);
                report.delete_exit_code = deletion.status;
                const after = allDevices(JSON.parse(run('cleanup-devices-after', ['list', 'devices', '--json']).stdout));
                assert.ok(after.every(({ device }) => String(device.udid).toUpperCase() !== uuid));
                assert.equal(deletion.error, undefined); assert.equal(deletion.status, 0);
                if (shutdown) { assert.equal(shutdown.error, undefined); assert.equal(shutdown.status, 0); }
                report.status = 'owned-simulator-deleted';
              }
            }
          } catch (error) { report.error = String(error); throw error; }
          finally { put('cleanup.json', JSON.stringify(report, null, 2) + '\n'); }
          NODE
      - name: Audit actual Debug app packages after the attempted UI build
        timeout-minutes: 2
        id: app
        if: always() && !cancelled() && steps.ui.outcome != 'skipped' && steps.evidence.outcome == 'success'
        run: |
          set -euo pipefail
          debug_app='.local/ios-runtime26/DebugDerivedData/Build/Products/Debug-iphonesimulator/AILibrary.app'
          [[ -d "$debug_app" && ! -L "$debug_app" ]]
          cmp ios/AILibrary/Content/manifest.json "$debug_app/Content/manifest.json"
          bash ios/tests/check-package.sh "$debug_app/Content" 3 2>&1 | tee "$EVIDENCE_DIR/debug-app-package.json"
          cmp ios/AILibrary/TestContent/manifest.json "$debug_app/TestContent/manifest.json"
          bash ios/tests/check-package.sh "$debug_app/TestContent" 4 2>&1 | tee "$EVIDENCE_DIR/debug-fixture-package.json"
      - name: Require exactly two passed UI cases from the raw result
        timeout-minutes: 1
        id: results
        if: always() && !cancelled() && steps.ui.outcome != 'skipped' && steps.evidence.outcome == 'success'
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { spawnSync } from 'node:child_process';
          import { readFileSync, writeFileSync } from 'node:fs';
          import path from 'node:path';
          const evidence = process.env.EVIDENCE_DIR;
          const put = (name, value) => writeFileSync(path.join(evidence, name), value, { flag: 'wx', mode: 0o600 });
          const result = spawnSync('xcrun', ['xcresulttool', 'get', 'test-results', 'tests', '--path', path.join(evidence, 'ui.xcresult')],
            { encoding: 'utf8', timeout: 120000, maxBuffer: 16 * 1024 * 1024 });
          put('ui-test-results.stdout.json', result.stdout ?? ''); put('ui-test-results.stderr.log', result.stderr ?? '');
          put('ui-test-results.exit.json', JSON.stringify({ exit_code: result.status, signal: result.signal, error: result.error?.message ?? null }) + '\n');
          assert.equal(result.error, undefined); assert.equal(result.status, 0);
          const tree = JSON.parse(result.stdout), tests = [];
          assert.ok(Array.isArray(tree.testNodes));
          const knownTypes = new Set(['Test Plan', 'UI test bundle', 'Test Suite', 'Test Case']);
          const visit = nodes => { for (const node of nodes) {
            assert.ok(node && typeof node === 'object');
            assert.ok(knownTypes.has(node.nodeType), 'Unknown test node schema must fail closed');
            assert.equal(node.result, 'Passed', 'Skipped or failed test containers are not acceptance');
            if (node.nodeType === 'Test Case') tests.push(node);
            if (node.children !== undefined) { assert.ok(Array.isArray(node.children)); visit(node.children); }
          } };
          visit(tree.testNodes);
          const expected = ['NativeReaderUITests/testContentsBookmarkAndResumeAfterRelaunch()',
            'NativeReaderUITests/testThreeArticlesHaveNativeBodyText()'].sort();
          assert.equal(tests.length, 2, 'No skipped, extra, repeated or unknown UI cases may be accepted');
          assert.deepEqual(tests.map(test => test.nodeIdentifier).sort(), expected);
          for (const test of tests) {
            assert.equal(test.result, 'Passed');
            assert.ok(test.children === undefined || (Array.isArray(test.children) && test.children.length === 0), 'Unexpected case detail/retry schema');
          }
          const devices = tree.devices;
          assert.ok(Array.isArray(devices)); assert.equal(devices.length, 1);
          const owned = JSON.parse(readFileSync(path.join(evidence, 'owned-simulator.json'), 'utf8'));
          assert.equal(devices[0].deviceId.toUpperCase(), owned.UUID);
          assert.equal(devices[0].osVersion, '26.5'); assert.equal(devices[0].platform, 'iOS Simulator');
          if (devices[0].modelName !== undefined) assert.equal(devices[0].modelName, 'iPhone 17');
          put('ui-acceptance.json', JSON.stringify({ schema_version: 1, status: 'exact-two-cases-passed',
            cases: tests.map(({ nodeIdentifier, result }) => ({ nodeIdentifier, result })), devices,
            scope: 'Representative public UI only; fixture resources audited separately. No current iOS27, min17 runtime, physical, VoiceOver or performance acceptance.' }, null, 2) + '\n');
          NODE
      - name: Record completion and all skipped or failed stages
        timeout-minutes: 1
        if: always() && steps.evidence.outcome == 'success'
        env:
          INVENTORY_OUTCOME: ${{ steps.inventory.outcome }}
          ROOT_AUDIT_OUTCOME: ${{ steps.root_audit.outcome }}
          ROOT_INSTALL_OUTCOME: ${{ steps.root_install.outcome }}
          TOOLS_AUDIT_OUTCOME: ${{ steps.tools_audit.outcome }}
          TOOLS_INSTALL_OUTCOME: ${{ steps.tools_install.outcome }}
          BROWSER_OUTCOME: ${{ steps.browser.outcome }}
          CONTENT_OUTCOME: ${{ steps.content.outcome }}
          SIMULATOR_OUTCOME: ${{ steps.simulator.outcome }}
          UI_OUTCOME: ${{ steps.ui.outcome }}
          APP_OUTCOME: ${{ steps.app.outcome }}
          RESULTS_OUTCOME: ${{ steps.results.outcome }}
          CLEANUP_OUTCOME: ${{ steps.cleanup.outcome }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readFileSync, writeFileSync } from 'node:fs';
          import path from 'node:path';
          const outcomes = Object.fromEntries(['INVENTORY', 'ROOT_AUDIT', 'ROOT_INSTALL', 'TOOLS_AUDIT', 'TOOLS_INSTALL', 'BROWSER', 'CONTENT', 'SIMULATOR', 'UI', 'APP', 'RESULTS', 'CLEANUP']
            .map(key => [key.toLowerCase(), process.env[key + '_OUTCOME']]));
          const completed = Object.values(outcomes).every(value => value === 'success');
          let failure = null;
          try {
            assert.ok(completed, 'Skipped, failed, cancelled or unknown stages are not successful acceptance');
            const accepted = JSON.parse(readFileSync(path.join(process.env.EVIDENCE_DIR, 'ui-acceptance.json'), 'utf8'));
            assert.equal(accepted.status, 'exact-two-cases-passed');
            const cleanup = JSON.parse(readFileSync(path.join(process.env.EVIDENCE_DIR, 'cleanup.json'), 'utf8'));
            assert.ok(['owned-simulator-deleted', 'already-absent'].includes(cleanup.status));
          } catch (error) { failure = String(error); }
          const result = { schema_version: 1, status: failure === null ? 'representative-new-runtime-smoke-passed' : 'not-completed',
            source_head: process.env.EXPECTED_SOURCE_HEAD, outcomes,
            failure,
            coverage: 'Existing NativeReaderUITests exact2 on iOS26.5/iPhone17 only; separate representative3/fixture4 resource audits',
            current_iOS27_minimum_iOS17_physical_VoiceOver_performance: 'not-verified' };
          writeFileSync(path.join(process.env.EVIDENCE_DIR, 'summary.json'), JSON.stringify(result, null, 2) + '\n', { flag: 'wx', mode: 0o600 });
          assert.equal(failure, null);
          NODE
      - name: Retain raw context, results and cleanup evidence
        timeout-minutes: 2
        if: always() && steps.evidence.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ios-runtime26-smoke-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: .local/ios-runtime26/evidence
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90
