      - name: Retain compact one-case diagnostic metadata only
        if: always()
        timeout-minutes: 2
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ios-published-copy-probe-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .local/ios-published-candidate/evidence/copy-probe-summary.json
            .local/ios-published-candidate/evidence/copy-probe-context.json
            .local/ios-published-candidate/evidence/copy-probe-device.json
            .local/ios-published-candidate/evidence/copy-probe-command.json
            .local/ios-published-candidate/evidence/copy-probe-tests.json
            .local/ios-published-candidate/evidence/copy-probe-xcode-tail.log
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 90
