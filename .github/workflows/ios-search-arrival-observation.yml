# PRIVATE PROPOSAL ONLY. Temporary Draft branch; never merge into main.
# 20min job / 12min UI are upper caps; forced cancellation/runner loss can interrupt cleanup/export.
name: Temporary search-arrival A/B observation
'on':
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
    paths:
      - .github/workflows/ios-search-arrival-observation.yml
      - ios/**
permissions:
  contents: read
concurrency:
  group: ios-search-arrival-observation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  ios-search-arrival-observation:
    name: Temporary search-arrival A/B observation
    if: >-
      github.event_name == 'pull_request' && github.repository == 'pero3dev/ai-agent-library' &&
      github.event.repository.private == false && github.event.pull_request.draft == true &&
      github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref ==
      'codex/ios-search-arrival-observation' && github.event.pull_request.base.ref == 'main'
    runs-on: macos-15
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
      EVIDENCE_DIR: ${{ github.workspace }}/.local/ios-search-arrival-observation/evidence
      EXPECTED_SOURCE_HEAD: ${{ github.event.pull_request.head.sha }}
      REPOSITORY_IS_PRIVATE: ${{ github.event.repository.private }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        timeout-minutes: 2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        timeout-minutes: 2
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            ios/tools/package-lock.json
      - name: Create fresh private evidence storage
        timeout-minutes: 1
        id: evidence
        run: |
          set -euo pipefail
          [[ ! -L .local && ! -e .local/ios-search-arrival-observation && ! -L .local/ios-search-arrival-observation ]]
          mkdir -p "$EVIDENCE_DIR"
          chmod 700 .local/ios-search-arrival-observation "$EVIDENCE_DIR"
      - name: Verify toolchain and select documented runtime and device type
        timeout-minutes: 1
        id: inventory
        run: >
          set -euo pipefail

          node --input-type=module <<'NODE'

          import assert from 'node:assert/strict';

          import { spawnSync } from 'node:child_process';

          import { existsSync, readFileSync, writeFileSync } from 'node:fs';

          import path from 'node:path';

          const evidence = process.env.EVIDENCE_DIR;

          const put = (name, value) => writeFileSync(path.join(evidence, name), value, { flag: 'wx', mode: 0o600 });

          const json = (name, value) => put(name, JSON.stringify(value, null, 2) + '\n');

          const read = (name, binary, args) => {
            const result = spawnSync(binary, args, { encoding: 'utf8', timeout: 120000, maxBuffer: 16 * 1024 * 1024 });
            put(name + '.stdout.log', result.stdout ?? ''); put(name + '.stderr.log', result.stderr ?? '');
            json(name + '.exit.json', { binary, arguments: args, exit_code: result.status, signal: result.signal, error: result.error?.message ?? null });
            assert.equal(result.error, undefined, name); assert.equal(result.status, 0, name);
            return result.stdout.trim();
          };

          assert.equal(process.env.GITHUB_EVENT_NAME, 'pull_request');

          const event = JSON.parse(readFileSync(process.env.GITHUB_EVENT_PATH, 'utf8'));

          assert.equal(event.repository?.full_name, 'pero3dev/ai-agent-library');
          assert.equal(event.repository?.private, false);

          assert.equal(event.pull_request?.draft, true); assert.equal(event.pull_request?.head?.repo?.full_name,
          'pero3dev/ai-agent-library');

          assert.equal(event.pull_request?.head?.ref, 'codex/ios-search-arrival-observation');
          assert.equal(event.pull_request?.base?.ref, 'main');

          assert.equal(event.pull_request?.head?.sha, process.env.EXPECTED_SOURCE_HEAD);

          assert.ok(Date.now() < Date.parse('2026-11-02T00:00:00Z'), 'Expired one-off observation; no
          fallback/download/paid runner');

          assert.equal(process.env.GITHUB_REPOSITORY, 'pero3dev/ai-agent-library');

          assert.equal(process.env.REPOSITORY_IS_PRIVATE, 'false');

          assert.equal(process.env.DEVELOPER_DIR, '/Applications/Xcode_16.4.app/Contents/Developer');

          assert.ok(existsSync(process.env.DEVELOPER_DIR), 'Documented Xcode missing; no fallback or download');

          const macOS = read('macos', 'sw_vers', ['-productVersion']);

          const architecture = read('architecture', 'uname', ['-m']);

          const Xcode = read('xcode', 'xcodebuild', ['-version']);

          assert.equal(macOS.split('.')[0], '15'); assert.equal(architecture, 'arm64');

          assert.equal(Xcode, 'Xcode 16.4\nBuild version 16F6');

          const sdk = read('simulator-sdk-version', 'xcrun', ['--sdk', 'iphonesimulator', '--show-sdk-version']);

          assert.equal(sdk, '18.5');

          const sdkBuild = read('simulator-sdk-build', 'xcrun', ['--sdk', 'iphonesimulator',
          '--show-sdk-build-version']);

          const sdkPath = read('simulator-sdk-path', 'xcrun', ['--sdk', 'iphonesimulator', '--show-sdk-path']);

          assert.match(sdkBuild, /^[A-Za-z0-9]+$/); assert.ok(path.isAbsolute(sdkPath) && existsSync(sdkPath));

          const head = read('source-head', 'git', ['rev-parse', 'HEAD']);

          assert.match(head, /^[a-f0-9]{40}$/); assert.equal(head, process.env.EXPECTED_SOURCE_HEAD);

          const tree = read('source-tree', 'git', ['rev-parse', 'HEAD^{tree}']);

          assert.match(tree, /^[a-f0-9]{40}$/);

          const base = '3dbdfe4512de9948074fcb74151f2422818bf214';

          const changed = read('source-delta', 'git', ['diff', '--name-only', base,
          'HEAD']).split('\n').filter(Boolean).sort();

          assert.deepEqual(changed, ['.github/workflows/ios-search-arrival-observation.yml',
          'ios/AILibraryUITests/NativeReaderUITests.swift', 'ios/AILibraryUITests/PublishedReaderUITests.swift'].sort(),
          'Only diagnostic3 paths may differ; App/PBX/all other blobs stay at exact3dbd');

          const { createHash } = await import('node:crypto');

          for (const [file, expected] of Object.entries({
            'ios/AILibraryUITests/NativeReaderUITests.swift':'ca6645eb9c068bc5097612c01f11a8ff09e126d1f399f95220eb8733da270fa8',
            'ios/AILibraryUITests/PublishedReaderUITests.swift':'fcb1fcb0263fe7f028424dbcad2376bd7f48b2187a5a172c44edef09f0e8360b',
          })) assert.equal(createHash('sha256').update(readFileSync(file)).digest('hex'), expected);

          json('source-contract.json', { baseline_head: base, observed_head: head, observed_tree: tree, changed_paths:
          changed, main_adoption:false });

          const runtimeInventory = JSON.parse(read('simctl-runtimes', 'xcrun', ['simctl', 'list', 'runtimes',
          '--json']));

          const typeInventory = JSON.parse(read('simctl-device-types', 'xcrun', ['simctl', 'list', 'devicetypes',
          '--json']));

          assert.ok(Array.isArray(runtimeInventory.runtimes)); assert.ok(Array.isArray(typeInventory.devicetypes));

          const iosVersionRows = runtimeInventory.runtimes.filter(row => row?.version === '18.5' &&
            (row.platform === 'iOS' || row.name === 'iOS 18.5' || String(row.identifier).startsWith('com.apple.CoreSimulator.SimRuntime.iOS-')));
          for (const row of iosVersionRows) {
            assert.equal(row.name, 'iOS 18.5');
            assert.match(row.identifier, /^com\.apple\.CoreSimulator\.SimRuntime\.iOS-[A-Za-z0-9.-]+$/);
            assert.equal(typeof row.isAvailable, 'boolean', 'Unknown availability must fail closed');
            if (row.platform !== undefined) assert.equal(row.platform, 'iOS');
          }

          const available = iosVersionRows.filter(row => row.isAvailable === true);

          assert.equal(available.length, 1, 'Exactly one available iOS 18.5 runtime is required');

          const runtime = available[0];

          assert.equal(typeof runtime.buildversion, 'string'); assert.ok(runtime.buildversion.length > 0);

          const types = typeInventory.devicetypes.filter(row => row?.name === 'iPhone 16');

          assert.equal(types.length, 1, 'Exactly one iPhone 16 device type is required');

          const deviceType = types[0];

          assert.match(deviceType.identifier, /^com\.apple\.CoreSimulator\.SimDeviceType\.[A-Za-z0-9.-]+$/);

          if (deviceType.productFamily !== undefined) assert.equal(deviceType.productFamily, 'iPhone');

          json('selection.json', { schema_version: 1, status: 'selected-from-actual-inventory', source_head: head,
            source_tree: tree, repository: process.env.GITHUB_REPOSITORY, repository_private: false,
            runner_label: 'macos-15', standard_runner: true, macOS, architecture, Xcode,
            developer_directory: process.env.DEVELOPER_DIR, image_OS: process.env.ImageOS ?? null,
            image_version: process.env.ImageVersion ?? null, sdk, sdk_build: sdkBuild, sdk_path: sdkPath,
            runtime, device_type: deviceType,
            inventory_reference: 'Existing full iOS18.5 workflow pins; actual inventory is authoritative',
            scope: 'Temporary full199-resource A/B search-arrival observation only; The complete14-case suite is not run; only existing Published A/B. Native2, Release and other OS/device/VoiceOver/performance are excluded.' });
          NODE
      - name: Audit content tooling before installation
        timeout-minutes: 1
        id: root_audit
        run: |
          set -euo pipefail
          npm audit --package-lock-only --audit-level=high 2>&1 | tee "$EVIDENCE_DIR/root-lock-audit.log"
      - name: Install content tooling without lifecycle scripts
        timeout-minutes: 2
        id: root_install
        run: |
          set -euo pipefail
          npm ci --ignore-scripts 2>&1 | tee "$EVIDENCE_DIR/root-npm-ci.log"
      - name: Audit native asset tooling before installation
        timeout-minutes: 1
        id: tools_audit
        working-directory: ios/tools
        run: |
          set -euo pipefail
          npm audit --package-lock-only --audit-level=high 2>&1 | tee "$EVIDENCE_DIR/tools-lock-audit.log"
      - name: Install native assets without lifecycle scripts
        timeout-minutes: 2
        id: tools_install
        working-directory: ios/tools
        run: |
          set -euo pipefail
          npm ci --ignore-scripts 2>&1 | tee "$EVIDENCE_DIR/tools-npm-ci.log"
      - name: Install the lockfile-matched Chromium
        timeout-minutes: 2
        id: browser
        working-directory: ios/tools
        run: |
          set -euo pipefail
          ./node_modules/.bin/playwright install chromium 2>&1 | tee "$EVIDENCE_DIR/chromium-install.log"
      - name: Count tracked published source articles independently
        run: |
          set -euo pipefail
          expected_articles="$(node --input-type=module <<'NODE'
          import { execFileSync } from 'node:child_process';
          import { readFileSync, writeFileSync } from 'node:fs';
          import { parseFrontMatter, parseScalar, toLines } from './scripts/lib/md-utils.mjs';
          const files = execFileSync('git', ['ls-files', '-z', 'docs'], { encoding: 'utf8' })
            .split('\0').filter(file => /^docs\/\d{2}-[a-z0-9-]+\/[a-z0-9-]+\.md$/.test(file));
          const articles = files.filter(file => {
            const fields = parseFrontMatter(toLines(readFileSync(file, 'utf8')))?.fields ?? [];
            const statuses = fields.filter(field => field.key === 'status');
            if (statuses.length !== 1) throw new Error(`Expected one source status: ${file}`);
            return parseScalar(statuses[0].value) === 'published';
          }).sort();
          if (!articles.length || articles.length > 2000) throw new Error('Invalid tracked published article count');
          writeFileSync(process.env.EVIDENCE_DIR + '/published-sources.json',
            JSON.stringify({ articles: articles.length, source_paths: articles }, null, 2) + '\n');
          console.log(articles.length);
          NODE
          )"
          [[ "$expected_articles" =~ ^[1-9][0-9]*$ ]]
          printf 'PUBLISHED_ARTICLE_COUNT=%s\n' "$expected_articles" >> "$GITHUB_ENV"
        id: count
        timeout-minutes: 1
      - name: Generate and audit full published and fixture4 exactly as full workflow
        timeout-minutes: 5
        id: content
        run: |
          set -euo pipefail
          npm run ios:prepare \
            2>&1 | tee $EVIDENCE_DIR/published-generation.log
          node scripts/build-ios-native-content.mjs --fixtures \
            2>&1 | tee $EVIDENCE_DIR/fixture-generation.log
          npm run --silent ios:test:content \
            2>&1 | tee $EVIDENCE_DIR/published-source-audit.json
          node ios/tests/native-content-audit.mjs --fixtures \
            2>&1 | tee $EVIDENCE_DIR/fixture-source-audit.json
          npm run --silent ios:test:package -- "$PUBLISHED_ARTICLE_COUNT" \
            2>&1 | tee $EVIDENCE_DIR/published-package.json
          bash ios/tests/check-package.sh ios/AILibrary/TestContent 4 \
            2>&1 | tee $EVIDENCE_DIR/fixture-package.json
      - name: Create and boot this job's dedicated Simulator
        timeout-minutes: 4
        id: simulator
        run: >
          set -euo pipefail

          node --input-type=module <<'NODE'

          import assert from 'node:assert/strict';

          import { spawnSync } from 'node:child_process';

          import { randomUUID } from 'node:crypto';

          import { readFileSync, writeFileSync } from 'node:fs';

          import path from 'node:path';

          const evidence = process.env.EVIDENCE_DIR;

          const put = (name, value) => writeFileSync(path.join(evidence, name), value, { flag: 'wx', mode: 0o600 });

          const json = (name, value) => put(name, JSON.stringify(value, null, 2) + '\n');

          const run = (name, args) => {
            const result = spawnSync('xcrun', ['simctl', ...args], { encoding: 'utf8', timeout: 120000, maxBuffer: 16 * 1024 * 1024 });
            put(name + '.stdout.log', result.stdout ?? ''); put(name + '.stderr.log', result.stderr ?? '');
            json(name + '.exit.json', { binary: 'xcrun', arguments: ['simctl', ...args], exit_code: result.status, signal: result.signal, error: result.error?.message ?? null });
            assert.equal(result.error, undefined, name); assert.equal(result.status, 0, name);
            return result.stdout.trim();
          };

          const selection = JSON.parse(readFileSync(path.join(evidence, 'selection.json'), 'utf8'));

          assert.equal(selection.status, 'selected-from-actual-inventory');

          assert.equal(selection.source_head, process.env.EXPECTED_SOURCE_HEAD);

          const before = JSON.parse(run('devices-before-create', ['list', 'devices', '--json']));

          assert.ok(before.devices && typeof before.devices === 'object' && !Array.isArray(before.devices));

          const uuidPattern = /^[A-Fa-f0-9]{8}(?:-[A-Fa-f0-9]{4}){3}-[A-Fa-f0-9]{12}$/;

          const preexisting = [];

          for (const rows of Object.values(before.devices)) {
            assert.ok(Array.isArray(rows));
            for (const row of rows) { assert.match(row.udid, uuidPattern); preexisting.push(row.udid.toUpperCase()); }
          }

          assert.equal(new Set(preexisting).size, preexisting.length);

          const token = randomUUID();

          const name =
          `AILibrary-search-arrival-${process.env.GITHUB_RUN_ID}-${process.env.GITHUB_RUN_ATTEMPT}-${token}`;

          const intent = { schema_version: 1, repository: process.env.GITHUB_REPOSITORY,
            run_id: process.env.GITHUB_RUN_ID, run_attempt: process.env.GITHUB_RUN_ATTEMPT,
            source_head: selection.source_head, token, name, runtime_identifier: selection.runtime.identifier,
            device_type_identifier: selection.device_type.identifier, preexisting_UUIDs: preexisting };
          // Durable intent precedes create. Raw create output/exit survive a later failure.

          json('owned-simulator-intent.json', intent);

          const uuid = run('create-simulator', ['create', name, intent.device_type_identifier,
          intent.runtime_identifier]);

          assert.match(uuid, uuidPattern); assert.ok(!preexisting.includes(uuid.toUpperCase()));

          json('owned-simulator.json', { ...intent, UUID: uuid.toUpperCase(), creation_exit_code: 0 });

          run('boot-simulator', ['boot', uuid]);

          run('bootstatus-simulator', ['bootstatus', uuid, '-b']);

          const afterBoot = JSON.parse(run('devices-after-boot', ['list', 'devices', '--json']));

          assert.ok(afterBoot.devices && typeof afterBoot.devices === 'object' && !Array.isArray(afterBoot.devices));

          const matches = Object.entries(afterBoot.devices).flatMap(([runtime, rows]) => {
            assert.ok(Array.isArray(rows));
            return rows.filter(device => String(device.udid).toUpperCase() === uuid.toUpperCase())
              .map(device => ({ runtime, device }));
          });

          assert.equal(matches.length, 1); assert.equal(matches[0].runtime, intent.runtime_identifier);

          assert.equal(matches[0].device.name, name); assert.equal(matches[0].device.state, 'Booted');

          assert.equal(matches[0].device.isAvailable, true);

          NODE
      - name: Observe only existing Published search-arrival A and B
        timeout-minutes: 12
        id: ui
        run: >
          set -euo pipefail

          owned_uuid="$(node --input-type=module <<'NODE'

          import assert from 'node:assert/strict';

          import { spawnSync } from 'node:child_process';

          import { readFileSync, writeFileSync } from 'node:fs';

          import path from 'node:path';

          const owned = JSON.parse(readFileSync(path.join(process.env.EVIDENCE_DIR, 'owned-simulator.json'), 'utf8'));

          assert.equal(owned.creation_exit_code, 0); assert.equal(owned.source_head, process.env.EXPECTED_SOURCE_HEAD);

          assert.equal(owned.run_id, process.env.GITHUB_RUN_ID); assert.equal(owned.run_attempt,
          process.env.GITHUB_RUN_ATTEMPT);

          assert.match(owned.UUID, /^[A-F0-9]{8}(?:-[A-F0-9]{4}){3}-[A-F0-9]{12}$/);

          const destinations = spawnSync('xcodebuild', ['-showdestinations', '-project', 'ios/AILibrary.xcodeproj',
          '-scheme', 'AILibrary'],
            { encoding: 'utf8', timeout: 120000, maxBuffer: 16 * 1024 * 1024 });
          const put = (name, value) => writeFileSync(path.join(process.env.EVIDENCE_DIR, name), value, { flag: 'wx',
          mode: 0o600 });

          put('showdestinations.stdout.log', destinations.stdout ?? ''); put('showdestinations.stderr.log',
          destinations.stderr ?? '');

          put('showdestinations.exit.json', JSON.stringify({ exit_code: destinations.status, signal:
          destinations.signal, error: destinations.error?.message ?? null }) + '\n');

          // Contract v2: the unbound listing is diagnostic; explicit owned settings

          // establish only the project context for attempting the existing two tests.

          const selection = JSON.parse(readFileSync(path.join(process.env.EVIDENCE_DIR, 'selection.json'), 'utf8'));

          const boundArguments = ['-project', 'ios/AILibrary.xcodeproj', '-scheme', 'AILibrary', '-configuration', 'Debug',

            '-sdk', 'iphonesimulator', '-destination', `platform=iOS Simulator,id=${owned.UUID}`,

            '-destination-timeout', '15', '-showBuildSettings', '-json'];

          let bound;

          try {

            bound = spawnSync('xcodebuild', boundArguments,

              { encoding: 'utf8', timeout: 120000, killSignal: 'SIGKILL', maxBuffer: 2 * 1024 * 1024 });

          } catch (error) {

            bound = { status: null, signal: null, stdout: '', stderr: '', error };

          }

          const errorFields = error => error ? {

            name: error.name ?? null, message: error.message ?? String(error), code: error.code ?? null,

            errno: error.errno ?? null, syscall: error.syscall ?? null,

          } : null;

          put('destination-bound-settings.stdout.log', bound.stdout ?? '');

          put('destination-bound-settings.stderr.log', bound.stderr ?? '');

          put('destination-bound-settings.exit.json', JSON.stringify({ binary: 'xcodebuild', arguments: boundArguments,

            timeout_ms: 120000, exit_code: bound.status ?? null, signal: bound.signal ?? null,

            error: errorFields(bound.error) }, null, 2) + '\n');

          const report = {

            schema_version: 1, contract_version: 2, status: 'rejected',

            source_head: owned.source_head, run_id: owned.run_id, run_attempt: owned.run_attempt, owned_UUID: owned.UUID,

            unbound_listing_role: 'diagnostic-only; read completion must still succeed; UUID substring is not acceptance',

            bound_settings_role: 'strict project-context preflight only; actual exact-two UI results still required',

            signing_assignment_added: false, prior_failed_runs_reclassified: false,

          };

          try {

            // Preserve primary command/error/status checks; even a bound result does not

            // hide a failed initial read. The old UUID-listing requirement is superseded.

            assert.equal(destinations.error, undefined); assert.equal(destinations.status, 0);

            assert.equal(bound.error, undefined); assert.equal(bound.status, 0);

            assert.equal(selection.source_head, owned.source_head);

            assert.equal(selection.sdk, '18.5'); assert.equal(selection.sdk_build, '22F76');

            assert.equal(selection.runtime.version, '18.5');

            assert.equal(selection.runtime.identifier, owned.runtime_identifier);

            assert.equal(selection.device_type.identifier, owned.device_type_identifier);

            assert.equal(selection.device_type.modelIdentifier, 'iPhone17,3');

            assert.equal(typeof selection.sdk_path, 'string'); assert.ok(path.isAbsolute(selection.sdk_path));

            const targets = JSON.parse(bound.stdout);

            assert.ok(Array.isArray(targets) && targets.length === 1, 'Exactly the observed App target must be returned');

            const target = targets[0];

            assert.ok(target && typeof target === 'object' && !Array.isArray(target));

            assert.equal(target.target, 'AILibrary'); assert.equal(target.action, 'build');

            const settings = target.buildSettings;

            assert.ok(settings && typeof settings === 'object' && !Array.isArray(settings));

            const expected = {

              TARGET_NAME: 'AILibrary', PRODUCT_NAME: 'AILibrary', PRODUCT_MODULE_NAME: 'AILibrary',

              PRODUCT_BUNDLE_IDENTIFIER: 'dev.pero3.aiagentlibrary.prototype', CONFIGURATION: 'Debug',

              TARGET_DEVICE_MODEL: selection.device_type.modelIdentifier, TARGET_DEVICE_OS_VERSION: '18.5',

              TARGET_DEVICE_PLATFORM_NAME: 'iphonesimulator', PLATFORM_NAME: 'iphonesimulator',

              EFFECTIVE_PLATFORM_NAME: '-iphonesimulator', SDK_NAME: 'iphonesimulator18.5', SDK_VERSION: '18.5',

              SDK_PRODUCT_BUILD_VERSION: selection.sdk_build, SDKROOT: selection.sdk_path,

              IPHONEOS_DEPLOYMENT_TARGET: '17.0', TARGETED_DEVICE_FAMILY: '1', SUPPORTED_PLATFORMS: 'iphoneos iphonesimulator',

            };

            for (const [key, value] of Object.entries(expected)) {

              assert.equal(typeof settings[key], 'string', `Missing or nonstring bound setting: ${key}`);

              assert.equal(settings[key], value, `Wrong bound setting: ${key}`);

            }

            assert.equal(typeof settings.TARGET_DEVICE_IDENTIFIER, 'string');

            assert.match(settings.TARGET_DEVICE_IDENTIFIER, /^[a-fA-F0-9]{8}(?:-[a-fA-F0-9]{4}){3}-[a-fA-F0-9]{12}$/);

            assert.equal(settings.TARGET_DEVICE_IDENTIFIER.toUpperCase(), owned.UUID);

            report.status = 'accepted-for-existing-test-attempt-only';

            report.verified_target = target.target;

            report.verified_settings = { ...expected, TARGET_DEVICE_IDENTIFIER: settings.TARGET_DEVICE_IDENTIFIER };

            report.read_only_CODE_SIGNING_ALLOWED = typeof settings.CODE_SIGNING_ALLOWED === 'string' ? settings.CODE_SIGNING_ALLOWED : null;

          } catch (error) {

            report.failure = errorFields(error);

            throw error;

          } finally {

            put('bound-destination-preflight.json', JSON.stringify(report, null, 2) + '\n');

          }

          console.log(owned.UUID);

          NODE

          )"

          set +e

          xcodebuild -project ios/AILibrary.xcodeproj -scheme AILibrary \
            -configuration Debug -destination "platform=iOS Simulator,id=$owned_uuid" \
            -destination-timeout 120 \
            -derivedDataPath .local/ios-search-arrival-observation/DebugDerivedData \
            -resultBundlePath "$EVIDENCE_DIR/ui.xcresult" \
            -parallel-testing-enabled NO -jobs 2 \
            -only-testing:AILibraryUITests/PublishedReaderUITests/testBodySearchArrivesAtNestedParagraphContainingAllTermsWithoutReaderGestures \
            -only-testing:AILibraryUITests/PublishedReaderUITests/testResumeUsesLaterReadingPositionInsteadOfReplayingThePreviousBodyQuery \
            CODE_SIGNING_ALLOWED=NO test 2>&1 | tee "$EVIDENCE_DIR/xctest-ui.log"
          statuses=("${PIPESTATUS[@]}")

          set -e

          printf '{"xcodebuild_exit_code":%s,"tee_exit_code":%s}\n' "${statuses[0]}" "${statuses[1]}" >
          "$EVIDENCE_DIR/ui-command.exit.json"

          [[ "${statuses[0]}" -eq 0 && "${statuses[1]}" -eq 0 ]]
        env:
          TEST_RUNNER_AILIBRARY_EXPECTED_PUBLISHED_COUNT: ${{ env.PUBLISHED_ARTICLE_COUNT }}
      - name: Always clean up only the Simulator created by this job
        timeout-minutes: 4
        id: cleanup
        if: always() && steps.evidence.outcome == 'success'
        run: >
          set -euo pipefail

          node --input-type=module <<'NODE'

          import assert from 'node:assert/strict';

          import { spawnSync } from 'node:child_process';

          import { existsSync, lstatSync, readFileSync, writeFileSync } from 'node:fs';

          import path from 'node:path';

          const evidence = process.env.EVIDENCE_DIR, report = { schema_version: 1, status: 'unresolved' };

          const file = name => path.join(evidence, name);

          const read = name => { assert.ok(lstatSync(file(name)).isFile() && !lstatSync(file(name)).isSymbolicLink());
          return JSON.parse(readFileSync(file(name), 'utf8')); };

          const put = (name, value) => writeFileSync(file(name), value, { flag: 'wx', mode: 0o600 });

          const run = (name, args, required = true) => {
            const result = spawnSync('xcrun', ['simctl', ...args], { encoding: 'utf8', timeout: 45000, maxBuffer: 16 * 1024 * 1024 });
            put(name + '.stdout.log', result.stdout ?? ''); put(name + '.stderr.log', result.stderr ?? '');
            put(name + '.exit.json', JSON.stringify({ exit_code: result.status, signal: result.signal, error: result.error?.message ?? null }) + '\n');
            if (required) { assert.equal(result.error, undefined, name); assert.equal(result.status, 0, name); }
            return result;
          };

          const allDevices = value => {
            assert.ok(value.devices && typeof value.devices === 'object' && !Array.isArray(value.devices));
            const found = Object.entries(value.devices).flatMap(([runtime, rows]) => {
              assert.ok(Array.isArray(rows)); return rows.map(device => {
                assert.match(device.udid, /^[A-Fa-f0-9]{8}(?:-[A-Fa-f0-9]{4}){3}-[A-Fa-f0-9]{12}$/);
                return { runtime, device };
              });
            });
            assert.equal(new Set(found.map(({ device }) => device.udid.toUpperCase())).size, found.length);
            return found;
          };

          try {
            if (!existsSync(file('owned-simulator-intent.json'))) {
              assert.ok(!existsSync(file('create-simulator.exit.json')) && !existsSync(file('create-simulator.stdout.log')));
              report.status = 'not-created';
            } else {
              const intent = read('owned-simulator-intent.json');
              assert.equal(intent.repository, process.env.GITHUB_REPOSITORY); assert.equal(intent.source_head, process.env.EXPECTED_SOURCE_HEAD);
              assert.equal(intent.run_id, process.env.GITHUB_RUN_ID); assert.equal(intent.run_attempt, process.env.GITHUB_RUN_ATTEMPT);
              assert.match(intent.token, /^[a-f0-9-]{36}$/);
              assert.equal(intent.name, `AILibrary-search-arrival-${intent.run_id}-${intent.run_attempt}-${intent.token}`);
              const creation = read('create-simulator.exit.json');
              assert.equal(creation.exit_code, 0, 'Creation not proven; do not delete any device');
              assert.equal(creation.signal, null); assert.equal(creation.error, null);
              assert.equal(creation.binary, 'xcrun');
              assert.deepEqual(creation.arguments, ['simctl', 'create', intent.name, intent.device_type_identifier, intent.runtime_identifier]);
              const uuid = readFileSync(file('create-simulator.stdout.log'), 'utf8').trim().toUpperCase();
              assert.match(uuid, /^[A-F0-9]{8}(?:-[A-F0-9]{4}){3}-[A-F0-9]{12}$/);
              assert.ok(Array.isArray(intent.preexisting_UUIDs)); assert.ok(!intent.preexisting_UUIDs.includes(uuid));
              const before = allDevices(read('devices-before-create.stdout.log'));
              assert.ok(before.every(({ device }) => String(device.udid).toUpperCase() !== uuid));
              if (existsSync(file('owned-simulator.json'))) {
                const owned = read('owned-simulator.json');
                assert.equal(owned.UUID, uuid); assert.equal(owned.token, intent.token);
                assert.equal(owned.name, intent.name); assert.equal(owned.runtime_identifier, intent.runtime_identifier);
              }
              report.UUID = uuid;
              const current = allDevices(JSON.parse(run('cleanup-devices-before', ['list', 'devices', '--json']).stdout));
              const matches = current.filter(({ device }) => String(device.udid).toUpperCase() === uuid);
              assert.ok(matches.length <= 1, 'Ambiguous UUID ownership');
              if (matches.length === 0) report.status = 'already-absent';
              else {
                const { runtime, device } = matches[0];
                assert.equal(runtime, intent.runtime_identifier); assert.equal(device.name, intent.name);
                if (device.deviceTypeIdentifier !== undefined) assert.equal(device.deviceTypeIdentifier, intent.device_type_identifier);
                let shutdown;
                if (device.state === 'Shutdown') report.shutdown = 'already-shutdown';
                else { shutdown = run('cleanup-shutdown', ['shutdown', uuid], false); report.shutdown_exit_code = shutdown.status; }
                // Even a shutdown error must not prevent a delete attempt of this proven owned UUID.
                const deletion = run('cleanup-delete', ['delete', uuid], false);
                report.delete_exit_code = deletion.status;
                const after = allDevices(JSON.parse(run('cleanup-devices-after', ['list', 'devices', '--json']).stdout));
                assert.ok(after.every(({ device }) => String(device.udid).toUpperCase() !== uuid));
                assert.equal(deletion.error, undefined); assert.equal(deletion.status, 0);
                if (shutdown) { assert.equal(shutdown.error, undefined); assert.equal(shutdown.status, 0); }
                report.status = 'owned-simulator-deleted';
              }
            }
          } catch (error) { report.error = String(error); throw error; }

          finally { put('cleanup.json', JSON.stringify(report, null, 2) + '\n'); }

          NODE
      - name: Export raw A/B tests and attachments on the same Xcode host
        timeout-minutes: 3
        id: results
        if: always() && !cancelled() && steps.ui.outcome != 'skipped' && steps.evidence.outcome == 'success'
        run: >
          set -euo pipefail

          node --input-type=module <<'NODE'

          import assert from 'node:assert/strict';

          import { spawnSync } from 'node:child_process';

          import { existsSync, readFileSync, writeFileSync, readdirSync, lstatSync, copyFileSync, rmSync } from
          'node:fs';

          import path from 'node:path';

          const evidence = process.env.EVIDENCE_DIR, bundle = path.join(evidence, 'ui.xcresult');

          const put = (name, value) => writeFileSync(path.join(evidence, name), value, { flag:'wx', mode:0o600 });

          const run = (name, args) => {
            const result = spawnSync('xcrun', ['xcresulttool', ...args], { encoding:'utf8', timeout:90000, killSignal:'SIGKILL', maxBuffer:16*1024*1024 });
            put(name+'.stdout.log', result.stdout ?? ''); put(name+'.stderr.log', result.stderr ?? '');
            put(name+'.exit.json', JSON.stringify({ arguments:args, exit_code:result.status, signal:result.signal, error:result.error?.message ?? null })+'\n');
            assert.equal(result.error, undefined); assert.equal(result.status, 0); return result.stdout;
          };

          let observation = { schema_version:1, status:'rejected', source_head:process.env.EXPECTED_SOURCE_HEAD,
          scope:'Only existing Published A/B; The complete14-case suite and Native2 are not executed.' };

          const scratch = path.join(path.dirname(evidence), 'attachment-export');

          try {
            // Use official same-host APIs already used by the existing workflow and prior export contract.
            const testsText = run('ui-test-results', ['get','test-results','tests','--path',bundle]);
            put('ui-test-results.stdout.json', testsText);
            assert.ok(!existsSync(scratch), 'Fresh owned export directory only');
            run('attachments-export', ['export','attachments','--path',bundle,'--output-path',scratch]);
            const expectedIdentifiers=['PublishedReaderUITests/testBodySearchArrivesAtNestedParagraphContainingAllTermsWithoutReaderGestures()', 'PublishedReaderUITests/testResumeUsesLaterReadingPositionInsteadOfReplayingThePreviousBodyQuery()'].sort();
            const ownedForExport=JSON.parse(readFileSync(path.join(evidence,'owned-simulator.json'),'utf8'));
            const manifestPath=path.join(scratch,'manifest.json');
            assert.ok(lstatSync(manifestPath).isFile()&&!lstatSync(manifestPath).isSymbolicLink());
            const manifestText=readFileSync(manifestPath,'utf8');put('attachments-export.manifest.json',manifestText);
            const manifest=JSON.parse(manifestText);assert.ok(Array.isArray(manifest));
            const traces=[],seenCases=new Set();
            for(const row of manifest){
              assert.ok(row&&typeof row==='object'&&expectedIdentifiers.includes(row.testIdentifier)&&Array.isArray(row.attachments));
              assert.ok(!seenCases.has(row.testIdentifier),'No repeated export case');seenCases.add(row.testIdentifier);
              const selected=row.attachments.filter(x=>typeof x?.suggestedHumanReadableName==='string'&&x.suggestedHumanReadableName.startsWith('Search-arrival-predicate-observations_'));
              assert.ok(selected.length<=1,'At most one helper probe per A/B case');
              for(const attachment of selected){
                assert.equal(attachment.deviceId.toUpperCase(),ownedForExport.UUID);
                const name=attachment.exportedFileName;assert.equal(typeof name,'string');assert.ok(name&&path.basename(name)===name&&!name.includes('..'));
                const input=path.join(scratch,name),stat=lstatSync(input);assert.ok(stat.isFile()&&!stat.isSymbolicLink()&&stat.size<=2*1024*1024);
                const value=JSON.parse(readFileSync(input,'utf8'));
                assert.equal(value.schema_version,1);assert.equal(value.baseline_head,'3dbdfe4512de9948074fcb74151f2422818bf214');
                assert.equal(value.record_capacity,64);assert.equal(value.sort_cache_capacity,32);assert.ok(Array.isArray(value.records)&&value.records.length<=64);
                assert.equal(value.last_comparison_slot_reserved,true);
                const output='search-arrival-trace-'+String(traces.length+1)+'.json';put(output,JSON.stringify(value,null,2)+'\n');
                traces.push({testIdentifier:row.testIdentifier,deviceId:attachment.deviceId,original_export_path:name,exhibit:output,records:value.records.length});
              }
            }
            put('trace-exhibits.json',JSON.stringify({status:traces.length?'found':'unknown:not-exported-or-not-reached',trace_count:traces.length,traces,no_SQLite_or_opaque_fallback:true},null,2)+'\n');
            const tree=JSON.parse(testsText), cases=[], nodes=[];
            const known=new Set(['Test Plan','UI test bundle','Test Suite','Test Case']);
            const visit=rows=>{assert.ok(Array.isArray(rows));for(const node of rows){
              assert.ok(node&&typeof node==='object'&&!Array.isArray(node)&&known.has(node.nodeType));
              assert.ok(['Passed','Failed'].includes(node.result),'Skipped/unknown is not an observation');nodes.push(node);
              if(node.nodeType==='Test Case'){cases.push(node);assert.ok(node.children===undefined||(Array.isArray(node.children)&&node.children.length===0));}
              if(node.children!==undefined)visit(node.children);
            }};visit(tree.testNodes);
            const expected=['PublishedReaderUITests/testBodySearchArrivesAtNestedParagraphContainingAllTermsWithoutReaderGestures()', 'PublishedReaderUITests/testResumeUsesLaterReadingPositionInsteadOfReplayingThePreviousBodyQuery()'].sort();
            assert.equal(cases.length,2,'Exactly A/B, no extra/repeated/retry cases');assert.deepEqual(cases.map(x=>x.nodeIdentifier).sort(),expected);
            const owned=JSON.parse(readFileSync(path.join(evidence,'owned-simulator.json'),'utf8'));
            const selection=JSON.parse(readFileSync(path.join(evidence,'selection.json'),'utf8'));
            assert.equal(owned.source_head,process.env.EXPECTED_SOURCE_HEAD);assert.equal(selection.source_head,owned.source_head);
            assert.ok(Array.isArray(tree.devices)&&tree.devices.length===1);
            assert.equal(tree.devices[0].deviceId.toUpperCase(),owned.UUID);assert.equal(tree.devices[0].osVersion,'18.5');
            assert.equal(tree.devices[0].platform,'iOS Simulator');assert.equal(tree.devices[0].modelName,'iPhone 16');
            const passed=cases.filter(x=>x.result==='Passed').length,failed=cases.filter(x=>x.result==='Failed').length;
            assert.equal(passed+failed,2);assert.ok(traces.length<=2,'At most one arrival-helper trace per existing A/B case');
            for(const test of cases) if(test.result==='Passed') assert.equal(traces.filter(x=>x.testIdentifier===test.nodeIdentifier).length,1,'Always-small trace must be uniquely bound by official manifest for each passed case');
            observation={...observation,status:'exact-A-and-B-observed',cases:cases.map(({nodeIdentifier,result})=>({nodeIdentifier,result})),passed,failed,skipped:0,devices:tree.devices,traces};
            put('ui-observation.json',JSON.stringify(observation,null,2)+'\n');
            assert.equal(failed,0,'Actual failing case remains workflow failure; raw data is retained');
            assert.ok(nodes.every(x=>x.result==='Passed'));
          } catch(error) {
            observation.error=String(error);put('observation-error.json',JSON.stringify(observation,null,2)+'\n');throw error;
          } finally {
            if(existsSync(scratch)){assert.ok(lstatSync(scratch).isDirectory()&&!lstatSync(scratch).isSymbolicLink());assert.equal(path.dirname(scratch),path.dirname(evidence));rmSync(scratch,{recursive:true,force:false});}
          }

          NODE
      - name: Audit actual Debug full published and fixture4 packages
        timeout-minutes: 2
        id: app
        if: always() && !cancelled() && steps.ui.outcome != 'skipped' && steps.evidence.outcome == 'success'
        run: >
          set -euo pipefail

          debug_app='.local/ios-search-arrival-observation/DebugDerivedData/Build/Products/Debug-iphonesimulator/AILibrary.app'

          [[ -d "$debug_app" && ! -L "$debug_app" ]]

          cmp ios/AILibrary/Content/manifest.json "$debug_app/Content/manifest.json"

          bash ios/tests/check-package.sh "$debug_app/Content" "$PUBLISHED_ARTICLE_COUNT" 2>&1 | tee
          "$EVIDENCE_DIR/debug-app-package.json"

          cmp ios/AILibrary/TestContent/manifest.json "$debug_app/TestContent/manifest.json"

          bash ios/tests/check-package.sh "$debug_app/TestContent" 4 2>&1 | tee
          "$EVIDENCE_DIR/debug-fixture-package.json"
      - name: Record completion and all skipped or failed stages
        timeout-minutes: 1
        if: always() && steps.evidence.outcome == 'success'
        env:
          INVENTORY_OUTCOME: ${{ steps.inventory.outcome }}
          ROOT_AUDIT_OUTCOME: ${{ steps.root_audit.outcome }}
          ROOT_INSTALL_OUTCOME: ${{ steps.root_install.outcome }}
          TOOLS_AUDIT_OUTCOME: ${{ steps.tools_audit.outcome }}
          TOOLS_INSTALL_OUTCOME: ${{ steps.tools_install.outcome }}
          BROWSER_OUTCOME: ${{ steps.browser.outcome }}
          CONTENT_OUTCOME: ${{ steps.content.outcome }}
          SIMULATOR_OUTCOME: ${{ steps.simulator.outcome }}
          UI_OUTCOME: ${{ steps.ui.outcome }}
          APP_OUTCOME: ${{ steps.app.outcome }}
          RESULTS_OUTCOME: ${{ steps.results.outcome }}
          CLEANUP_OUTCOME: ${{ steps.cleanup.outcome }}
          COUNT_OUTCOME: ${{ steps.count.outcome }}
        run: >
          set -euo pipefail

          node --input-type=module <<'NODE'

          import assert from 'node:assert/strict';

          import { readFileSync, writeFileSync } from 'node:fs';

          import path from 'node:path';

          const outcomes = Object.fromEntries(['COUNT', 'INVENTORY', 'ROOT_AUDIT', 'ROOT_INSTALL', 'TOOLS_AUDIT',
          'TOOLS_INSTALL', 'BROWSER', 'CONTENT', 'SIMULATOR', 'UI', 'APP', 'RESULTS', 'CLEANUP']
            .map(key => [key.toLowerCase(), process.env[key + '_OUTCOME']]));
          const completed = Object.values(outcomes).every(value => value === 'success');

          let failure = null;

          try {
            assert.ok(completed, 'Skipped, failed, cancelled or unknown stages are not successful acceptance');
            const accepted = JSON.parse(readFileSync(path.join(process.env.EVIDENCE_DIR, 'ui-observation.json'), 'utf8'));
            assert.equal(accepted.status, 'exact-A-and-B-observed'); assert.equal(accepted.passed,2); assert.equal(accepted.failed,0); assert.equal(accepted.skipped,0);
            const cleanup = JSON.parse(readFileSync(path.join(process.env.EVIDENCE_DIR, 'cleanup.json'), 'utf8'));
            assert.ok(['owned-simulator-deleted', 'already-absent'].includes(cleanup.status));
          } catch (error) { failure = String(error); }

          const result = { schema_version: 1, status: failure === null ? 'temporary-search-arrival-A-B-passed' :
          'not-completed',
            source_head: process.env.EXPECTED_SOURCE_HEAD, outcomes,
            failure,
            coverage: 'Only existing Published A/B search-arrival cases on18.5/iPhone16; full199 plus fixture4 resource audits; complete14-case suite and Native2 not executed',
            logic14_Native2_other_OS_Release_physical_VoiceOver_performance: 'not-verified' };
          writeFileSync(path.join(process.env.EVIDENCE_DIR, 'summary.json'), JSON.stringify(result, null, 2) + '\n', {
          flag: 'wx', mode: 0o600 });

          assert.equal(failure, null);

          NODE
      - name: Retain raw context, results and cleanup evidence
        timeout-minutes: 2
        if: always() && steps.evidence.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ios-search-arrival-observation-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: .local/ios-search-arrival-observation/evidence
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90
