name: iOS published app memory observations

on:
  pull_request:
    paths:
      - '.github/workflows/ios-memory.yml'
      - '.github/scripts/ios-memory/**/*.mts'
      - 'ios/AILibraryUITests/PublishedPerformanceUITests.swift'
      - 'ios/tests/export-memory.mjs'
      - 'ios/tests/export-memory.mts'
      - 'tests/unit/ios-memory-export.test.mjs'
      - 'tests/unit/ios-memory-export.test.mts'
  push:
    branches: [main]
    paths:
      - '.github/workflows/ios-memory.yml'
      - '.github/scripts/ios-memory/**/*.mts'
      - 'ios/AILibraryUITests/PublishedPerformanceUITests.swift'
      - 'ios/tests/export-memory.mjs'
      - 'ios/tests/export-memory.mts'
      - 'tests/unit/ios-memory-export.test.mjs'
      - 'tests/unit/ios-memory-export.test.mts'

permissions:
  contents: read

concurrency:
  group: ios-app-memory-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  ios-app-memory:
    name: iOS published app memory observations
    runs-on: macos-15
    timeout-minutes: 40
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
      EXPECTED_SOURCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
      OBSERVATION_EVENT: ${{ github.event_name }}
      OBSERVATION_SHA: ${{ github.sha }}
      OBSERVATION_WORKFLOW_SHA: ${{ github.workflow_sha }}
      OBSERVATION_WORKFLOW_REF: ${{ github.workflow_ref }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        timeout-minutes: 1
        with:
          node-version: 22.22.2
          cache: npm
          cache-dependency-path: |
            package-lock.json
            ios/tools/package-lock.json
      - name: Prepare fresh owned evidence and bounded stage driver
        id: prepare
        timeout-minutes: 1
        run: |
          set -euo pipefail
          [[ ! -L .local && ! -e .local/ios-memory && ! -L .local/ios-memory ]]
          mkdir -p .local/ios-memory/evidence/raw
          chmod 700 .local/ios-memory .local/ios-memory/evidence .local/ios-memory/evidence/raw
          node .github/scripts/ios-memory/driver.mts prepare
      - name: Bind exact checkout, toolchain and actual iOS 18.5 inventory
        timeout-minutes: 3
        run: node .github/scripts/ios-memory/driver.mts inventory
      - name: Audit and install only locked tooling without lifecycle scripts
        timeout-minutes: 8
        run: node .github/scripts/ios-memory/driver.mts dependencies
      - name: Generate full published content and audit independent article count
        timeout-minutes: 6
        run: node .github/scripts/ios-memory/driver.mts content
      - name: Create and boot only this run's fresh owned Simulator
        timeout-minutes: 6
        run: node .github/scripts/ios-memory/driver.mts simulator
      - name: Build registered targets separately without executing tests
        timeout-minutes: 12
        run: node .github/scripts/ios-memory/driver.mts build
      - name: Audit the actual Debug app and freeze measurement context
        timeout-minutes: 3
        run: node .github/scripts/ios-memory/driver.mts audit
      - name: Run only the dedicated app-process memory case
        timeout-minutes: 8
        env:
          TEST_RUNNER_AILIBRARY_EXPECTED_PUBLISHED_COUNT: ${{ env.PUBLISHED_ARTICLE_COUNT }}
          TEST_RUNNER_AILIBRARY_PERFORMANCE_RUNNER: '1'
          TEST_RUNNER_AILIBRARY_MEMORY_RUNNER: '1'
          TEST_RUNNER_AILIBRARY_PERFORMANCE_SCENARIO: published-article-app-memory
        run: node .github/scripts/ios-memory/driver.mts measure
      # The first empirical result remains nonzero until its real metric set,
      # units and CSV shape are independently reviewed and adopted in source.
      - name: Export bounded raw candidates and preserve unaccepted bootstrap
        if: always() && steps.prepare.outcome == 'success'
        timeout-minutes: 3
        run: node .github/scripts/ios-memory/driver.mts export
      - name: Clean up only the UUID this job created
        if: always() && steps.prepare.outcome == 'success'
        timeout-minutes: 1
        run: node .github/scripts/ios-memory/driver.mts cleanup
      - name: Stage only the fixed bounded compact allowlist
        id: compact
        if: always() && steps.prepare.outcome == 'success'
        timeout-minutes: 1
        run: node .github/scripts/ios-memory/driver.mts compact
      - name: Retain compact memory evidence including first pending result
        if: always() && steps.prepare.outcome == 'success' && steps.compact.outputs.ready == 'true'
        timeout-minutes: 1
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ios-app-memory-compact-${{ github.run_id }}-${{ github.run_attempt }}
          path: .local/ios-memory/compact
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90
          compression-level: 6
