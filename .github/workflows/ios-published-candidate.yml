name: iOS published app candidate

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - '.github/workflows/ios-published-candidate.yml'
      - '.github/workflows/ios-native.yml'
      - '.github/scripts/ios-published-candidate/**'
      - '.github/scripts/ios-native/**'
      - 'ios/**'
      - 'docs/**'
      - 'LICENSE'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/build-ios-native-content.mjs'
      - 'scripts/build-ios-native-content.mts'
      - 'scripts/lib/ios-*.mjs'
      - 'scripts/lib/ios-*.mts'
      - 'scripts/lib/md-utils.mjs'
      - 'scripts/lib/md-utils.mts'
      - 'tests/unit/ios-*.test.mjs'
      - 'tests/unit/ios-*.test.mts'
      - 'website/audio/catalog.json'

permissions:
  contents: read

concurrency:
  group: ios-published-candidate-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  ios-published-candidate:
    name: iOS published app candidate (${{ matrix.slice }})
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        slice: [reading-state, content-copy]
    runs-on: macos-15
    timeout-minutes: ${{ matrix.slice == 'reading-state' && 95 || 70 }}
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
      UI_SLICE: ${{ matrix.slice }}
      EXPECTED_SOURCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            ios/tools/package-lock.json
      - name: Audit content tooling before installation
        run: npm audit --package-lock-only --audit-level=high
      - name: Install content tooling without lifecycle scripts
        run: npm ci --ignore-scripts
      - name: Audit native asset tooling before installation
        run: npm audit --package-lock-only --audit-level=high
        working-directory: ios/tools
      - name: Install native asset tooling without lifecycle scripts
        run: npm ci --ignore-scripts
        working-directory: ios/tools
      - name: Install the lockfile-matched Chromium
        run: ./node_modules/.bin/playwright install chromium
        working-directory: ios/tools
      - name: Record toolchain and candidate scope
        run: |
          set -euo pipefail
          mkdir -p .local/ios-published-candidate/evidence
          {
            xcodebuild -version
            node --version
            npm --version
            echo 'Simulator: iPhone 16 / iOS 18.5'
            echo "Slice: $UI_SLICE"
            echo 'Scope: the fixed disjoint full26 functional UI partition; units only reading-state, independent copy and Release integrity only content-copy.' 
            echo 'This job verifies the default published development bundle; physical-device, VoiceOver and performance acceptance remain separate.'
          } | tee .local/ios-published-candidate/evidence/environment.log
      - name: Run the full common checks on the reading-state slice
        if: ${{ matrix.slice == 'reading-state' }}
        timeout-minutes: 6
        run: |
          set -euo pipefail
          full_common_tmp_parent="$(cd "${RUNNER_TEMP:?RUNNER_TEMP is required}" && pwd -P)"
          full_common_tmp="$(mktemp -d "$full_common_tmp_parent/ailibrary-full-common.XXXXXX")"
          trap 'if [[ -n "${full_common_tmp:-}" && "$full_common_tmp" == "$full_common_tmp_parent"/ailibrary-full-common.* ]]; then rm -rf -- "$full_common_tmp"; fi' EXIT
          full_common_tmp_real="$(cd "$full_common_tmp" && pwd -P)"
          [[ "$full_common_tmp_real" == "$full_common_tmp" ]]
          export TMPDIR="$full_common_tmp_real/"
          npm run check \
            2>&1 | tee .local/ios-published-candidate/evidence/full-common-check.log
      - name: Check the frozen AppIcon source assets
        run: |
          set -euo pipefail
          node ios/tools/app-icon.mjs --check \
            2>&1 | tee .local/ios-published-candidate/evidence/app-icon-source.json
      - name: Count tracked published source articles independently
        run: |
          set -euo pipefail
          expected_articles="$(node .github/scripts/ios-published-candidate/article-count.mts)"
          [[ "$expected_articles" =~ ^[1-9][0-9]*$ ]]
          printf 'PUBLISHED_ARTICLE_COUNT=%s\n' "$expected_articles" >> "$GITHUB_ENV"
      # Render the full corpus once into the standard app resource directory.
      # Exercise the normal development entrypoint; the other job explicitly keeps the representative profile.
      - name: Generate and audit the published app and fixture packages
        run: |
          set -euo pipefail
          npm run ios:prepare \
            2>&1 | tee .local/ios-published-candidate/evidence/published-generation.log
          node scripts/build-ios-native-content.mjs --fixtures \
            2>&1 | tee .local/ios-published-candidate/evidence/fixture-generation.log
          npm run --silent ios:test:content \
            2>&1 | tee .local/ios-published-candidate/evidence/published-source-audit.json
          node ios/tests/native-content-audit.mjs --fixtures \
            2>&1 | tee .local/ios-published-candidate/evidence/fixture-source-audit.json
          npm run --silent ios:test:package -- "$PUBLISHED_ARTICLE_COUNT" \
            2>&1 | tee .local/ios-published-candidate/evidence/published-package.json
          bash ios/tests/check-package.sh ios/AILibrary/TestContent 4 \
            2>&1 | tee .local/ios-published-candidate/evidence/fixture-package.json
      - name: Prepare one fresh owned published Simulator
        id: published_simulator
        timeout-minutes: 9
        run: node ios/tests/native-simulator-prepare.mjs prepare
      - name: Prepare the fixed disjoint full UI slice
        env:
          AILIBRARY_PUBLISHED_OWNER_TOKEN: ${{ steps.published_simulator.outputs.owner_token }}
          AILIBRARY_PUBLISHED_CREATED_UUID: ${{ steps.published_simulator.outputs.created_uuid }}
          AILIBRARY_PUBLISHED_DESTINATION: ${{ steps.published_simulator.outputs.destination }}
        run: |
          set -euo pipefail
          test -f .github/scripts/ios-published-candidate/ui-slice-contract.mts
          node .github/scripts/ios-published-candidate/prepare-ui-slice.mts
      # Synthetic unit fixtures remain independent of the real bundled article count.
      # CoreSmoke's no-flag profile is fixed to three articles and is not used here.
      - name: Run all native XCTest units on the iPhone Simulator
        if: ${{ matrix.slice == 'reading-state' }}
        id: native_units
        env:
          AILIBRARY_PUBLISHED_OWNER_TOKEN: ${{ steps.published_simulator.outputs.owner_token }}
          AILIBRARY_PUBLISHED_CREATED_UUID: ${{ steps.published_simulator.outputs.created_uuid }}
          AILIBRARY_PUBLISHED_DESTINATION: ${{ steps.published_simulator.outputs.destination }}
        run: |
          set -euo pipefail
          node ios/tests/native-simulator-prepare.mjs ready
          xcodebuild -project ios/AILibrary.xcodeproj -scheme AILibrary \
            -configuration Debug \
            -destination "$AILIBRARY_PUBLISHED_DESTINATION" \
            -destination-timeout 120 \
            -derivedDataPath .local/ios-published-candidate/DebugDerivedData \
            -resultBundlePath .local/ios-published-candidate/evidence/unit.xcresult \
            -parallel-testing-enabled NO -jobs 2 \
            -only-testing:AILibraryTests CODE_SIGNING_ALLOWED=NO test \
            2>&1 | tee .local/ios-published-candidate/evidence/xctest.log
      - name: Capture Simulator inventory after unit failure
        if: ${{ failure() && !cancelled() && steps.native_units.outcome == 'failure' }}
        continue-on-error: true
        timeout-minutes: 2
        env:
          UNIT_STEP_OUTCOME: ${{ steps.native_units.outcome }}
          DIAGNOSTIC_JOB_STATUS: ${{ job.status }}
          EXPECTED_SOURCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node ios/tests/capture-simulator-unit-failure.mjs
      - name: Build the selected UI targets before the content-copy Debug audit
        if: ${{ matrix.slice == 'content-copy' }}
        env:
          AILIBRARY_PUBLISHED_OWNER_TOKEN: ${{ steps.published_simulator.outputs.owner_token }}
          AILIBRARY_PUBLISHED_CREATED_UUID: ${{ steps.published_simulator.outputs.created_uuid }}
          AILIBRARY_PUBLISHED_DESTINATION: ${{ steps.published_simulator.outputs.destination }}
        run: |
          set -euo pipefail
          node ios/tests/native-simulator-prepare.mjs ready
          UI_SELECTORS=()
          while IFS= read -r selector; do
            [[ "$selector" =~ ^-only-testing:AILibraryUITests/[A-Za-z0-9_]+/test[A-Za-z0-9_]+$ ]]
            UI_SELECTORS+=("$selector")
          done < .local/ios-published-candidate/evidence/ui-selectors.txt
          case "$UI_SLICE" in
            reading-state) [[ "${#UI_SELECTORS[@]}" -eq 18 ]] ;;
            content-copy) [[ "${#UI_SELECTORS[@]}" -eq 8 ]] ;;
            *) exit 1 ;;
          esac
          # Same AILibrary scheme and UI dependency; filtering does not assert Core compile omission.
          xcodebuild -project ios/AILibrary.xcodeproj -scheme AILibrary \
            -configuration Debug \
            -destination "$AILIBRARY_PUBLISHED_DESTINATION" \
            -destination-timeout 120 \
            -derivedDataPath .local/ios-published-candidate/DebugDerivedData \
            -parallel-testing-enabled NO -jobs 2 \
            "${UI_SELECTORS[@]}" CODE_SIGNING_ALLOWED=NO build-for-testing \
            2>&1 | tee .local/ios-published-candidate/evidence/ui-build.log
      - name: Audit the actual Debug app resources
        run: |
          set -euo pipefail
          debug_app='.local/ios-published-candidate/DebugDerivedData/Build/Products/Debug-iphonesimulator/AILibrary.app'
          if ! node ios/tests/capture-built-app-icon.mjs "$debug_app" \
            --output .local/ios-published-candidate/evidence/published-debug-icon-inputs; then
            printf '%s\n' 'AppIcon diagnostic capture failed; continuing required icon audit.' >&2
          fi
          node ios/tests/check-built-app-icon.mjs "$debug_app" --required-scales 3 \
            2>&1 | tee .local/ios-published-candidate/evidence/debug-app-icon.json
          cmp ios/AILibrary/Content/manifest.json "$debug_app/Content/manifest.json"
          bash ios/tests/check-package.sh "$debug_app/Content" "$PUBLISHED_ARTICLE_COUNT" \
            2>&1 | tee .local/ios-published-candidate/evidence/debug-app-package.json
          cmp ios/AILibrary/TestContent/manifest.json "$debug_app/TestContent/manifest.json"
          bash ios/tests/check-package.sh "$debug_app/TestContent" 4 \
            2>&1 | tee .local/ios-published-candidate/evidence/debug-fixture-package.json
      # Keep functional UI acceptance separate from the dedicated performance suite.
      - name: Run functional native UI tests against the published app
        env:
          AILIBRARY_PUBLISHED_OWNER_TOKEN: ${{ steps.published_simulator.outputs.owner_token }}
          AILIBRARY_PUBLISHED_CREATED_UUID: ${{ steps.published_simulator.outputs.created_uuid }}
          AILIBRARY_PUBLISHED_DESTINATION: ${{ steps.published_simulator.outputs.destination }}
          TEST_RUNNER_AILIBRARY_EXPECTED_PUBLISHED_COUNT: ${{ env.PUBLISHED_ARTICLE_COUNT }}
        run: |
          set -euo pipefail
          COPY_SIMULATOR_ID="$(node .github/scripts/ios-published-candidate/prepare-copy-canary.mts)"
          export COPY_SIMULATOR_ID
          [[ "$AILIBRARY_PUBLISHED_DESTINATION" == "platform=iOS Simulator,id=$COPY_SIMULATOR_ID" ]]
          UI_SELECTORS=()
          while IFS= read -r selector; do
            [[ "$selector" =~ ^-only-testing:AILibraryUITests/[A-Za-z0-9_]+/test[A-Za-z0-9_]+$ ]]
            UI_SELECTORS+=("$selector")
          done < .local/ios-published-candidate/evidence/ui-selectors.txt
          case "$UI_SLICE" in
            reading-state) [[ "${#UI_SELECTORS[@]}" -eq 18 ]] ;;
            content-copy) [[ "${#UI_SELECTORS[@]}" -eq 8 ]] ;;
            *) exit 1 ;;
          esac
          xcodebuild -project ios/AILibrary.xcodeproj -scheme AILibrary \
            -configuration Debug \
            -destination "$AILIBRARY_PUBLISHED_DESTINATION" \
            -destination-timeout 120 \
            -derivedDataPath .local/ios-published-candidate/DebugDerivedData \
            -resultBundlePath .local/ios-published-candidate/evidence/ui.xcresult \
            -parallel-testing-enabled NO -jobs 2 \
            "${UI_SELECTORS[@]}" CODE_SIGNING_ALLOWED=NO test \
            2>&1 | tee .local/ios-published-candidate/evidence/xctest-ui.log
          node .github/scripts/ios-published-candidate/validate-ui-slice.mts
      - name: Build and verify the published Release package
        if: ${{ matrix.slice == 'content-copy' }}
        run: |
          set -euo pipefail
          xcodebuild -project ios/AILibrary.xcodeproj -scheme AILibrary \
            -configuration Release -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath .local/ios-published-candidate/ReleaseDerivedData -jobs 2 \
            CODE_SIGNING_ALLOWED=NO build \
            2>&1 | tee .local/ios-published-candidate/evidence/release-build.log
          node ios/tests/check-release-package.mjs \
            .local/ios-published-candidate/ReleaseDerivedData/Build/Products/Release-iphonesimulator/AILibrary.app \
            2>&1 | tee .local/ios-published-candidate/evidence/release-package.json
          if ! node ios/tests/capture-built-app-icon.mjs .local/ios-published-candidate/ReleaseDerivedData/Build/Products/Release-iphonesimulator/AILibrary.app \
            --output .local/ios-published-candidate/evidence/published-release-icon-inputs; then
            printf '%s\n' 'AppIcon diagnostic capture failed; continuing required icon audit.' >&2
          fi
          node ios/tests/check-built-app-icon.mjs \
            .local/ios-published-candidate/ReleaseDerivedData/Build/Products/Release-iphonesimulator/AILibrary.app \
            --required-scales 2,3 \
            2>&1 | tee .local/ios-published-candidate/evidence/release-app-icon.json
      - name: Retain compact device code-copy evidence
        if: ${{ always() && matrix.slice == 'content-copy' }}
        timeout-minutes: 2
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ios-published-code-copy-evidence-${{ matrix.slice }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .local/ios-published-candidate/evidence/code-copy-summary.json
            .local/ios-published-candidate/evidence/copy-device.json
            .local/ios-published-candidate/evidence/copy-seed-input.json
            .local/ios-published-candidate/evidence/copy-seed-accepted.json
            .local/ios-published-candidate/evidence/copy-seed.intent.json
            .local/ios-published-candidate/evidence/copy-seed.exit.json
            .local/ios-published-candidate/evidence/copy-seed-timeout-retry-1.intent.json
            .local/ios-published-candidate/evidence/copy-seed-timeout-retry-1.exit.json
            .local/ios-published-candidate/evidence/copy-results.intent.json
            .local/ios-published-candidate/evidence/copy-results.exit.json
            .local/ios-published-candidate/evidence/copy-results.stdout.bin
            .local/ios-published-candidate/evidence/copy-results.stderr.log
            .local/ios-published-candidate/evidence/copy-actual.intent.json
            .local/ios-published-candidate/evidence/copy-actual.exit.json
            .local/ios-published-candidate/evidence/copy-actual.stdout.bin
            .local/ios-published-candidate/evidence/copy-actual.stderr.log
            .local/ios-published-candidate/evidence/xctest-ui.log
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 90
      - name: Retain test results and compact candidate evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ios-published-candidate-evidence-${{ matrix.slice }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: .local/ios-published-candidate/evidence
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 90
      - name: Clean up only the proven owned published Simulator
        if: always()
        timeout-minutes: 3
        env:
          AILIBRARY_PUBLISHED_OWNER_TOKEN: ${{ steps.published_simulator.outputs.owner_token }}
          AILIBRARY_PUBLISHED_CREATED_UUID: ${{ steps.published_simulator.outputs.created_uuid }}
        run: node ios/tests/native-simulator-prepare.mjs cleanup
      - name: Retain bounded published Simulator ownership receipts
        if: always()
        timeout-minutes: 2
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ios-published-simulator-${{ matrix.slice }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: .local/ios-published-candidate/evidence/owned-simulator/${{ matrix.slice }}
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 90
