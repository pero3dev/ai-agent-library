# CI(project/plans/engineering/website.md §8 W5): markdownlint + docs 検証 + サイトビルド(+ 条件付き GitHub Pages デプロイ)
#
# デプロイは既定で無効。有効化するにはリポジトリの Actions 変数(Settings → Secrets and variables → Actions → Variables)に
#   DEPLOY_PAGES = true
#   SITE_URL     = 公開 URL(例: https://<owner>.github.io/ai-agent-library)
#   SITE_BASE_PATH = サブパス(例: /ai-agent-library。ルート配信なら未設定)
# を設定し、Settings → Pages → Source を「GitHub Actions」にする。
#
# セキュリティ方針(監査バッチ B):
# - 既定の GITHUB_TOKEN は最小権限(contents: read)。書き込みが要るジョブでのみ昇格する
# - checkout は persist-credentials: false(以降のステップに認証情報を残さない)
# - サードパーティを含む全 Action をコミット SHA で固定(タグは可変で改竄されうる)
name: CI

on:
  push:
    branches: [main]
  pull_request:

# 既定は読み取りのみ。deploy ジョブだけが必要な権限を明示的に足す
permissions:
  contents: read

# 同一ブランチの古い実行はキャンセルする(main のデプロイ実行は中断しない)
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      # markdownlint-cli は devDependency として lockfile で固定(旧: npx --yes で毎回取得)
      - name: Audit documentation tooling before installation
        run: npm audit --package-lock-only --audit-level=high
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: markdownlint
        run: npm run lint:md

  # ワークフロー定義自体の静的検査。バイナリは版と SHA256 を固定して取得する
  actionlint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned actionlint
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          set -euo pipefail
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSL --retry 3 --retry-delay 2 --retry-max-time 60 -o "$archive" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${archive}"
          echo "${ACTIONLINT_SHA256}  ${archive}" | sha256sum -c -
          tar -xzf "$archive" actionlint
      - name: Run actionlint
        run: ./actionlint -color

  # docs の規約検証。リンクの Markdown パーサは root lockfile の固定依存を使用する。
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Audit documentation validation dependencies before installation
        run: npm audit --package-lock-only --audit-level=high
      - name: Install audited documentation validation dependencies
        run: npm ci --ignore-scripts
      - name: front matter / 固定 H2 / TODO(要確認) 書式
        run: node scripts/validate-docs.mjs --all
      - name: 相対リンク切れ / セクション README 収録表
        run: node scripts/check-links.mjs
      - name: ハーネスと文書検証の回帰検査
        run: node --test --test-concurrency=4 tests/unit/*.test.mjs

  harness:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm audit --package-lock-only --audit-level=high
      - run: npm ci --ignore-scripts
      - run: npm run check:harness

  # Windows 固有のパス・worktree・排他・hook adapter を確認する。サイト一式は build job。
  harness-windows:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm audit --package-lock-only --audit-level=high
      - run: npm ci --ignore-scripts
      - run: npm run test:harness:windows

  examples:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            examples/tests/requirements.txt
            examples/python/*/requirements.txt
            harness/requirements-audit.txt
      - name: Install pinned Python dependency auditor
        run: python -m pip install -r harness/requirements-audit.txt
      - name: Audit Python sample dependencies
        run: python -X utf8 -m pip_audit --strict -r examples/tests/requirements.txt --progress-spinner off
      - name: Install audited regression test dependencies
        run: python -m pip install -r examples/tests/requirements.txt
      - name: Python samples regression tests (no API key)
        run: python -X utf8 -B -m unittest discover -s examples/tests -v

  build:
    runs-on: ubuntu-latest
    # 静的ビルド・検索・図と全ルートのアクセシビリティ回帰を実行する。
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Detect theme changes for before/after evidence
        id: theme-changes
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if git diff --quiet "$BASE_SHA" "$HEAD_SHA" -- website/app/docs.css website/components/home/home.css; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          else
            result=$?
            if [ "$result" -ne 1 ]; then exit "$result"; fi
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json
      - name: Audit website dependencies before installation
        run: npm audit --package-lock-only --audit-level=high
        working-directory: website
      - name: Install dependencies
        run: npm ci
        working-directory: website
      - name: MDX ガード / 静的 HTML 検査の回帰検査
        run: npm test
        working-directory: website
      # prebuild(sync)が未解決リンク・許可外 MDX・読込失敗で exit 1、
      # postbuild が generated/routes.json とのルート網羅を照合して exit 1 する
      - name: Install browser for regression checks
        run: npx playwright install --with-deps chromium
        working-directory: website
      - name: Install Firefox for appearance checks
        run: npx playwright install --with-deps firefox
        working-directory: website
      # PR base の静的出力を同じ撮影helperで比較する。候補CSSを戻した画像をbeforeにしない。
      - name: Check out theme comparison baseline
        if: steps.theme-changes.outputs.changed == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: .local/theme-baseline
          persist-credentials: false
      - name: Audit theme baseline dependencies
        if: steps.theme-changes.outputs.changed == 'true'
        run: npm audit --package-lock-only --audit-level=high
        working-directory: .local/theme-baseline/website
      - name: Install theme baseline dependencies
        if: steps.theme-changes.outputs.changed == 'true'
        run: npm ci
        working-directory: .local/theme-baseline/website
      - name: Build theme comparison baseline
        if: steps.theme-changes.outputs.changed == 'true'
        run: npm run build:clean
        working-directory: .local/theme-baseline/website
        env:
          STATIC_EXPORT: '1'
          NEXT_PUBLIC_BASE_PATH: ${{ vars.SITE_BASE_PATH || '' }}
          NEXT_PUBLIC_SITE_URL: ${{ vars.SITE_URL || '' }}
      - name: Capture theme before screenshots
        if: steps.theme-changes.outputs.changed == 'true'
        run: node scripts/capture-theme-evidence.mjs --export-root ../.local/theme-baseline/website/out --output-dir ../.local/theme-evidence/before --revision "$BASE_SHA"
        working-directory: website
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          NEXT_PUBLIC_BASE_PATH: ${{ vars.SITE_BASE_PATH || '' }}
      - name: Build (static export)
        run: npm run build:clean
        working-directory: website
        env:
          STATIC_EXPORT: '1'
          NEXT_PUBLIC_BASE_PATH: ${{ vars.SITE_BASE_PATH || '' }}
          NEXT_PUBLIC_SITE_URL: ${{ vars.SITE_URL || '' }}
      - name: Capture theme after screenshots
        if: steps.theme-changes.outputs.changed == 'true'
        run: node scripts/capture-theme-evidence.mjs --export-root out --output-dir ../.local/theme-evidence/after --revision "$GITHUB_SHA"
        working-directory: website
        env:
          EVIDENCE_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          NEXT_PUBLIC_BASE_PATH: ${{ vars.SITE_BASE_PATH || '' }}
      - name: Browser regression checks
        run: npm run test:browser
        working-directory: website
        env:
          NEXT_PUBLIC_BASE_PATH: ${{ vars.SITE_BASE_PATH || '' }}
      - name: Firefox site appearance checks
        run: npx playwright test site-appearance.spec.mjs --output ../.local/appearance-results/firefox
        working-directory: website
        env:
          PLAYWRIGHT_BROWSER: firefox
          NEXT_PUBLIC_BASE_PATH: ${{ vars.SITE_BASE_PATH || '' }}
      - name: Retain browser results and theme comparison evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-and-theme-evidence-${{ github.run_id }}
          path: |
            .local/theme-evidence
            .local/appearance-results/firefox
            website/test-results
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 90
      # 検索・キーボード・Mermaid のブラウザー検査を通った出力だけを公開する。
      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: website/out

  audio-browser:
    name: Audio playback regression
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json
      - name: Audit audio test dependencies before installation
        run: npm audit --package-lock-only --audit-level=high
        working-directory: website
      - name: Install audio test dependencies
        run: npm ci
        working-directory: website
      - name: Install audio test browser
        run: npx playwright install --with-deps chromium
        working-directory: website
      # Isolated job: this fixture output is never uploaded as a Pages artifact.
      - name: Build audio test fixture
        run: npm run build:clean
        working-directory: website
        env:
          STATIC_EXPORT: '1'
          AUDIO_TEST_CATALOG: tests/browser/fixtures/audio-catalog.json
          NEXT_PUBLIC_BASE_PATH: /__audio-test
          NEXT_PUBLIC_SITE_URL: http://127.0.0.1:4183/__audio-test
      - name: Audio playback browser checks
        run: npm run test:audio
        working-directory: website
        env:
          AUDIO_TEST_CATALOG: tests/browser/fixtures/audio-catalog.json
          NEXT_PUBLIC_BASE_PATH: /__audio-test
          NEXT_PUBLIC_SITE_URL: http://127.0.0.1:4183/__audio-test

  audio-webkit:
    name: Safari audio playback regression
    # macOS exercises WebKit's AVFoundation backend; Windows/Linux use different media backends.
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json
      - name: Audit audio test dependencies before installation
        run: npm audit --package-lock-only --audit-level=high
        working-directory: website
      - name: Install audio test dependencies
        run: npm ci
        working-directory: website
      - name: Install SVG renderer and WebKit
        run: npx playwright install chromium webkit
        working-directory: website
      - name: Build audio test fixture
        run: npm run build:clean
        working-directory: website
        env:
          STATIC_EXPORT: '1'
          AUDIO_TEST_CATALOG: tests/browser/fixtures/audio-catalog.json
          NEXT_PUBLIC_BASE_PATH: /__audio-test
          NEXT_PUBLIC_SITE_URL: http://127.0.0.1:4183/__audio-test
      - name: Safari audio playback checks
        run: npm run test:audio
        working-directory: website
        env:
          PLAYWRIGHT_BROWSER: webkit
          AUDIO_TEST_CATALOG: tests/browser/fixtures/audio-catalog.json
          NEXT_PUBLIC_BASE_PATH: /__audio-test
          NEXT_PUBLIC_SITE_URL: http://127.0.0.1:4183/__audio-test

      - name: WebKit CSP and JavaScript-disabled diagrams
        run: npm run test:publishing-safety
        working-directory: website
        env:
          PLAYWRIGHT_BROWSER: webkit
          NEXT_PUBLIC_BASE_PATH: /__audio-test
          NEXT_PUBLIC_SITE_URL: http://127.0.0.1:4183/__audio-test
      - name: WebKit site appearance checks
        run: npx playwright test site-appearance.spec.mjs --output ../.local/appearance-results/webkit
        working-directory: website
        env:
          PLAYWRIGHT_BROWSER: webkit
          NEXT_PUBLIC_BASE_PATH: /__audio-test
      - name: Retain WebKit appearance evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: webkit-appearance-evidence-${{ github.run_id }}
          path: .local/appearance-results/webkit
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 90

  deploy:
    if: github.ref == 'refs/heads/main' && vars.DEPLOY_PAGES == 'true'
    needs: [lint, actionlint, build, docs, examples, harness, harness-windows, audio-browser, audio-webkit]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
