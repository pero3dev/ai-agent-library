name: iOS SDK 27 preview compatibility preflight

on:
  workflow_dispatch:
    inputs:
      run_smoke:
        description: 'Also run the owned iOS27 Native2 preview smoke job'
        type: boolean
        default: false
  pull_request:
    paths:
      - '.github/workflows/ios-sdk27-compatibility.yml'

permissions:
  contents: read

concurrency:
  group: ios-sdk27-compatibility-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios-sdk27-archive:
    name: iOS SDK 27 unsigned archive preflight
    # Standard public runners are documented free; refuse visibility changes.
    if: github.repository == 'pero3dev/ai-agent-library' && github.event.repository.private == false
    runs-on: xcode-27
    timeout-minutes: 40
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.app/Contents/Developer
      EVIDENCE_DIR: ${{ github.workspace }}/.local/ios-sdk27/evidence
      EXPECTED_SOURCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
      REPOSITORY_IS_PRIVATE: ${{ github.event.repository.private }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            ios/tools/package-lock.json
      - name: Create fresh evidence storage
        id: evidence
        run: |
          set -euo pipefail
          [[ ! -L .local && ! -e .local/ios-sdk27 && ! -L .local/ios-sdk27 ]]
          mkdir -p "$EVIDENCE_DIR"
          chmod 700 .local/ios-sdk27 "$EVIDENCE_DIR"
      - name: Verify the actual runner and documented Xcode SDK
        id: toolchain
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { spawnSync } from 'node:child_process';
          import { existsSync, writeFileSync } from 'node:fs';
          import path from 'node:path';
          const evidence = process.env.EVIDENCE_DIR, commands = [];
          const put = (name, value) => writeFileSync(path.join(evidence, name), value, { flag: 'wx', mode: 0o600 });
          const read = (name, binary, args) => {
            const result = spawnSync(binary, args, { encoding: 'utf8', timeout: 120000, maxBuffer: 8 * 1024 * 1024 });
            put(name + '.stdout.log', result.stdout ?? ''); put(name + '.stderr.log', result.stderr ?? '');
            commands.push({ name, binary, arguments: args, exit_code: result.status, signal: result.signal, error: result.error?.message ?? null });
            assert.equal(result.error, undefined, name); assert.equal(result.status, 0, name);
            return result.stdout.trim();
          };
          try {
            assert.equal(process.env.GITHUB_REPOSITORY, 'pero3dev/ai-agent-library');
            assert.equal(process.env.REPOSITORY_IS_PRIVATE, 'false');
            assert.equal(process.env.DEVELOPER_DIR, '/Applications/Xcode_27.app/Contents/Developer');
            assert.ok(existsSync(process.env.DEVELOPER_DIR), 'Documented Xcode must exist; no fallback');
            const macOS = read('macos', 'sw_vers', ['-productVersion']);
            const architecture = read('architecture', 'uname', ['-m']);
            assert.equal(macOS.split('.')[0], '27'); assert.equal(architecture, 'arm64');
            const Xcode = read('xcode', 'xcodebuild', ['-version']);
            const xcodeBuild = /^Xcode 27\.0\nBuild version ([A-Za-z0-9]+)$/.exec(Xcode)?.[1];
            assert.equal(xcodeBuild, '27A266a');
            assert.equal(Xcode, 'Xcode 27.0\nBuild version 27A266a');
            read('available-sdks', 'xcodebuild', ['-showsdks']);
            const sdk = read('iphoneos-sdk-version', 'xcrun', ['--sdk', 'iphoneos', '--show-sdk-version']);
            assert.equal(sdk, '27.0');
            const sdkBuild = read('iphoneos-sdk-build', 'xcrun', ['--sdk', 'iphoneos', '--show-sdk-build-version']);
            assert.match(sdkBuild, /^[A-Za-z0-9]+$/);
            const sdkPath = read('iphoneos-sdk-path', 'xcrun', ['--sdk', 'iphoneos', '--show-sdk-path']);
            const head = read('source-head', 'git', ['rev-parse', 'HEAD']);
            assert.match(head, /^[a-f0-9]{40}$/); assert.equal(head, process.env.EXPECTED_SOURCE_HEAD);
            const tree = read('source-tree', 'git', ['rev-parse', 'HEAD^{tree}']);
            put('toolchain.json', JSON.stringify({
              schema_version: 1, status: 'toolchain-verified', source_head: head, source_tree: tree,
              runner_label: 'xcode-27', standard_runner: true, repository: process.env.GITHUB_REPOSITORY,
              repository_private: false, macOS, architecture, Xcode, xcode_build: xcodeBuild, sdk, sdk_build: sdkBuild, sdk_path: sdkPath,
              developer_directory: process.env.DEVELOPER_DIR,
              image_OS: process.env.ImageOS ?? null, image_version: process.env.ImageVersion ?? null,
              Node: process.version, configuration: 'Release', destination: 'generic/platform=iOS',
              scope: 'Preview SDK27 unsigned archive experiment only; actual SDK build is captured and compared to archived App Info. No local OS, signing, distribution or device adoption.'
            }, null, 2) + '\n');
          } finally { put('toolchain-commands.json', JSON.stringify(commands, null, 2) + '\n'); }
          NODE
      - name: Audit content tooling before installation
        run: |
          set -euo pipefail
          npm audit --package-lock-only --audit-level=high 2>&1 | tee "$EVIDENCE_DIR/root-lock-audit.log"
      - name: Install content tooling without lifecycle scripts
        run: |
          set -euo pipefail
          npm ci --ignore-scripts 2>&1 | tee "$EVIDENCE_DIR/root-npm-ci.log"
      - name: Audit native assets before installation
        working-directory: ios/tools
        run: |
          set -euo pipefail
          npm audit --package-lock-only --audit-level=high 2>&1 | tee "$EVIDENCE_DIR/tools-lock-audit.log"
      - name: Install native assets without lifecycle scripts
        working-directory: ios/tools
        run: |
          set -euo pipefail
          npm ci --ignore-scripts 2>&1 | tee "$EVIDENCE_DIR/tools-npm-ci.log"
          ./node_modules/.bin/playwright install chromium 2>&1 | tee "$EVIDENCE_DIR/chromium-install.log"
      - name: Count tracked published sources independently
        id: sources
        run: |
          set -euo pipefail
          expected_articles="$(node --input-type=module <<'NODE'
          import { execFileSync } from 'node:child_process';
          import { readFileSync, writeFileSync } from 'node:fs';
          import path from 'node:path';
          import { load, JSON_SCHEMA } from 'js-yaml';
          const files = execFileSync('git', ['ls-files', '-z', 'docs'], { encoding: 'utf8' })
            .split('\0').filter(file => /^docs\/\d{2}-[a-z0-9-]+\/[a-z0-9-]+\.md$/.test(file));
          const articles = files.filter(file => {
            const match = /^---\r?\n([\s\S]*?)\r?\n---(?:\r?\n|$)/.exec(readFileSync(file, 'utf8'));
            if (!match) throw new Error('Missing front matter: ' + file);
            const fields = load(match[1], { schema: JSON_SCHEMA });
            if (!fields || !['published', 'draft'].includes(fields.status)) throw new Error('Invalid source status: ' + file);
            return fields.status === 'published';
          }).sort();
          if (articles.length < 4 || articles.length > 2000) throw new Error('Invalid full published source count');
          writeFileSync(path.join(process.env.EVIDENCE_DIR, 'published-sources.json'),
            JSON.stringify({ articles: articles.length, source_paths: articles }, null, 2) + '\n', { flag: 'wx' });
          console.log(articles.length);
          NODE
          )"
          [[ "$expected_articles" =~ ^[1-9][0-9]*$ ]]
          printf 'PUBLISHED_ARTICLE_COUNT=%s\n' "$expected_articles" >> "$GITHUB_ENV"
      - name: Generate and audit standard full and fixture packages
        id: generation
        run: |
          set -euo pipefail
          npm run ios:prepare 2>&1 | tee "$EVIDENCE_DIR/published-generation.log"
          npm run ios:prepare:fixtures 2>&1 | tee "$EVIDENCE_DIR/fixture-generation.log"
          npm run --silent ios:test:content 2>&1 | tee "$EVIDENCE_DIR/published-source-audit.json"
          npm run --silent ios:test:fixtures 2>&1 | tee "$EVIDENCE_DIR/fixture-source-audit.json"
          npm run --silent ios:test:package -- "$PUBLISHED_ARTICLE_COUNT" 2>&1 | tee "$EVIDENCE_DIR/published-consumer.json"
          bash ios/tests/check-package.sh ios/AILibrary/TestContent 4 2>&1 | tee "$EVIDENCE_DIR/fixture-consumer.json"
      - name: Archive generic iPhoneOS Release with signing disabled
        id: archive
        run: |
          set -euo pipefail
          build_args=(
            -project ios/AILibrary.xcodeproj -scheme AILibrary
            -configuration Release -sdk iphoneos -destination 'generic/platform=iOS'
            -derivedDataPath .local/ios-sdk27/DerivedData -jobs 2
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY= DEVELOPMENT_TEAM=
          )
          xcodebuild "${build_args[@]}" -showBuildSettings -json \
            > "$EVIDENCE_DIR/release-build-settings.json" 2> "$EVIDENCE_DIR/release-build-settings.stderr.log"
          xcodebuild "${build_args[@]}" \
            -archivePath .local/ios-sdk27/AILibrary.xcarchive \
            -resultBundlePath "$EVIDENCE_DIR/archive.xcresult" archive \
            2>&1 | tee "$EVIDENCE_DIR/archive.log"
      - name: Validate the actual archived app package
        id: package
        run: |
          set -euo pipefail
          app='.local/ios-sdk27/AILibrary.xcarchive/Products/Applications/AILibrary.app'
          node ios/tests/check-release-package.mjs "$app" 2>&1 | tee "$EVIDENCE_DIR/release-package.json"
          bash ios/tests/check-package.sh "$app/Content" "$PUBLISHED_ARTICLE_COUNT" 2>&1 | tee "$EVIDENCE_DIR/archive-consumer.json"
      - name: Audit metadata, all app SHA values, device binary and dSYM
        id: binary
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE' 2>&1 | tee "$EVIDENCE_DIR/archive-audit.log"
          import assert from 'node:assert/strict';
          import { createHash } from 'node:crypto';
          import { spawnSync } from 'node:child_process';
          import { lstatSync, readFileSync, readdirSync, writeFileSync } from 'node:fs';
          import path from 'node:path';
          import { assertSigningDisabledBuildSettings } from './ios/tests/archive-signing-settings.mjs';
          const evidence = process.env.EVIDENCE_DIR;
          const archive = path.resolve('.local/ios-sdk27/AILibrary.xcarchive');
          const app = path.join(archive, 'Products/Applications/AILibrary.app');
          const commands = [], findings = { schema_version: 1, status: 'incomplete', distribution_acceptance: 'unadopted' };
          const put = (name, value) => writeFileSync(path.join(evidence, name), value, { flag: 'wx', mode: 0o600 });
          const json = file => JSON.parse(readFileSync(file, 'utf8'));
          const hash = bytes => createHash('sha256').update(bytes).digest('hex');
          const command = (label, binary, args, allowFailure = false) => {
            const result = spawnSync(binary, args, { encoding: 'utf8', timeout: 120000, maxBuffer: 8 * 1024 * 1024 });
            put(label + '.stdout.log', result.stdout ?? ''); put(label + '.stderr.log', result.stderr ?? '');
            commands.push({ label, binary, arguments: args, exit_code: result.status, signal: result.signal, error: result.error?.message ?? null });
            assert.equal(result.error, undefined, label);
            if (!allowFailure) assert.equal(result.status, 0, label);
            return result;
          };
          const text = (label, binary, args) => command(label, binary, args).stdout.trim();
          const plist = (label, file) => JSON.parse(text(label, '/usr/bin/plutil', ['-convert', 'json', '-o', '-', file]));
          const version = value => {
            assert.match(value, /^\d+(?:\.\d+){0,2}$/);
            return value.split('.').concat(['0', '0']).slice(0, 3).map(Number).join('.');
          };
          const UUIDs = value => {
            const rows = [...value.matchAll(/^UUID:\s+([A-Fa-f0-9-]{36})\s+\(([^)]+)\)\s+.+$/gm)]
              .map(match => ({ architecture: match[2], uuid: match[1].toUpperCase() }));
            assert.equal(rows.length, 1); assert.equal(rows[0].architecture, 'arm64');
            assert.match(rows[0].uuid, /^[A-F0-9]{8}(?:-[A-F0-9]{4}){3}-[A-F0-9]{12}$/);
            return rows;
          };
          try {
            const runtime = json(path.join(evidence, 'toolchain.json'));
            findings.toolchain = runtime;
            const expected = Number(process.env.PUBLISHED_ARTICLE_COUNT);
            assert.ok(Number.isInteger(expected) && expected >= 4 && expected <= 2000);
            const sources = json(path.join(evidence, 'published-sources.json'));
            assert.equal(sources.articles, expected);
            const sourceAudit = json(path.join(evidence, 'published-source-audit.json'));
            assert.equal(sourceAudit.result, 'passed'); assert.equal(sourceAudit.profile, 'published-library');
            assert.equal(sourceAudit.articles.length, expected);
            const packageAudit = json(path.join(evidence, 'release-package.json'));
            const consumerAudit = json(path.join(evidence, 'archive-consumer.json'));
            for (const audit of [packageAudit, consumerAudit]) {
              assert.equal(audit.status, 'passed'); assert.equal(audit.articles, expected);
            }
            const applications = path.join(archive, 'Products/Applications');
            assert.ok(lstatSync(applications).isDirectory());
            assert.deepEqual(readdirSync(applications).sort(), ['AILibrary.app']);
            assert.ok(lstatSync(app).isDirectory());
            const settings = json(path.join(evidence, 'release-build-settings.json')).filter(value => value.target === 'AILibrary');
            assert.equal(settings.length, 1);
            const build = settings[0].buildSettings;
            assert.equal(build.CONFIGURATION, 'Release');
            assert.equal(version(build.IPHONEOS_DEPLOYMENT_TARGET), '17.0.0');
            assert.equal(build.ENABLE_USER_SCRIPT_SANDBOXING, 'YES');
            assert.equal(build.DEBUG_INFORMATION_FORMAT, 'dwarf-with-dsym');
            assertSigningDisabledBuildSettings(build);
            const info = plist('app-info', path.join(app, 'Info.plist'));
            put('archive-application-properties.plist', text('archive-info-properties', '/usr/bin/plutil',
              ['-extract', 'ApplicationProperties', 'xml1', '-o', '-', path.join(archive, 'Info.plist')]));
            const archiveProperties = plist('archive-info', path.join(evidence, 'archive-application-properties.plist'));
            assert.equal(info.CFBundleIdentifier, build.PRODUCT_BUNDLE_IDENTIFIER);
            assert.equal(info.CFBundleShortVersionString, build.MARKETING_VERSION);
            assert.equal(info.CFBundleVersion, build.CURRENT_PROJECT_VERSION);
            assert.equal(info.CFBundleExecutable, 'AILibrary'); assert.equal(info.CFBundlePackageType, 'APPL');
            assert.equal(info.LSRequiresIPhoneOS, true); assert.deepEqual(info.UIDeviceFamily, [1]);
            assert.deepEqual(info.CFBundleSupportedPlatforms, ['iPhoneOS']);
            assert.equal(info.DTPlatformName, 'iphoneos'); assert.equal(info.DTSDKName, 'iphoneos' + runtime.sdk);
            assert.equal(info.DTSDKBuild, runtime.sdk_build); assert.equal(info.DTXcodeBuild, runtime.xcode_build);
            assert.equal(version(info.MinimumOSVersion), '17.0.0');
            assert.ok(archiveProperties !== null && typeof archiveProperties === 'object' && !Array.isArray(archiveProperties),
              'Archive ApplicationProperties must be an object');
            assert.equal(archiveProperties.ApplicationPath, 'Applications/AILibrary.app');
            assert.equal(archiveProperties.CFBundleIdentifier, info.CFBundleIdentifier);
            assert.equal(archiveProperties.CFBundleShortVersionString, info.CFBundleShortVersionString);
            assert.equal(archiveProperties.CFBundleVersion, info.CFBundleVersion);
            const privacy = plist('app-privacy', path.join(app, 'PrivacyInfo.xcprivacy'));
            const sourcePrivacy = plist('source-privacy', 'ios/AILibrary/PrivacyInfo.xcprivacy');
            assert.deepEqual(privacy, sourcePrivacy);
            assert.equal(privacy.NSPrivacyTracking, false);
            assert.deepEqual(privacy.NSPrivacyCollectedDataTypes, []); assert.deepEqual(privacy.NSPrivacyTrackingDomains, []);
            const manifest = json(path.join(app, 'Content/manifest.json'));
            assert.deepEqual(manifest.articles.map(article => article.source_path), sources.source_paths);
            const licenses = ['assets/licenses/NOTICE.txt', 'assets/katex/LICENSE.txt', 'assets/licenses/Mermaid-LICENSE.txt'];
            for (const relative of licenses) {
              assert.ok(Object.hasOwn(manifest.files, relative));
              const actual = readFileSync(path.join(app, 'Content', relative));
              assert.ok(actual.length > 0); assert.equal(hash(actual), manifest.files[relative]);
              assert.deepEqual(actual, readFileSync(path.join('ios/AILibrary/Content', relative)));
            }
            assert.deepEqual(readFileSync(path.join(app, 'Content/assets/licenses/NOTICE.txt')), readFileSync('LICENSE'));
            const inventory = [];
            const walk = (directory, prefix = '') => {
              for (const name of readdirSync(directory).sort()) {
                assert.notEqual(name, 'TestContent', 'Debug fixtures must not be archived');
                assert.notEqual(name, 'embedded.mobileprovision', 'No provisioning profile is allowed');
                assert.ok(!name.endsWith('.xctest'), 'No test bundle is allowed');
                const file = path.join(directory, name), relative = prefix + name, stat = lstatSync(file);
                assert.ok(!stat.isSymbolicLink(), 'No symlinks in the app inventory');
                if (stat.isDirectory()) walk(file, relative + '/');
                else {
                  assert.ok(stat.isFile());
                  const bytes = readFileSync(file);
                  inventory.push({ path: relative, bytes: bytes.length, sha256: hash(bytes) });
                }
              }
            };
            walk(app); assert.ok(inventory.length > 0);
            put('app-file-inventory.json', JSON.stringify({ files: inventory, file_count: inventory.length,
              bytes: inventory.reduce((sum, file) => sum + file.bytes, 0) }, null, 2) + '\n');
            const executable = path.join(app, info.CFBundleExecutable);
            assert.ok(lstatSync(executable).isFile());
            const architectures = text('binary-architectures', 'xcrun', ['lipo', '-archs', executable]).split(/\s+/);
            assert.deepEqual(architectures, ['arm64']);
            const loads = text('binary-load-commands', 'xcrun', ['otool', '-l', executable]);
            const builds = loads.split(/(?=^Load command \d+\s*$)/m).filter(block => /^\s*cmd LC_BUILD_VERSION\s*$/m.test(block));
            assert.equal(builds.length, 1, 'The device binary must have one LC_BUILD_VERSION');
            const field = name => {
              const matches = [...builds[0].matchAll(new RegExp('^\\s*' + name + '\\s+(\\S+)\\s*$', 'gm'))];
              assert.equal(matches.length, 1, name); return matches[0][1];
            };
            assert.equal(field('platform'), '2', 'Mach-O PLATFORM_IOS is the device platform');
            assert.equal(version(field('minos')), '17.0.0'); assert.equal(version(field('sdk')), version(runtime.sdk));
            const dwarf = path.join(archive, 'dSYMs/AILibrary.app.dSYM/Contents/Resources/DWARF/AILibrary');
            assert.ok(lstatSync(dwarf).isFile());
            assert.deepEqual(text('dsym-architectures', 'xcrun', ['lipo', '-archs', dwarf]).split(/\s+/), architectures);
            const binaryUUIDs = UUIDs(text('binary-UUID', 'xcrun', ['dwarfdump', '--uuid', executable]));
            const symbolUUIDs = UUIDs(text('dsym-UUID', 'xcrun', ['dwarfdump', '--uuid', dwarf]));
            assert.deepEqual(symbolUUIDs, binaryUUIDs);
            const signature = command('codesign-inspection', '/usr/bin/codesign', ['-d', '--verbose=4', app], true);
            const signatureText = signature.stdout + '\n' + signature.stderr;
            let signatureState;
            if (signature.status === 1 && /code object is not signed at all/.test(signatureText)) signatureState = 'unsigned';
            else if (signature.status === 0 && /^Signature=adhoc\s*$/m.test(signatureText)
              && /^TeamIdentifier=not set\s*$/m.test(signatureText) && !/^Authority=/m.test(signatureText)) signatureState = 'ad-hoc-without-team';
            else throw new Error('Unexpected signing identity or unreadable signature; inspect retained raw output');
            Object.assign(findings, {
              status: 'passed', source_head: runtime.source_head, source_tree: runtime.source_tree,
              app: { version: info.CFBundleShortVersionString, build: info.CFBundleVersion, bundle_id: info.CFBundleIdentifier,
                minimum_OS: info.MinimumOSVersion, DTSDKName: info.DTSDKName, DTSDKBuild: info.DTSDKBuild,
                DTXcode: info.DTXcode, DTXcodeBuild: info.DTXcodeBuild, architectures },
              content: { articles: expected, revision: manifest.revision, verified_files: packageAudit.verified_files,
                verified_bytes: packageAudit.verified_bytes, license_files: licenses },
              app_inventory: { files: inventory.length, bytes: inventory.reduce((sum, file) => sum + file.bytes, 0),
                file: 'app-file-inventory.json', sha256: hash(readFileSync(path.join(evidence, 'app-file-inventory.json'))) },
              privacy: { source_semantics_match: true, actual_sha256: hash(readFileSync(path.join(app, 'PrivacyInfo.xcprivacy'))),
                source_sha256: hash(readFileSync('ios/AILibrary/PrivacyInfo.xcprivacy')), legal_acceptance: 'unadopted' },
              build_version: { platform: 2, minos: field('minos'), sdk: field('sdk') }, dSYM_UUIDs: symbolUUIDs,
              signature_inspection: { state: signatureState, exit_code: signature.status,
                credentialed_signing_or_provisioning_requested: false, provisioning_profile_present: false },
              limits: ['No signed export/IPA/upload or distribution acceptance', 'No Simulator or device launch in this archive job',
                'No minimum-iOS17 runtime, UI, VoiceOver or performance acceptance', 'Hosted images roll forward; toolchain presence is asserted']
            });
          } catch (error) { findings.status = 'failed'; findings.error = String(error.message); process.exitCode = 1; }
          finally {
            put('archive-audit-commands.json', JSON.stringify(commands, null, 2) + '\n');
            put('archive-audit.json', JSON.stringify(findings, null, 2) + '\n');
            console.log(JSON.stringify(findings, null, 2));
          }
          NODE
      - name: Record compact completion or failure
        if: always() && steps.evidence.outcome == 'success'
        env:
          TOOLCHAIN_OUTCOME: ${{ steps.toolchain.outcome }}
          SOURCES_OUTCOME: ${{ steps.sources.outcome }}
          GENERATION_OUTCOME: ${{ steps.generation.outcome }}
          ARCHIVE_OUTCOME: ${{ steps.archive.outcome }}
          PACKAGE_OUTCOME: ${{ steps.package.outcome }}
          BINARY_OUTCOME: ${{ steps.binary.outcome }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { existsSync, readFileSync, writeFileSync } from 'node:fs';
          import path from 'node:path';
          const outcomes = Object.fromEntries(['TOOLCHAIN', 'SOURCES', 'GENERATION', 'ARCHIVE', 'PACKAGE', 'BINARY']
            .map(name => [name.toLowerCase(), process.env[name + '_OUTCOME']]));
          const auditFile = path.join(process.env.EVIDENCE_DIR, 'archive-audit.json');
          const audit = existsSync(auditFile) ? JSON.parse(readFileSync(auditFile, 'utf8')) : null;
          const complete = Object.values(outcomes).every(value => value === 'success') && audit?.status === 'passed';
          const summary = {
            schema_version: 1, status: complete ? 'signing-disabled-archive-compatibility-observed' : 'failed-or-incomplete',
            outcomes, source_head: process.env.EXPECTED_SOURCE_HEAD, archive_audit_status: audit?.status ?? 'unavailable',
            distribution_acceptance: 'unadopted', paid_or_larger_runner_adoption: false, local_OS_adoption: false,
            signed_export_upload: false, Simulator_device_UI_VoiceOver_performance: 'not-run-in-this-archive-job'
          };
          writeFileSync(path.join(process.env.EVIDENCE_DIR, 'preflight-summary.json'),
            JSON.stringify(summary, null, 2) + '\n', { flag: 'wx', mode: 0o600 });
          console.log(JSON.stringify(summary, null, 2));
          NODE
      - name: Stage bounded raw and compact evidence
        id: artifact_scope
        timeout-minutes: 1
        if: always() && steps.evidence.outcome == 'success'
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { createHash } from 'node:crypto';
          import { closeSync, copyFileSync, lstatSync, mkdirSync, openSync, readSync, readdirSync, writeFileSync } from 'node:fs';
          import path from 'node:path';
          const source = process.env.EVIDENCE_DIR, target = path.join(path.dirname(source), 'artifact');
          const budget = 16 * 1024 * 1024, reserved = 128 * 1024, rawCap = 256 * 1024, metadataCap = 1024 * 1024;
          const entries = [], rejected = [];
          let retained = 0;
          mkdirSync(target, { mode: 0o700 });
          const put = (name, data) => {
            assert.ok(retained + data.length <= budget - reserved, 'Artifact total budget exceeded');
            writeFileSync(path.join(target, name), data, { flag: 'wx', mode: 0o600 }); retained += data.length;
          };
          const slice = (file, bytes, start) => {
            const fd = openSync(file, 'r');
            try { const data = Buffer.alloc(bytes); assert.equal(readSync(fd, data, 0, bytes, start), bytes); return data; }
            finally { closeSync(fd); }
          };
          const files = readdirSync(source).sort();
          try {
            assert.ok(files.length <= 256, 'Evidence entry count exceeds finite staging limit');
            for (const name of files) {
              const file = path.join(source, name), stat = lstatSync(file);
              if (stat.isDirectory()) { entries.push({ name, retention: 'omitted-binary-result-directory' }); continue; }
              assert.ok(stat.isFile() && !stat.isSymbolicLink(), 'Only direct regular evidence files are allowed');
              assert.match(name, /^[A-Za-z0-9._-]+\.(?:json|log|plist)$/);
              const isRaw = name.endsWith('.log'), cap = isRaw ? rawCap : metadataCap;
              if (stat.size <= cap) {
                const bytes = slice(file, stat.size, 0); put(name, bytes);
                entries.push({ name, original_bytes: stat.size, retained_bytes: bytes.length, complete: true,
                  SHA256: createHash('sha256').update(bytes).digest('hex') });
              } else {
                const head = slice(file, rawCap / 4, 0), tail = slice(file, rawCap * 3 / 4, stat.size - rawCap * 3 / 4);
                put(name + '.head.log', head); put(name + '.tail.log', tail);
                entries.push({ name, original_bytes: stat.size, retained_bytes: head.length + tail.length, complete: false,
                  head_file: name + '.head.log', tail_file: name + '.tail.log', reason: 'explicit bounded raw portions; middle not retained' });
                if (!isRaw) rejected.push(name + ': required metadata exceeds limit');
              }
            }
          } catch (error) { rejected.push(String(error)); }
          const report = { schema_version: 1, status: rejected.length ? 'artifact-scope-rejected' : 'bounded-evidence-staged',
            source_head: process.env.EXPECTED_SOURCE_HEAD, budget_bytes: budget, retained_payload_bytes: retained,
            raw_file_cap_bytes: rawCap, metadata_file_cap_bytes: metadataCap, entries, rejected,
            xcarchive_app_xcresult_retained: false, scope: 'Logs above cap retain literal head/tail portions with incomplete=true; not complete raw logs.' };
          const bytes = Buffer.from(JSON.stringify(report, null, 2) + '\n');
          assert.ok(bytes.length <= reserved && retained + bytes.length <= budget);
          writeFileSync(path.join(target, 'artifact-scope.json'), bytes, { flag: 'wx', mode: 0o600 });
          assert.deepEqual(rejected, [], 'Required metadata or artifact staging limits failed; inspect bounded evidence');
          NODE
      - name: Retain bounded preview evidence
        timeout-minutes: 2
        if: always() && steps.evidence.outcome == 'success' && steps.artifact_scope.outcome != 'skipped'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ios-sdk27-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: .local/ios-sdk27/artifact
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
  ios-runtime27-smoke:
    name: iOS 27.0 representative UI smoke
    # Exact public-repository gate is evaluated before allocating a standard VM.
    if: github.repository == 'pero3dev/ai-agent-library' && github.event.repository.private == false && (github.event_name == 'pull_request' || inputs.run_smoke == true)
    runs-on: xcode-27
    # Explicit step caps total51min, including2min diagnostics,4min cleanup,1min staging and2min upload.
    # UI is followed by owned cleanup; diagnostics reuse the later primary result. Cancelled app/result audits skip.
    # Forced cancellation/runner loss can still interrupt cleanup or upload.
    timeout-minutes: 40
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.app/Contents/Developer
      EVIDENCE_DIR: ${{ github.workspace }}/.local/ios-runtime27/evidence
      EXPECTED_SOURCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
      REPOSITORY_IS_PRIVATE: ${{ github.event.repository.private }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        timeout-minutes: 2
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            ios/tools/package-lock.json
      - name: Create fresh private evidence storage
        timeout-minutes: 1
        id: evidence
        run: |
          set -euo pipefail
          [[ ! -L .local && ! -e .local/ios-runtime27 && ! -L .local/ios-runtime27 ]]
          mkdir -p "$EVIDENCE_DIR"
          chmod 700 .local/ios-runtime27 "$EVIDENCE_DIR"
      - name: Verify toolchain and select documented runtime and device type
        timeout-minutes: 3
        id: inventory
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { spawnSync } from 'node:child_process';
          import { existsSync, writeFileSync } from 'node:fs';
          import path from 'node:path';
          const evidence = process.env.EVIDENCE_DIR;
          const put = (name, value) => writeFileSync(path.join(evidence, name), value, { flag: 'wx', mode: 0o600 });
          const json = (name, value) => put(name, JSON.stringify(value, null, 2) + '\n');
          const inventoryStartedMonotonicMs = performance.now();
          const inventoryDeadlineMonotonicMs = inventoryStartedMonotonicMs + 150000;
          const read = (name, binary, args) => {
            const readMonotonicMs = performance.now();
            const remainingBudgetMs = Math.floor(inventoryDeadlineMonotonicMs - readMonotonicMs);
            const timeoutMs = Math.min(120000, Math.max(0, remainingBudgetMs));
            json(name + '.intent.json', { schema_version: 1, binary, arguments: args,
              timeout_ms: timeoutMs, remaining_budget_ms: remainingBudgetMs,
              started_monotonic_ms: inventoryStartedMonotonicMs, deadline_monotonic_ms: inventoryDeadlineMonotonicMs,
              read_monotonic_ms: readMonotonicMs, spawn_planned: remainingBudgetMs > 0 });
            let result;
            if (remainingBudgetMs <= 0) {
              result = { status: null, signal: null, stdout: '', stderr: '',
                error: new Error('Inventory read budget exhausted before spawn') };
            } else {
              try {
                result = spawnSync(binary, args, { encoding: 'utf8', timeout: timeoutMs,
                  killSignal: 'SIGKILL', maxBuffer: 16 * 1024 * 1024 });
              } catch (error) {
                result = { status: null, signal: null, stdout: '', stderr: '',
                  error: error ?? new Error('Unknown inventory spawn exception') };
              }
            }
            put(name + '.stdout.log', result.stdout ?? ''); put(name + '.stderr.log', result.stderr ?? '');
            json(name + '.exit.json', { binary, arguments: args, exit_code: result.status, signal: result.signal,
              error: result.error?.message ?? (result.error === undefined ? null : String(result.error)) });
            assert.equal(result.error, undefined, name); assert.equal(result.status, 0, name);
            assert.ok(performance.now() < inventoryDeadlineMonotonicMs, name + ': inventory deadline exceeded');
            return result.stdout.trim();
          };
          assert.equal(process.env.GITHUB_REPOSITORY, 'pero3dev/ai-agent-library');
          assert.equal(process.env.REPOSITORY_IS_PRIVATE, 'false');
          assert.equal(process.env.DEVELOPER_DIR, '/Applications/Xcode_27.app/Contents/Developer');
          assert.ok(existsSync(process.env.DEVELOPER_DIR), 'Documented Xcode missing; no fallback or download');
          const macOS = read('macos', 'sw_vers', ['-productVersion']);
          const architecture = read('architecture', 'uname', ['-m']);
          const Xcode = read('xcode', 'xcodebuild', ['-version']);
          assert.equal(macOS.split('.')[0], '27'); assert.equal(architecture, 'arm64');
          assert.equal(Xcode, 'Xcode 27.0\nBuild version 27A266a');
          const sdk = read('simulator-sdk-version', 'xcrun', ['--sdk', 'iphonesimulator', '--show-sdk-version']);
          assert.equal(sdk, '27.0');
          const sdkBuild = read('simulator-sdk-build', 'xcrun', ['--sdk', 'iphonesimulator', '--show-sdk-build-version']);
          const sdkPath = read('simulator-sdk-path', 'xcrun', ['--sdk', 'iphonesimulator', '--show-sdk-path']);
          assert.match(sdkBuild, /^[A-Za-z0-9]+$/); assert.ok(path.isAbsolute(sdkPath) && existsSync(sdkPath));
          const head = read('source-head', 'git', ['rev-parse', 'HEAD']);
          assert.match(head, /^[a-f0-9]{40}$/); assert.equal(head, process.env.EXPECTED_SOURCE_HEAD);
          const tree = read('source-tree', 'git', ['rev-parse', 'HEAD^{tree}']);
          assert.match(tree, /^[a-f0-9]{40}$/);
          const runtimeInventory = JSON.parse(read('simctl-runtimes', 'xcrun', ['simctl', 'list', 'runtimes', '--json']));
          const typeInventory = JSON.parse(read('simctl-device-types', 'xcrun', ['simctl', 'list', 'devicetypes', '--json']));
          assert.ok(Array.isArray(runtimeInventory.runtimes)); assert.ok(Array.isArray(typeInventory.devicetypes));
          const iosVersionRows = runtimeInventory.runtimes.filter(row => row?.version === '27.0' &&
            (row.platform === 'iOS' || row.name === 'iOS 27.0' || String(row.identifier).startsWith('com.apple.CoreSimulator.SimRuntime.iOS-')));
          for (const row of iosVersionRows) {
            assert.equal(row.name, 'iOS 27.0');
            assert.match(row.identifier, /^com\.apple\.CoreSimulator\.SimRuntime\.iOS-[A-Za-z0-9.-]+$/);
            assert.equal(typeof row.isAvailable, 'boolean', 'Unknown availability must fail closed');
            if (row.platform !== undefined) assert.equal(row.platform, 'iOS');
          }
          const available = iosVersionRows.filter(row => row.isAvailable === true);
          assert.equal(available.length, 1, 'Exactly one available iOS 27.0 runtime is required');
          const runtime = available[0];
          assert.equal(typeof runtime.buildversion, 'string'); assert.ok(runtime.buildversion.length > 0);
          const types = typeInventory.devicetypes.filter(row => row?.name === 'iPhone 17');
          assert.equal(types.length, 1, 'Exactly one iPhone 17 device type is required');
          const deviceType = types[0];
          assert.match(deviceType.identifier, /^com\.apple\.CoreSimulator\.SimDeviceType\.[A-Za-z0-9.-]+$/);
          if (deviceType.productFamily !== undefined) assert.equal(deviceType.productFamily, 'iPhone');
          json('selection.json', { schema_version: 1, status: 'selected-from-actual-inventory', source_head: head,
            source_tree: tree, repository: process.env.GITHUB_REPOSITORY, repository_private: false,
            runner_label: 'xcode-27', standard_runner: true, macOS, architecture, Xcode,
            developer_directory: process.env.DEVELOPER_DIR, image_OS: process.env.ImageOS ?? null,
            image_version: process.env.ImageVersion ?? null, sdk, sdk_build: sdkBuild, sdk_path: sdkPath,
            runtime, device_type: deviceType,
            inventory_reference: 'https://github.com/actions/runner-images/blob/main/images/macos/xcode-27-arm64-Readme.md#installed-simulators',
            scope: 'Preview iOS27.0 representative smoke only; actual runtime build is captured from inventory. No minimum-iOS17, device, VoiceOver or performance acceptance.' });
          NODE
      - name: Audit content tooling before installation
        timeout-minutes: 1
        id: root_audit
        run: |
          set -euo pipefail
          npm audit --package-lock-only --audit-level=high 2>&1 | tee "$EVIDENCE_DIR/root-lock-audit.log"
      - name: Install content tooling without lifecycle scripts
        timeout-minutes: 2
        id: root_install
        run: |
          set -euo pipefail
          npm ci --ignore-scripts 2>&1 | tee "$EVIDENCE_DIR/root-npm-ci.log"
      - name: Audit native asset tooling before installation
        timeout-minutes: 1
        id: tools_audit
        working-directory: ios/tools
        run: |
          set -euo pipefail
          npm audit --package-lock-only --audit-level=high 2>&1 | tee "$EVIDENCE_DIR/tools-lock-audit.log"
      - name: Install native assets without lifecycle scripts
        timeout-minutes: 2
        id: tools_install
        working-directory: ios/tools
        run: |
          set -euo pipefail
          npm ci --ignore-scripts 2>&1 | tee "$EVIDENCE_DIR/tools-npm-ci.log"
      - name: Install the lockfile-matched Chromium
        timeout-minutes: 2
        id: browser
        working-directory: ios/tools
        run: |
          set -euo pipefail
          ./node_modules/.bin/playwright install chromium 2>&1 | tee "$EVIDENCE_DIR/chromium-install.log"
      - name: Generate and audit representative three and separate fixture four
        timeout-minutes: 4
        id: content
        run: |
          set -euo pipefail
          # Direct CLI defaults retain representative compatibility before PR261.
          node scripts/build-ios-native-content.mjs 2>&1 | tee "$EVIDENCE_DIR/representative-generation.log"
          node scripts/build-ios-native-content.mjs --fixtures 2>&1 | tee "$EVIDENCE_DIR/fixture-generation.log"
          node ios/tests/native-content-audit.mjs 2>&1 | tee "$EVIDENCE_DIR/representative-source-audit.json"
          node ios/tests/native-content-audit.mjs --fixtures 2>&1 | tee "$EVIDENCE_DIR/fixture-source-audit.json"
          bash ios/tests/check-package.sh ios/AILibrary/Content 3 2>&1 | tee "$EVIDENCE_DIR/representative-consumer.json"
          bash ios/tests/check-package.sh ios/AILibrary/TestContent 4 2>&1 | tee "$EVIDENCE_DIR/fixture-consumer.json"
      - name: Create and boot this job's dedicated Simulator
        timeout-minutes: 6
        id: simulator
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { spawnSync } from 'node:child_process';
          import { randomUUID } from 'node:crypto';
          import { readFileSync, writeFileSync } from 'node:fs';
          import path from 'node:path';
          const evidence = process.env.EVIDENCE_DIR;
          const put = (name, value) => writeFileSync(path.join(evidence, name), value, { flag: 'wx', mode: 0o600 });
          const json = (name, value) => put(name, JSON.stringify(value, null, 2) + '\n');
          const run = (name, args, timeoutMs = 120000) => {
            const result = spawnSync('xcrun', ['simctl', ...args], { encoding: 'utf8', timeout: timeoutMs, maxBuffer: 16 * 1024 * 1024 });
            put(name + '.stdout.log', result.stdout ?? ''); put(name + '.stderr.log', result.stderr ?? '');
            json(name + '.exit.json', { binary: 'xcrun', arguments: ['simctl', ...args], timeout_ms: timeoutMs, exit_code: result.status, signal: result.signal, error: result.error?.message ?? null });
            assert.equal(result.error, undefined, name); assert.equal(result.status, 0, name);
            return result.stdout.trim();
          };
          const selection = JSON.parse(readFileSync(path.join(evidence, 'selection.json'), 'utf8'));
          assert.equal(selection.status, 'selected-from-actual-inventory');
          assert.equal(selection.source_head, process.env.EXPECTED_SOURCE_HEAD);
          const before = JSON.parse(run('devices-before-create', ['list', 'devices', '--json']));
          assert.ok(before.devices && typeof before.devices === 'object' && !Array.isArray(before.devices));
          const uuidPattern = /^[A-Fa-f0-9]{8}(?:-[A-Fa-f0-9]{4}){3}-[A-Fa-f0-9]{12}$/;
          const preexisting = [];
          for (const rows of Object.values(before.devices)) {
            assert.ok(Array.isArray(rows));
            for (const row of rows) { assert.match(row.udid, uuidPattern); preexisting.push(row.udid.toUpperCase()); }
          }
          assert.equal(new Set(preexisting).size, preexisting.length);
          const token = randomUUID();
          const name = `AILibrary-runtime27-${process.env.GITHUB_RUN_ID}-${process.env.GITHUB_RUN_ATTEMPT}-${token}`;
          const intent = { schema_version: 1, repository: process.env.GITHUB_REPOSITORY,
            run_id: process.env.GITHUB_RUN_ID, run_attempt: process.env.GITHUB_RUN_ATTEMPT,
            source_head: selection.source_head, token, name, runtime_identifier: selection.runtime.identifier,
            device_type_identifier: selection.device_type.identifier, preexisting_UUIDs: preexisting };
          // Durable intent precedes create. Raw create output/exit survive a later failure.
          json('owned-simulator-intent.json', intent);
          const uuid = run('create-simulator', ['create', name, intent.device_type_identifier, intent.runtime_identifier]);
          assert.match(uuid, uuidPattern); assert.ok(!preexisting.includes(uuid.toUpperCase()));
          json('owned-simulator.json', { ...intent, UUID: uuid.toUpperCase(), creation_exit_code: 0 });
