name: Weekly dependency audit
on:
  schedule:
    - cron: '41 22 * * 0'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: weekly-dependency-audit
  cancel-in-progress: false
jobs:
  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Audit root lockfile before installation
        run: npm audit --package-lock-only --audit-level=high
      - name: Audit website lockfile before installation
        if: always()
        run: npm audit --package-lock-only --audit-level=high
        working-directory: website
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        if: always()
        with:
          python-version: '3.11'
      - name: Install pinned auditor only
        if: always()
        run: python -m pip install -r harness/requirements-audit.txt
      - name: Audit Python requirements without running sample code
        if: always()
        run: |
          set -euo pipefail
          failed=0
          for requirements in examples/tests/requirements.txt examples/python/*/requirements.txt; do
            python -X utf8 -m pip_audit --strict -r "$requirements" --progress-spinner off || failed=1
          done
          exit "$failed"
