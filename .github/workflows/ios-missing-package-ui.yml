name: iOS missing package and restored install UI

'on':
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/ios-missing-package-ui.yml'
      - '.github/scripts/ios-missing-package-ui/**'
      - 'ios/**'
      - 'scripts/build-ios-native-content.mjs'
      - 'scripts/build-ios-native-content.mts'
      - 'scripts/lib/ios-*.mjs'
      - 'scripts/lib/ios-*.mts'
      - 'package.json'
      - 'package-lock.json'

permissions:
  contents: read

concurrency:
  group: ios-missing-package-${{ github.ref }}
  cancel-in-progress: true

jobs:
  missing-package-ui:
    name: iOS initial missing package and restored upgrade preserving data
    if: github.repository == 'pero3dev/ai-agent-library' && github.event.repository.private == false
    runs-on: macos-15
    # Step caps total 55 minutes, including 4 minutes owned cleanup and 2 upload.
    # Cancellation or runner loss can still interrupt cleanup and artifact upload.
    timeout-minutes: 60
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
      EXPECTED_SOURCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
      REPOSITORY_IS_PRIVATE: ${{ github.event.repository.private }}
      EVIDENCE_DIR: ${{ github.workspace }}/.local/ios-missing-package/evidence
      DRIVER_PATH: ${{ github.workspace }}/.github/scripts/ios-missing-package-ui/stage-driver.mts
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        timeout-minutes: 2
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            ios/tools/package-lock.json
      - name: Prepare owned evidence and bounded stage driver
        id: prepare
        timeout-minutes: 1
        run: |
          set -euo pipefail
          [[ ! -L .local && ! -e .local/ios-missing-package && ! -L .local/ios-missing-package ]]
          mkdir -p "$EVIDENCE_DIR"
          chmod 700 .local/ios-missing-package "$EVIDENCE_DIR"
          test -f "$DRIVER_PATH"
          chmod 600 "$DRIVER_PATH"
      - name: Bind source, Xcode and actual iOS 18.5 inventory
        id: inventory
        timeout-minutes: 3
        run: node "$DRIVER_PATH" inventory
      - name: Audit the root lockfile before installation
        id: root_audit
        timeout-minutes: 1
        run: |
          set -euo pipefail
          npm audit --package-lock-only --audit-level=high 2>&1 | tee "$EVIDENCE_DIR/root-audit.log"
      - name: Install root tooling without lifecycle scripts
        id: root_tools
        timeout-minutes: 2
        run: |
          set -euo pipefail
          npm ci --ignore-scripts 2>&1 | tee "$EVIDENCE_DIR/root-install.log"
      - name: Audit the native assets lockfile before installation
        id: asset_audit
        timeout-minutes: 1
        working-directory: ios/tools
        run: |
          set -euo pipefail
          npm audit --package-lock-only --audit-level=high 2>&1 | tee "$EVIDENCE_DIR/assets-audit.log"
      - name: Install native assets without lifecycle scripts
        id: asset_tools
        timeout-minutes: 2
        working-directory: ios/tools
        run: |
          set -euo pipefail
          npm ci --ignore-scripts 2>&1 | tee "$EVIDENCE_DIR/assets-install.log"
      - name: Install the lockfile-matched Chromium
        id: browser
        timeout-minutes: 2
        working-directory: ios/tools
        run: |
          set -euo pipefail
          ./node_modules/.bin/playwright install chromium 2>&1 | tee "$EVIDENCE_DIR/browser-install.log"
      - name: Generate and audit only the normal representative package
        id: content
        timeout-minutes: 4
        run: |
          set -euo pipefail
          [[ ! -e ios/AILibrary/TestContent && ! -L ios/AILibrary/TestContent ]]
          node scripts/build-ios-native-content.mjs 2>&1 | tee "$EVIDENCE_DIR/generation.log"
          node ios/tests/native-content-audit.mjs 2>&1 | tee "$EVIDENCE_DIR/source-audit.json"
          bash ios/tests/check-package.sh ios/AILibrary/Content 3 2>&1 | tee "$EVIDENCE_DIR/package-audit.json"
      - name: Create and boot one fresh owned Simulator
        id: simulator
        timeout-minutes: 5
        run: node "$DRIVER_PATH" simulator
      - name: Build the normal app and test bundle once
        id: build
        timeout-minutes: 8
        run: node "$DRIVER_PATH" build
      - name: Stage F - omit one native JSON and observe failure and retry UI
        id: failure
        timeout-minutes: 6
        run: node "$DRIVER_PATH" failure
      - name: Stage R - restore bytes, preserve sentinel through upgrade and read bodies
        id: restored
        if: always() && !cancelled() && steps.build.outcome == 'success' && steps.failure.outcome != 'skipped'
        timeout-minutes: 7
        run: node "$DRIVER_PATH" restore
      - name: Clean up only the proven owned Simulator
        id: cleanup
        if: always() && steps.prepare.outcome == 'success'
        timeout-minutes: 4
        run: node "$DRIVER_PATH" cleanup
      - name: Audit the two raw results independently
        id: audit
        if: always() && !cancelled() && steps.build.outcome == 'success'
        timeout-minutes: 2
        run: node "$DRIVER_PATH" audit
      - name: Record passed, failed and skipped stages
        if: always() && steps.prepare.outcome == 'success'
        timeout-minutes: 1
        env:
          INVENTORY_OUTCOME: ${{ steps.inventory.outcome }}
          ROOT_AUDIT_OUTCOME: ${{ steps.root_audit.outcome }}
          ROOT_TOOLS_OUTCOME: ${{ steps.root_tools.outcome }}
          ASSET_AUDIT_OUTCOME: ${{ steps.asset_audit.outcome }}
          ASSET_TOOLS_OUTCOME: ${{ steps.asset_tools.outcome }}
          BROWSER_OUTCOME: ${{ steps.browser.outcome }}
          CONTENT_OUTCOME: ${{ steps.content.outcome }}
          SIMULATOR_OUTCOME: ${{ steps.simulator.outcome }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          FAILURE_OUTCOME: ${{ steps.failure.outcome }}
          RESTORED_OUTCOME: ${{ steps.restored.outcome }}
          CLEANUP_OUTCOME: ${{ steps.cleanup.outcome }}
          AUDIT_OUTCOME: ${{ steps.audit.outcome }}
        run: node "$DRIVER_PATH" summary
      - name: Retain compact top-level JSON and log receipts
        if: always() && steps.prepare.outcome == 'success'
        timeout-minutes: 1
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ios-missing-package-ui-compact-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .local/ios-missing-package/evidence/*.json
            .local/ios-missing-package/evidence/*.log
            !.local/ios-missing-package/evidence/**/*/*
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90
      - name: Retain both raw results, package inventories and owned cleanup receipts
        if: always() && steps.prepare.outcome == 'success'
        timeout-minutes: 1
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ios-missing-package-ui-${{ github.run_id }}-${{ github.run_attempt }}
          path: .local/ios-missing-package/evidence
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90
