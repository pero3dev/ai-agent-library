               assert case_started_at is not None and case_finished_at is None,'The fixed case must finish once after starting';case_finished_at=time.monotonic();case_end_result='Passed' if text.startswith(marker+' passed (') else 'Failed'
              if text.startswith(('Test Case ','Test Suite ')) or 'Executed ' in text or '** TEST ' in text:
               assert len(events)<64;events.append(text[:2048])
             assert len(pending)<MAX
            elif child.poll() is not None:break
            poll_now=time.monotonic();budget=None if live_polling_stopped else poll_budget(poll_now,case_started_at,sdk_deadline,last_poll,polls)
            if budget is not None and child.poll() is None:
