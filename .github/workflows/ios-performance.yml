# NEVER_MERGE: temporary branch-only replacement of the existing filename.
# Not executable until SourceCore finalsync SHA is bound and this new Hosted
# profile receives separate final source/payload review. No current source ref.
name: NEVER_MERGE Core current CLI Hosted pilot

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-core-current-cli-pilot
  cancel-in-progress: false

jobs:
  core-current-cli-pilot:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.repository == 'pero3dev/ai-agent-library' &&
      github.event.repository.private == false &&
      github.ref == 'refs/heads/codex/ios-core-current-cli-pilot' &&
      github.run_attempt == 1
    runs-on: macos-15
    timeout-minutes: 20
    env:
      EXPECTED_SOURCE_HEAD: 'b39eeff4647336124a39e218205cd8dd85fc1819'
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
      CORE_WORK: /private/tmp/ailibrary-core-current-cli-${{ github.run_id }}-${{ github.run_attempt }}
      PYTHONDONTWRITEBYTECODE: '1'
      NEVER_MERGE: 'true'
    defaults:
      run:
        shell: bash
    steps:
      - name: Fence the one dispatch before checkout or installation
        timeout-minutes: 1
        run: |
          set -euo pipefail
          [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]
          [[ "$GITHUB_REPOSITORY" == pero3dev/ai-agent-library ]]
          [[ "$GITHUB_REF" == refs/heads/codex/ios-core-current-cli-pilot ]]
          [[ "$GITHUB_RUN_ATTEMPT" == 1 ]]
          [[ "$EXPECTED_SOURCE_HEAD" =~ ^[0-9a-f]{40}$ ]]
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$EXPECTED_SOURCE_HEAD" != "$GITHUB_SHA" ]]
          [[ "$(date -u +%s)" -lt 1793577600 ]]
          mkdir -m 700 "$CORE_WORK"
          printf 'PILOT_STARTED_UNIX=%s\n' "$(date -u +%s)" >> "$GITHUB_ENV"
      - name: Read the temporary workflow helper source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: pilot
          fetch-depth: 1
          persist-credentials: false
      - name: Read the explicit immutable Core finalsync source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.EXPECTED_SOURCE_HEAD }}
          path: source
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Bind distinct workflow and CodeSource identities; capture installed host
        timeout-minutes: 1
        run: |
          set -euo pipefail
          export NODE_BINARY="$(command -v node)"
          printf 'NODE_BINARY=%s\n' "$NODE_BINARY" >> "$GITHUB_ENV"
          [[ "$(git -C source rev-parse HEAD)" == "$EXPECTED_SOURCE_HEAD" ]]
          [[ "$(git -C pilot rev-parse HEAD)" == "$GITHUB_SHA" ]]
          export WORKFLOW_TREE="$(git -C pilot rev-parse HEAD^{tree})"
          export CODE_SOURCE_TREE="$(git -C source rev-parse HEAD^{tree})"
          python3 - <<'PY'
          import hashlib,json,os,pathlib,platform,plistlib,subprocess
          root=pathlib.Path(os.environ['CORE_WORK'])
          xcode=pathlib.Path('/Applications/Xcode_16.4.app/Contents')
          version=plistlib.loads((xcode/'version.plist').read_bytes())
          sdk=xcode/'Developer/Platforms/MacOSX.platform/Developer/SDKs/MacOSX15.5.sdk'
          settings=json.loads((sdk/'SDKSettings.json').read_text())
          assert platform.system()=='Darwin' and platform.machine()=='arm64'
          assert platform.mac_ver()[0].startswith('15.')
          assert version['CFBundleShortVersionString']=='16.4' and version['ProductBuildVersion']=='16F6'
          assert settings['Version']=='15.5'
          node=os.environ['NODE_BINARY'];nodeversion=subprocess.check_output([node,'--version'],text=True).strip()
          assert nodeversion.startswith('v24.')
          h=lambda p:hashlib.sha256(p.read_bytes()).hexdigest()
          data={'macOS':platform.mac_ver()[0],'architecture':platform.machine(),'Xcode':'16.4','Xcode_build':'16F6','SDK':'15.5','Node':nodeversion,'Node_binary':node,'SDKSettings_SHA256':h(sdk/'SDKSettings.json'),'Xcode_version_plist_SHA256':h(xcode/'version.plist')}
          (root/'host-capture.json').write_text(json.dumps(data,indent=2)+'\n')
          context={'workflow_head_external':os.environ['GITHUB_SHA'],'workflow_ref_external':os.environ['GITHUB_WORKFLOW_REF'],'workflow_tree_external':os.environ['WORKFLOW_TREE'],'CodeSourceTree_external':os.environ['CODE_SOURCE_TREE'],'CodeSourceSHA_external':os.environ['EXPECTED_SOURCE_HEAD'],'run_id_external':os.environ['GITHUB_RUN_ID'],'run_attempt':1,'profile':'new HostedMac15-Xcode16.4-SDK15.5; not comparable with b79 local history','entry':'validated alias-equivalent direct Node; npm wrapper not executed','actualApp_Simulator_UI_measurement':0,'metric_budget_adoption':None,'never_merge':True}
          (root/'dispatch-context.json').write_text(json.dumps(context,indent=2)+'\n')
          PY
      - name: Audit the root and native-tooling lockfiles before installation
        timeout-minutes: 2
        working-directory: source
        run: |
          set -euo pipefail
          npm audit --package-lock-only --audit-level=high
          (cd ios/tools && npm audit --package-lock-only --audit-level=high)
      - name: Install both locked toolchains without lifecycle scripts
        timeout-minutes: 3
        working-directory: source
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          (cd ios/tools && npm ci --ignore-scripts)
      - name: Install the existing lockfile-matched asset browser
        timeout-minutes: 3
        working-directory: source/ios/tools
        run: ./node_modules/.bin/playwright install chromium
      - name: Generate the standard full published corpus from CodeSource
        timeout-minutes: 6
        working-directory: source
        run: |
          set -euo pipefail
          npm run ios:prepare > "$CORE_WORK/published-generation.log" 2>&1
      - name: Independently audit source and actual consumer before the Core interval
        timeout-minutes: 4
        working-directory: source
        run: |
          set -euo pipefail
          npm run --silent ios:test:content > "$CORE_WORK/source-audit.json"
          # This is a separate host consumer-audit compile, outside the one Core
          # benchmark compile/19-process interval. No actual iOS app is built.
          npm run --silent ios:test:package -- 199 > "$CORE_WORK/consumer-audit.json"
      - name: Freeze source4/Core8/generator/query and all626 corpus file hashes
        timeout-minutes: 1
        run: |
          set -euo pipefail
          node pilot/.github/scripts/core-current-cli-inputs.mjs freeze \
            "$GITHUB_WORKSPACE/source" "$CORE_WORK" "$EXPECTED_SOURCE_HEAD"
      - name: One guarded alias-equivalent Core CLI compile and19 processes
        timeout-minutes: 4
        env:
          CORE_SOURCE_REPO: ${{ github.workspace }}/source
        run: |
          set -euo pipefail
          [[ "$(date -u +%s)" -lt "$((PILOT_STARTED_UNIX + 12 * 60))" ]]
          python3 pilot/.github/scripts/core-current-cli-guard.py
      - name: Compare the frozen source and corpus after any attempted CLI
        if: always()
        timeout-minutes: 1
        run: |
          set -euo pipefail
          if [[ -f "$CORE_WORK/input-manifest.json" ]]; then
            node pilot/.github/scripts/core-current-cli-inputs.mjs verify \
              "$GITHUB_WORKSPACE/source" "$CORE_WORK"
          fi
      - name: Stage bounded raw evidence only; no Content/cache/executable/DerivedData
        if: always()
        timeout-minutes: 1
        env:
          CORE_ARTIFACT: ${{ runner.temp }}/core-current-cli-small-evidence
        run: |
          set -euo pipefail
          if [[ -d "$CORE_WORK" && -f pilot/.github/scripts/core-current-cli-inputs.mjs ]]; then
            node pilot/.github/scripts/core-current-cli-inputs.mjs stage "$CORE_WORK" "$CORE_ARTIFACT"
          else
            mkdir -m 700 "$CORE_ARTIFACT"
            printf '{"status":"pilot-unavailable-before-guard","measurement_success":false}\n' > "$CORE_ARTIFACT/unavailable.json"
          fi
      - name: Retain the small new-profile raw observation or failure
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: NEVER-MERGE-core-current-cli-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/core-current-cli-small-evidence
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
