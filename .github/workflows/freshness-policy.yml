# PR 自身が検査定義を書き換えられないよう、default branch の workflow を使用する。
# PR の tree は Git のデータとしてのみ読む。checkout・npm install・候補コードの実行は禁止。
name: Freshness policy
run-name: 'Freshness policy PR #${{ github.event.pull_request.number }}'

on:
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened, edited, ready_for_review]

permissions:
  contents: read

concurrency:
  group: freshness-policy-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # 通常 PR も成功させ、ブランチ保護の required check 名を常に固定する。
  freshness-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Classify freshness PR
        id: scope
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [[ "$HEAD_BRANCH" == automation/freshness-* ]]; then
            if [[ "$HEAD_REPOSITORY" != "$BASE_REPOSITORY" ]]; then
              echo "External freshness branches are not eligible for automation."
              exit 1
            fi
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Regular change: freshness-specific policy is not applicable."
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.scope.outputs.enabled == 'true'
        with:
          # 明示的に信頼する base の検査コード・registry・schema を使用する。
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: steps.scope.outputs.enabled == 'true'
        with:
          node-version: 22
      - name: Install trusted base dependencies without lifecycle scripts
        if: steps.scope.outputs.enabled == 'true'
        run: npm ci --ignore-scripts
      - name: Verify evidence and allowed changes using trusted base
        if: steps.scope.outputs.enabled == 'true'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          [[ "$BASE_SHA" =~ ^[a-f0-9]{40}$ && "$HEAD_SHA" =~ ^[a-f0-9]{40}$ ]]
          git fetch --no-tags origin "$HEAD_SHA"
          node scripts/freshness-policy.mjs --base "$BASE_SHA" --head "$HEAD_SHA" --branch "$HEAD_BRANCH"
