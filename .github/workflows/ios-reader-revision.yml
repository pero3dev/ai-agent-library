name: iOS valid reader revision regression

on:
  pull_request:
    paths:
      - '.github/workflows/ios-reader-revision.yml'
      - 'ios/tests/xctestrun-metadata.mjs'
      - 'ios/tests/xctestrun-metadata.mts'
      - '.github/scripts/ios-reader-revision/**/*.mts'
      - 'ios/tests/simctl-inventory-read.mjs'
      - 'ios/tests/simctl-inventory-read.mts'
      - 'ios/tests/create-reader-revision-fixtures.mjs'
      - 'ios/tests/create-reader-revision-fixtures.mts'
      - 'tests/unit/ios-reader-revision-fixtures.test.mjs'
      - 'tests/unit/ios-reader-revision-fixtures.test.mts'
      - 'ios/AILibraryUITests/ReaderReflowUITests.swift'
      - 'ios/AILibrary.xcodeproj/project.pbxproj'

permissions:
  contents: read

concurrency:
  group: ios-reader-revision-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reader-revision:
    name: iOS valid package revision and paragraph reflow regression
    if: github.repository == 'pero3dev/ai-agent-library' && github.event.repository.private == false && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == 'pero3dev/ai-agent-library' && github.event.pull_request.base.repo.full_name == 'pero3dev/ai-agent-library'
    runs-on: macos-15
    # Explicit step caps total53min; only list-read timeouts repeat once within their caps.
    # Runner loss or forced cancellation can still interrupt owned cleanup.
    timeout-minutes: 54
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
      EXPECTED_SOURCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
      EVIDENCE_DIR: ${{ github.workspace }}/.local/ios-reader-revision/evidence
      DRIVER_PATH: ${{ github.workspace }}/.github/scripts/ios-reader-revision/driver.mts
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        timeout-minutes: 2
        with:
          node-version: 22.22.2
          cache: npm
          cache-dependency-path: |
            package-lock.json
      - name: Create private owned evidence and bounded driver
        id: prepare
        timeout-minutes: 1
        run: |
          set -euo pipefail
          [[ ! -L .local && ! -e .local/ios-reader-revision && ! -L .local/ios-reader-revision ]]
          mkdir -p "$EVIDENCE_DIR"
          chmod 700 .local/ios-reader-revision "$EVIDENCE_DIR"
      - name: Bind the exact selected source and Xcode16.4 iOS18.5 inventory
        id: inventory
        timeout-minutes: 4
        run: node "$DRIVER_PATH" inventory
      - name: Audit and install existing root lock and run fixture boundary controls
        id: tools
        timeout-minutes: 4
        run: node "$DRIVER_PATH" tools
      - name: Generate and consumer-audit the controlled normal A and B packages
        id: content
        timeout-minutes: 4
        run: node "$DRIVER_PATH" content
      - name: Create and boot one fresh owned iPhone16
        id: simulator
        timeout-minutes: 6
        run: node "$DRIVER_PATH" simulator
      - name: Build the dedicated one-article B app and test bundle once
        id: build
        timeout-minutes: 7
        run: node "$DRIVER_PATH" build
      - name: Install B and exclusively seed stored A in the owned app data
        id: seed
        timeout-minutes: 3
        run: node "$DRIVER_PATH" seed
      - name: Run only the one valid-revision paragraph case and audit B files
        id: ui
        timeout-minutes: 11
        run: node "$DRIVER_PATH" ui
      - name: Clean up only the proven owned Simulator
        id: cleanup
        if: always() && steps.prepare.outcome == 'success'
        timeout-minutes: 3
        run: node "$DRIVER_PATH" cleanup
      - name: Require the exact one-case result on the owned iOS18.5 device
        id: audit
        if: always() && !cancelled() && steps.ui.outcome == 'success'
        timeout-minutes: 1
        run: node "$DRIVER_PATH" audit
      - name: Record all passed failed and skipped stages
        if: always() && steps.prepare.outcome == 'success'
        timeout-minutes: 1
        env:
          INVENTORY_OUTCOME: ${{ steps.inventory.outcome }}
          TOOLS_OUTCOME: ${{ steps.tools.outcome }}
          CONTENT_OUTCOME: ${{ steps.content.outcome }}
          SIMULATOR_OUTCOME: ${{ steps.simulator.outcome }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          SEED_OUTCOME: ${{ steps.seed.outcome }}
          UI_OUTCOME: ${{ steps.ui.outcome }}
          CLEANUP_OUTCOME: ${{ steps.cleanup.outcome }}
          AUDIT_OUTCOME: ${{ steps.audit.outcome }}
        run: node "$DRIVER_PATH" summary
      - name: Enforce raw evidence storage and entry bounds before upload
        id: storage
        if: always() && steps.prepare.outcome == 'success'
        timeout-minutes: 1
        run: node "$DRIVER_PATH" storage
      - name: Retain compact bounded receipts even after failure
        if: always() && steps.prepare.outcome == 'success'
        timeout-minutes: 1
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ios-reader-revision-compact-${{ github.run_id }}-${{ github.run_attempt }}
          path: .local/ios-reader-revision/evidence/*.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90
      - name: Retain bounded revision witness stdout separately
        if: always() && steps.storage.outcome == 'success'
        timeout-minutes: 1
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ios-reader-revision-witness-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .local/ios-reader-revision/evidence/revision-ui.stdout.log
            .local/ios-reader-revision/evidence/revision-ui.stderr.log
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 90
      - name: Retain the bounded raw result and owned cleanup receipts
        if: always() && steps.storage.outcome == 'success'
        timeout-minutes: 1
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ios-reader-revision-${{ github.run_id }}-${{ github.run_attempt }}
          path: .local/ios-reader-revision/evidence
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90
