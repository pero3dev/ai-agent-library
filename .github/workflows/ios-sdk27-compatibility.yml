name: iOS SDK 27 preview compatibility preflight

on:
  workflow_dispatch:
    inputs:
      run_smoke:
        description: 'Also run the owned iOS27 Native3 preview smoke job'
        type: boolean
        default: false
  pull_request:
    paths:
      - '.github/scripts/ios-sdk27-compatibility/**'
      - '.github/workflows/ios-sdk27-compatibility.yml'

permissions:
  contents: read

concurrency:
  group: ios-sdk27-compatibility-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios-sdk27-archive:
    name: iOS SDK 27 unsigned archive preflight
    # Standard public runners are documented free; refuse visibility changes.
    if: github.repository == 'pero3dev/ai-agent-library' && github.event.repository.private == false
    runs-on: xcode-27
    timeout-minutes: 40
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.app/Contents/Developer
      EVIDENCE_DIR: ${{ github.workspace }}/.local/ios-sdk27/evidence
      EXPECTED_SOURCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
      REPOSITORY_IS_PRIVATE: ${{ github.event.repository.private }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            ios/tools/package-lock.json
      - name: Create fresh evidence storage
        id: evidence
        run: |
          set -euo pipefail
          [[ ! -L .local && ! -e .local/ios-sdk27 && ! -L .local/ios-sdk27 ]]
          mkdir -p "$EVIDENCE_DIR"
          chmod 700 .local/ios-sdk27 "$EVIDENCE_DIR"
      - name: Verify the actual runner and documented Xcode SDK
        id: toolchain
        run: |
          set -euo pipefail
          node .github/scripts/ios-sdk27-compatibility/01-verify-the-actual-runner-and-documented-xcode-sdk.mts
      - name: Audit content tooling before installation
        run: |
          set -euo pipefail
          npm audit --package-lock-only --audit-level=high 2>&1 | tee "$EVIDENCE_DIR/root-lock-audit.log"
      - name: Install content tooling without lifecycle scripts
        run: |
          set -euo pipefail
          npm ci --ignore-scripts 2>&1 | tee "$EVIDENCE_DIR/root-npm-ci.log"
      - name: Audit native assets before installation
        working-directory: ios/tools
        run: |
          set -euo pipefail
          npm audit --package-lock-only --audit-level=high 2>&1 | tee "$EVIDENCE_DIR/tools-lock-audit.log"
      - name: Install native assets without lifecycle scripts
        working-directory: ios/tools
        run: |
          set -euo pipefail
          npm ci --ignore-scripts 2>&1 | tee "$EVIDENCE_DIR/tools-npm-ci.log"
          ./node_modules/.bin/playwright install chromium 2>&1 | tee "$EVIDENCE_DIR/chromium-install.log"
      - name: Count tracked published sources independently
        id: sources
        run: |
          set -euo pipefail
          expected_articles="$(node .github/scripts/ios-sdk27-compatibility/02-count-tracked-published-sources-independently.mts
          )"
          [[ "$expected_articles" =~ ^[1-9][0-9]*$ ]]
          printf 'PUBLISHED_ARTICLE_COUNT=%s\n' "$expected_articles" >> "$GITHUB_ENV"
      - name: Generate and audit standard full and fixture packages
        id: generation
        run: |
          set -euo pipefail
          npm run ios:prepare 2>&1 | tee "$EVIDENCE_DIR/published-generation.log"
          npm run ios:prepare:fixtures 2>&1 | tee "$EVIDENCE_DIR/fixture-generation.log"
          npm run --silent ios:test:content 2>&1 | tee "$EVIDENCE_DIR/published-source-audit.json"
          npm run --silent ios:test:fixtures 2>&1 | tee "$EVIDENCE_DIR/fixture-source-audit.json"
          npm run --silent ios:test:package -- "$PUBLISHED_ARTICLE_COUNT" 2>&1 | tee "$EVIDENCE_DIR/published-consumer.json"
          bash ios/tests/check-package.sh ios/AILibrary/TestContent 4 2>&1 | tee "$EVIDENCE_DIR/fixture-consumer.json"
      - name: Archive generic iPhoneOS Release with signing disabled
        id: archive
        run: |
          set -euo pipefail
          build_args=(
            -project ios/AILibrary.xcodeproj -scheme AILibrary
            -configuration Release -sdk iphoneos -destination 'generic/platform=iOS'
            -derivedDataPath .local/ios-sdk27/DerivedData -jobs 2
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY= DEVELOPMENT_TEAM=
          )
          xcodebuild "${build_args[@]}" -showBuildSettings -json \
            > "$EVIDENCE_DIR/release-build-settings.json" 2> "$EVIDENCE_DIR/release-build-settings.stderr.log"
          xcodebuild "${build_args[@]}" \
            -archivePath .local/ios-sdk27/AILibrary.xcarchive \
            -resultBundlePath "$EVIDENCE_DIR/archive.xcresult" archive \
            2>&1 | tee "$EVIDENCE_DIR/archive.log"
      - name: Validate the actual archived app package
        id: package
        run: |
          set -euo pipefail
          app='.local/ios-sdk27/AILibrary.xcarchive/Products/Applications/AILibrary.app'
          node ios/tests/check-release-package.mjs "$app" 2>&1 | tee "$EVIDENCE_DIR/release-package.json"
          bash ios/tests/check-package.sh "$app/Content" "$PUBLISHED_ARTICLE_COUNT" 2>&1 | tee "$EVIDENCE_DIR/archive-consumer.json"
      - name: Audit metadata, all app SHA values, device binary and dSYM
        id: binary
        run: |
          set -euo pipefail
          node .github/scripts/ios-sdk27-compatibility/03-audit-metadata-all-app-sha-values-device-binary-and-dsym.mts 2>&1 | tee "$EVIDENCE_DIR/archive-audit.log"
      - name: Record compact completion or failure
        if: always() && steps.evidence.outcome == 'success'
        env:
          TOOLCHAIN_OUTCOME: ${{ steps.toolchain.outcome }}
          SOURCES_OUTCOME: ${{ steps.sources.outcome }}
          GENERATION_OUTCOME: ${{ steps.generation.outcome }}
          ARCHIVE_OUTCOME: ${{ steps.archive.outcome }}
          PACKAGE_OUTCOME: ${{ steps.package.outcome }}
          BINARY_OUTCOME: ${{ steps.binary.outcome }}
        run: |
          set -euo pipefail
          node .github/scripts/ios-sdk27-compatibility/04-record-compact-completion-or-failure.mts
      - name: Stage bounded raw and compact evidence
        id: artifact_scope
        timeout-minutes: 1
        if: always() && steps.evidence.outcome == 'success'
        run: |
          set -euo pipefail
          node .github/scripts/ios-sdk27-compatibility/05-stage-bounded-raw-and-compact-evidence.mts
      - name: Retain bounded preview evidence
        timeout-minutes: 2
        if: always() && steps.evidence.outcome == 'success' && steps.artifact_scope.outcome != 'skipped'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ios-sdk27-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: .local/ios-sdk27/artifact
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
  ios-runtime27-smoke:
    name: iOS 27.0 representative UI smoke
    # Exact public-repository gate is evaluated before allocating a standard VM.
    if: github.repository == 'pero3dev/ai-agent-library' && github.event.repository.private == false && (github.event_name == 'pull_request' || inputs.run_smoke == true)
    runs-on: xcode-27
    # Explicit step caps total51min, including2min diagnostics,4min cleanup,1min staging and2min upload.
    # UI is followed by owned cleanup; diagnostics reuse the later primary result. Cancelled app/result audits skip.
    # Forced cancellation/runner loss can still interrupt cleanup or upload.
    timeout-minutes: 40
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.app/Contents/Developer
      EVIDENCE_DIR: ${{ github.workspace }}/.local/ios-runtime27/evidence
      EXPECTED_SOURCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
      REPOSITORY_IS_PRIVATE: ${{ github.event.repository.private }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        timeout-minutes: 2
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            ios/tools/package-lock.json
      - name: Create fresh private evidence storage
        timeout-minutes: 1
        id: evidence
        run: |
          set -euo pipefail
          [[ ! -L .local && ! -e .local/ios-runtime27 && ! -L .local/ios-runtime27 ]]
          mkdir -p "$EVIDENCE_DIR"
          chmod 700 .local/ios-runtime27 "$EVIDENCE_DIR"
      - name: Verify toolchain and select documented runtime and device type
        timeout-minutes: 3
        id: inventory
        run: |
          set -euo pipefail
          node .github/scripts/ios-sdk27-compatibility/06-verify-toolchain-and-select-documented-runtime-and-device-type.mts
      - name: Audit content tooling before installation
        timeout-minutes: 1
        id: root_audit
        run: |
          set -euo pipefail
          npm audit --package-lock-only --audit-level=high 2>&1 | tee "$EVIDENCE_DIR/root-lock-audit.log"
      - name: Install content tooling without lifecycle scripts
        timeout-minutes: 2
        id: root_install
        run: |
          set -euo pipefail
          npm ci --ignore-scripts 2>&1 | tee "$EVIDENCE_DIR/root-npm-ci.log"
      - name: Audit native asset tooling before installation
        timeout-minutes: 1
        id: tools_audit
        working-directory: ios/tools
        run: |
          set -euo pipefail
          npm audit --package-lock-only --audit-level=high 2>&1 | tee "$EVIDENCE_DIR/tools-lock-audit.log"
      - name: Install native assets without lifecycle scripts
        timeout-minutes: 2
        id: tools_install
        working-directory: ios/tools
        run: |
          set -euo pipefail
          npm ci --ignore-scripts 2>&1 | tee "$EVIDENCE_DIR/tools-npm-ci.log"
      - name: Install the lockfile-matched Chromium
        timeout-minutes: 2
        id: browser
        working-directory: ios/tools
        run: |
          set -euo pipefail
          ./node_modules/.bin/playwright install chromium 2>&1 | tee "$EVIDENCE_DIR/chromium-install.log"
      - name: Generate and audit representative three and separate fixture four
        timeout-minutes: 4
        id: content
        run: |
          set -euo pipefail
          # Direct CLI defaults retain representative compatibility before PR261.
          node scripts/build-ios-native-content.mjs 2>&1 | tee "$EVIDENCE_DIR/representative-generation.log"
          node scripts/build-ios-native-content.mjs --fixtures 2>&1 | tee "$EVIDENCE_DIR/fixture-generation.log"
          node ios/tests/native-content-audit.mjs 2>&1 | tee "$EVIDENCE_DIR/representative-source-audit.json"
          node ios/tests/native-content-audit.mjs --fixtures 2>&1 | tee "$EVIDENCE_DIR/fixture-source-audit.json"
          bash ios/tests/check-package.sh ios/AILibrary/Content 3 2>&1 | tee "$EVIDENCE_DIR/representative-consumer.json"
          bash ios/tests/check-package.sh ios/AILibrary/TestContent 4 2>&1 | tee "$EVIDENCE_DIR/fixture-consumer.json"
      - name: Create and boot this job's dedicated Simulator
        timeout-minutes: 6
        id: simulator
        run: |
          set -euo pipefail
          node .github/scripts/ios-sdk27-compatibility/07-create-and-boot-this-job-s-dedicated-simulator.mts
      - name: Run exactly the three native UI smoke cases
        timeout-minutes: 12
        id: ui
        run: |
          set -euo pipefail
          owned_uuid="$(node .github/scripts/ios-sdk27-compatibility/08-run-exactly-the-three-native-ui-smoke-cases.mts
          )"
          set +e
          xcodebuild -project ios/AILibrary.xcodeproj -scheme AILibrary \
            -configuration Debug -destination "platform=iOS Simulator,id=$owned_uuid" \
            -destination-timeout 120 \
            -derivedDataPath .local/ios-runtime27/DebugDerivedData \
            -resultBundlePath "$EVIDENCE_DIR/ui.xcresult" \
            -parallel-testing-enabled NO -jobs 2 \
            -only-testing:AILibraryUITests/NativeReaderUITests \
            CODE_SIGNING_ALLOWED=NO test 2>&1 | tee "$EVIDENCE_DIR/xctest-ui.log"
          statuses=("${PIPESTATUS[@]}")
          set -e
          printf '{"xcodebuild_exit_code":%s,"tee_exit_code":%s}\n' "${statuses[0]}" "${statuses[1]}" > "$EVIDENCE_DIR/ui-command.exit.json"
          [[ "${statuses[0]}" -eq 0 && "${statuses[1]}" -eq 0 ]]
      - name: Always clean up only the Simulator created by this job
        timeout-minutes: 4
        id: cleanup
        if: always() && steps.evidence.outcome == 'success'
        run: |
          set -euo pipefail
          node .github/scripts/ios-sdk27-compatibility/09-always-clean-up-only-the-simulator-created-by-this-job.mts
      - name: Audit actual Debug app packages after the attempted UI build
        timeout-minutes: 2
        id: app
        if: always() && !cancelled() && steps.ui.outcome != 'skipped' && steps.evidence.outcome == 'success'
        run: |
          set -euo pipefail
          debug_app='.local/ios-runtime27/DebugDerivedData/Build/Products/Debug-iphonesimulator/AILibrary.app'
          [[ -d "$debug_app" && ! -L "$debug_app" ]]
          cmp ios/AILibrary/Content/manifest.json "$debug_app/Content/manifest.json"
          bash ios/tests/check-package.sh "$debug_app/Content" 3 2>&1 | tee "$EVIDENCE_DIR/debug-app-package.json"
          cmp ios/AILibrary/TestContent/manifest.json "$debug_app/TestContent/manifest.json"
          bash ios/tests/check-package.sh "$debug_app/TestContent" 4 2>&1 | tee "$EVIDENCE_DIR/debug-fixture-package.json"
      - name: Require exactly three passed UI cases from the raw result
        timeout-minutes: 1
        id: results
        if: always() && !cancelled() && steps.ui.outcome != 'skipped' && steps.evidence.outcome == 'success'
        run: |
          set -euo pipefail
          node .github/scripts/ios-sdk27-compatibility/10-require-exactly-three-passed-ui-cases-from-the-raw-result.mts
      - name: Capture bounded failure PNGs from cached primary results
        id: reader_diagnostics
        timeout-minutes: 2
        continue-on-error: true
        if: always() && !cancelled() && steps.ui.outcome != 'skipped' && steps.evidence.outcome == 'success'
        env:
          UI_OUTCOME: ${{ steps.ui.outcome }}
        run: node ios/tests/capture-reader-failure-diagnostics.mjs
      - name: Record completion and all skipped or failed stages
        timeout-minutes: 1
        if: always() && steps.evidence.outcome == 'success'
        env:
          INVENTORY_OUTCOME: ${{ steps.inventory.outcome }}
          ROOT_AUDIT_OUTCOME: ${{ steps.root_audit.outcome }}
          ROOT_INSTALL_OUTCOME: ${{ steps.root_install.outcome }}
          TOOLS_AUDIT_OUTCOME: ${{ steps.tools_audit.outcome }}
          TOOLS_INSTALL_OUTCOME: ${{ steps.tools_install.outcome }}
          BROWSER_OUTCOME: ${{ steps.browser.outcome }}
          CONTENT_OUTCOME: ${{ steps.content.outcome }}
          SIMULATOR_OUTCOME: ${{ steps.simulator.outcome }}
          UI_OUTCOME: ${{ steps.ui.outcome }}
          APP_OUTCOME: ${{ steps.app.outcome }}
          RESULTS_OUTCOME: ${{ steps.results.outcome }}
          CLEANUP_OUTCOME: ${{ steps.cleanup.outcome }}
        run: |
          set -euo pipefail
          node .github/scripts/ios-sdk27-compatibility/11-record-completion-and-all-skipped-or-failed-stages.mts
      - name: Stage bounded raw and compact evidence
        id: artifact_scope
        timeout-minutes: 1
        if: always() && steps.evidence.outcome == 'success'
        run: |
          set -euo pipefail
          node .github/scripts/ios-sdk27-compatibility/12-stage-bounded-raw-and-compact-evidence.mts
      - name: Retain bounded preview evidence
        timeout-minutes: 2
        if: always() && steps.evidence.outcome == 'success' && steps.artifact_scope.outcome != 'skipped'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ios-runtime27-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: .local/ios-runtime27/artifact
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
