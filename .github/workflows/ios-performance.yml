          path: .local/ios-runtime26/compact-diagnostic
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
      - name: Retain raw context, results and cleanup evidence
        timeout-minutes: 2
        if: always() && steps.evidence.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ios-runtime26-smoke-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: .local/ios-runtime26/evidence
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
