# CI(WEBSITE-PLAN §8 W5): markdownlint + docs 検証 + サイトビルド(+ 条件付き GitHub Pages デプロイ)
#
# デプロイは既定で無効。有効化するにはリポジトリの Actions 変数(Settings → Secrets and variables → Actions → Variables)に
#   DEPLOY_PAGES = true
#   SITE_URL     = 公開 URL(例: https://<owner>.github.io/ai-agent-library)
#   SITE_BASE_PATH = サブパス(例: /ai-agent-library。ルート配信なら未設定)
# を設定し、Settings → Pages → Source を「GitHub Actions」にする。
#
# セキュリティ方針(監査バッチ B):
# - 既定の GITHUB_TOKEN は最小権限(contents: read)。書き込みが要るジョブでのみ昇格する
# - checkout は persist-credentials: false(以降のステップに認証情報を残さない)
# - サードパーティを含む全 Action をコミット SHA で固定(タグは可変で改竄されうる)
name: CI

on:
  push:
    branches: [main]
  pull_request:

# 既定は読み取りのみ。deploy ジョブだけが必要な権限を明示的に足す
permissions:
  contents: read

# 同一ブランチの古い実行はキャンセルする(main のデプロイ実行は中断しない)
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      # markdownlint-cli は devDependency として lockfile で固定(旧: npx --yes で毎回取得)
      - name: Install dependencies
        run: npm ci
      - name: markdownlint
        run: npm run lint:md

  # ワークフロー定義自体の静的検査。バイナリは版と SHA256 を固定して取得する
  actionlint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Run actionlint
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          set -euo pipefail
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSL -o "$archive" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${archive}"
          echo "${ACTIONLINT_SHA256}  ${archive}" | sha256sum -c -
          tar -xzf "$archive" actionlint
          ./actionlint -color

  # docs の規約検証(scripts/ は依存ゼロなので npm ci 不要)
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: front matter / 固定 H2 / TODO(要確認) 書式
        run: node scripts/validate-docs.mjs --all
      - name: 相対リンク切れ / セクション README 収録表
        run: node scripts/check-links.mjs

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: website
      # high 以上のみ失敗させる。moderate の postcss(Next が 8.4.31 を固定)は
      # 静的サイトで未信頼 CSS を処理しないため、上流の更新まで期限付きで受容する
      - name: npm audit (high 以上で失敗)
        run: npm audit --audit-level=high
        working-directory: website
      # prebuild(sync)が未解決リンク・許可外 MDX・読込失敗で exit 1、
      # postbuild が generated/routes.json とのルート網羅を照合して exit 1 する
      - name: Build (static export)
        run: npm run build
        working-directory: website
        env:
          STATIC_EXPORT: '1'
          NEXT_PUBLIC_BASE_PATH: ${{ vars.SITE_BASE_PATH || '' }}
          NEXT_PUBLIC_SITE_URL: ${{ vars.SITE_URL || '' }}
      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: website/out

  deploy:
    if: github.ref == 'refs/heads/main' && vars.DEPLOY_PAGES == 'true'
    needs: [lint, actionlint, build, docs]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
