name: NEVERMERGE - iOS reading-position diagnostic (2 original cases)

on:
  push:
    branches: [codex/ios-native-reading-position-diagnostic]

permissions:
  contents: read

concurrency:
  group: ios-native-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  ios-native:
    name: NEVERMERGE - original recovery-position samples (2)
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/codex/ios-native-reading-position-diagnostic' && github.repository == 'pero3dev/ai-agent-library' && !github.event.deleted }}
    runs-on: macos-15-intel
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
      AILIBRARY_NATIVE_SOURCE_HEAD: ${{ github.sha }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            ios/tools/package-lock.json
      - name: Audit content tooling before installation
        run: npm audit --package-lock-only --audit-level=high
      - name: Install content tooling without lifecycle scripts
        run: npm ci --ignore-scripts
      - name: Audit native asset tooling before installation
        run: npm audit --package-lock-only --audit-level=high
        working-directory: ios/tools
      - name: Install native asset tooling without lifecycle scripts
        run: npm ci --ignore-scripts
        working-directory: ios/tools
      - name: Install the lockfile-matched Chromium
        run: ./node_modules/.bin/playwright install chromium
        working-directory: ios/tools
      - name: Record toolchain and test scope
        run: |
          set -euo pipefail
          mkdir -p .local/ios-ci/evidence
          {
            xcodebuild -version
            node --version
            npm --version
            echo 'Simulator target: fresh owned iPhone 16 / iOS 18.5; preparation records actual inventory.'
            echo 'NEVERMERGE diagnostic only: 2 original recovery-position cases with reviewed Trace8.'
            echo 'No normal Unit, Release, Native8, Full26 or physical-device acceptance.'
          } | tee .local/ios-ci/evidence/environment.log
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readFileSync, writeFileSync } from 'node:fs';
          const env = process.env, branch = 'refs/heads/codex/ios-native-reading-position-diagnostic';
          assert.equal(env.GITHUB_ACTIONS, 'true'); assert.equal(env.GITHUB_EVENT_NAME, 'push');
          assert.equal(env.GITHUB_REF, branch); assert.equal(env.GITHUB_JOB, 'ios-native');
          assert.equal(env.GITHUB_REPOSITORY, 'pero3dev/ai-agent-library');
          const event = JSON.parse(readFileSync(env.GITHUB_EVENT_PATH, 'utf8'));
          assert.equal(event.repository.full_name, env.GITHUB_REPOSITORY); assert.equal(event.repository.private, false);
          assert.equal(event.deleted, false); assert.match(env.GITHUB_SHA, /^[a-f0-9]{40}$/);
          assert.equal(event.after, env.GITHUB_SHA); assert.equal(env.AILIBRARY_NATIVE_SOURCE_HEAD, env.GITHUB_SHA);
          writeFileSync('.local/ios-ci/evidence/diagnostic-scope.json', JSON.stringify({
            status: 'NEVERMERGE-diagnostic-scope-only', repository: env.GITHUB_REPOSITORY, event: env.GITHUB_EVENT_NAME,
            ref: env.GITHUB_REF, job: env.GITHUB_JOB, source_head: env.GITHUB_SHA, checkout_expected: env.GITHUB_SHA,
            run_id: env.GITHUB_RUN_ID, run_attempt: env.GITHUB_RUN_ATTEMPT,
            selected_case_IDs: [
              'ReadingRecoveryUITests/testConfirmedRecoveryPreservesCurrentPositionAndBookmarkAfterRelaunch()',
              'ReadingRecoveryUITests/testExportFilePickerCancelKeepsHealthyPositionAndBookmarkAfterRelaunch()'
            ], selected_count: 2, original_profile: 'Native3+Recovery5 isolated canonical UUID suite; 2-case subset only',
            Trace8_code_MF: '9570d5693483150b9bd6133929176d09666f1669cee26a8b9d3dd2dfbe995066',
            normal_Unit_Release_Native8_Full26_acceptance: false,
            compact_scope: 'Unchanged first failed case only; full ui.xcresult retains both selected cases'
          }, null, 2) + '\n', { flag: 'wx', mode: 0o600 });
          NODE
      - name: Prepare one fresh owned Native Simulator
        id: native_simulator
        timeout-minutes: 9
        run: node ios/tests/native-simulator-prepare.mjs prepare
      - name: Check the frozen AppIcon source assets
        run: |
          set -euo pipefail
          node ios/tools/app-icon.mjs --check \
            2>&1 | tee .local/ios-ci/evidence/app-icon-source.json
      - name: Generate and audit representative and fixture packages
        run: |
          set -euo pipefail
          {
            npm run ios:prepare:representative
            npm run ios:prepare:fixtures
            npm run ios:test:content:representative
            npm run ios:test:fixtures
          } 2>&1 | tee .local/ios-ci/evidence/content-and-core.log
      # Diagnostic setup builds the same app and UI target without running normal units.
      - name: Build the two selected original UI cases for the Debug icon audit
        env:
          AILIBRARY_NATIVE_DESTINATION: ${{ steps.native_simulator.outputs.destination }}
        run: |
          set -euo pipefail
          test -n "$AILIBRARY_NATIVE_DESTINATION"
          xcodebuild -project ios/AILibrary.xcodeproj -scheme AILibrary \
            -configuration Debug \
            -destination "$AILIBRARY_NATIVE_DESTINATION" \
            -destination-timeout 120 \
            -derivedDataPath .local/ios-ci/DebugDerivedData \
            -parallel-testing-enabled NO -jobs 2 \
            -only-testing:AILibraryUITests/ReadingRecoveryUITests/testConfirmedRecoveryPreservesCurrentPositionAndBookmarkAfterRelaunch \
            -only-testing:AILibraryUITests/ReadingRecoveryUITests/testExportFilePickerCancelKeepsHealthyPositionAndBookmarkAfterRelaunch \
            CODE_SIGNING_ALLOWED=NO build-for-testing \
            2>&1 | tee .local/ios-ci/evidence/ui-build.log
      - name: Audit AppIcon metadata in the actual Debug app
        run: |
          set -euo pipefail
          if ! node ios/tests/capture-built-app-icon.mjs .local/ios-ci/DebugDerivedData/Build/Products/Debug-iphonesimulator/AILibrary.app \
            --output .local/ios-ci/evidence/native-debug-icon-inputs; then
            printf '%s\n' 'AppIcon diagnostic capture failed; continuing required icon audit.' >&2
          fi
          node ios/tests/check-built-app-icon.mjs \
            .local/ios-ci/DebugDerivedData/Build/Products/Debug-iphonesimulator/AILibrary.app \
            --required-scales 3 \
            2>&1 | tee .local/ios-ci/evidence/debug-app-icon.json
      # Exact original methods and Trace8 opt-in/setup remain unchanged.
      # This two-case diagnostic never establishes normal Native8 acceptance.
      - name: Run only the two original recovery-position diagnostic cases
        id: native_ui
        env:
          AILIBRARY_NATIVE_DESTINATION: ${{ steps.native_simulator.outputs.destination }}
        run: |
          set -euo pipefail
          test -n "$AILIBRARY_NATIVE_DESTINATION"
          xcodebuild -project ios/AILibrary.xcodeproj -scheme AILibrary \
            -configuration Debug \
            -destination "$AILIBRARY_NATIVE_DESTINATION" \
            -destination-timeout 120 \
            -derivedDataPath .local/ios-ci/DebugDerivedData \
            -resultBundlePath .local/ios-ci/evidence/ui.xcresult \
            -parallel-testing-enabled NO -jobs 2 \
            -only-testing:AILibraryUITests/ReadingRecoveryUITests/testConfirmedRecoveryPreservesCurrentPositionAndBookmarkAfterRelaunch \
            -only-testing:AILibraryUITests/ReadingRecoveryUITests/testExportFilePickerCancelKeepsHealthyPositionAndBookmarkAfterRelaunch \
            CODE_SIGNING_ALLOWED=NO test \
            2>&1 | tee .local/ios-ci/evidence/xctest-ui.log
      - name: Retain both diagnostic case results and compact build evidence
        id: native_full_evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ios-native-reading-position-diagnostic-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: .local/ios-ci/evidence
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 90
      # Optional post-failure diagnostics follow the original full upload.
      - name: Collect selected Native failure attachments within a small budget
        id: native_failure_compact
        if: always() && !cancelled() && steps.native_ui.outcome == 'failure'
        continue-on-error: true
        timeout-minutes: 2
        env:
          AILIBRARY_NATIVE_UI_OUTCOME: ${{ steps.native_ui.outcome }}
          AILIBRARY_FULL_ARTIFACT_OUTCOME: ${{ steps.native_full_evidence.outcome }}
        run: |
          set -euo pipefail
          node ios/tests/native-failure-attachments.mjs
          printf '%s\n' 'closed=true' >> "$GITHUB_OUTPUT"
      - name: Retain optional selected Native failure attachments
        if: always() && !cancelled() && steps.native_ui.outcome == 'failure' && steps.native_failure_compact.outputs.closed == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ios-native-reading-position-diagnostic-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: .local/ios-ci/native-failure-compact/ready
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 90
      - name: Clean up only the proven owned Native Simulator
        if: always()
        timeout-minutes: 3
        env:
          AILIBRARY_NATIVE_OWNER_TOKEN: ${{ steps.native_simulator.outputs.owner_token }}
          AILIBRARY_NATIVE_CREATED_UUID: ${{ steps.native_simulator.outputs.created_uuid }}
        run: node ios/tests/native-simulator-prepare.mjs cleanup
      - name: Retain bounded Native Simulator ownership receipts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ios-native-reading-position-diagnostic-simulator-${{ github.run_id }}-${{ github.run_attempt }}
          path: .local/ios-ci/evidence/native-simulator
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 90
